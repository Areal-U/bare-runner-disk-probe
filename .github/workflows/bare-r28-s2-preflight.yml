name: Bare R28 fixed S2 preflight
run-name: r28-preflight-s2-20261125-v1 / S2 transport
'on':
  pull_request:
    types:
    - synchronize
    branches:
    - bare-coexist-v2.0.4
    paths:
    - .github/workflows/bare-r28-s2-preflight.yml
permissions: {}
cache-mode: none
concurrency:
  group: r28-preflight-s2-20261125-v1-s2
  cancel-in-progress: false
env:
  EXPECTED_BEFORE: b9553267cbb4f1645db9d2d40c4d85eb68c26d5d
  TRIAL_SHA: ${{ github.event.pull_request.head.sha }}
defaults:
  run:
    shell: bash
jobs:
  produce:
    runs-on: ubuntu-24.04
    permissions: &id002
      actions: read
      contents: write
    timeout-minutes: 215
    name: Create one S2 successor and transfer to fixed private Draft
    cache-mode: read
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number == 9 && github.actor
      == 'Areal-U' && github.triggering_actor == 'Areal-U' && github.event.repository.fork == false && github.repository == 'Areal-U/bare-runner-disk-probe'
      && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name == github.repository
      && github.head_ref == 'work-bare-27-storage-check' && github.base_ref == 'bare-coexist-v2.0.4' && github.event.pull_request.base.sha ==
      'bf70ddbf474f3390a62220a076b8c43347fecc64' && github.event.before == 'b9553267cbb4f1645db9d2d40c4d85eb68c26d5d' && github.run_attempt ==
      '1' }}
    outputs:
      manifest_id: ${{ steps.send.outputs.manifest_id }}
      manifest_sha: ${{ steps.send.outputs.manifest_sha }}
    steps:
    - &id003
      name: Check out the trusted PR head without persisting credentials
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false
    - &id004
      name: Stage graph/graph.py
      run: |
        set -euo pipefail
        mkdir -p preflight28/graph
        cat > preflight28/graph/graph.py <<'REVIEWED_R28_GRAPH_GRAPH_PY'
        #!/usr/bin/env python3
        """Prove forward progress for the pinned APK using the actual Siso planner."""
        import argparse
        import contextlib
        import hashlib
        import json
        import os
        from pathlib import Path
        import re
        import shutil
        import stat
        import subprocess
        import tempfile
        import time

        TARGET = "chrome_public_apk"
        FORMAT = "bare-28-apk-frontier-1"
        END = re.compile(rb"Build Succeeded: (\d+) steps -")


        def sha(path):
            digest = hashlib.sha256()
            with path.open("rb") as stream:
                for block in iter(lambda: stream.read(1024 * 1024), b""):
                    digest.update(block)
            return digest.hexdigest()


        def canonical(value):
            return hashlib.sha256(json.dumps(value, ensure_ascii=True, separators=(",", ":"),
                                             sort_keys=True).encode("ascii")).hexdigest()


        def fixed_graph(out):
            # GN may regenerate the files. Content, paths and pinned inputs must agree.
            records = [(str(p.relative_to(out)), sha(p)) for p in sorted(out.rglob("*.ninja"))
                       if p.is_file()]
            if not records or not (out / "build.ninja").is_file():
                raise ValueError("missing GN manifest")
            return canonical(records)


        def output_name(value, out):
            if not isinstance(value, str) or not value or any(ord(c) < 32 for c in value):
                raise ValueError("invalid Siso output")
            p = Path(value)
            if p.is_absolute():
                p = p.relative_to(out)
            elif p.parts[:2] == ("out", "Bare"):
                p = Path(*p.parts[2:])
            if not p.parts or ".." in p.parts or "\\" in value:
                raise ValueError("output outside build directory: " + value)
            return p.as_posix()


        def parse_metrics(metrics, count, out, *, actual):
            edges = {}
            seen_step = set()
            summary = False
            if not metrics.exists() and count == 0:
                return edges
            with metrics.open(encoding="utf-8") as stream:
                for line in stream:
                    step = json.loads(line)
                    if "step_id" not in step:
                        if "build_id" in step:
                            summary = True
                        continue
                    if step["step_id"] in seen_step or step.get("err", False):
                        raise ValueError("duplicate or failed metric")
                    seen_step.add(step["step_id"])
                    raw = step.get("outputs")
                    if not isinstance(raw, list) or not raw:
                        raise ValueError("missing declared step output group")
                    names = tuple(sorted(output_name(n, out) for n in raw))
                    if names in edges or len(set(names)) != len(names):
                        raise ValueError("ambiguous edge output group")
                    if actual and not step.get("is_local", False):
                        raise ValueError("small preflight edge did not execute locally")
                    edges[names] = step.get("action", "")
            if count != len(edges) or (count and not summary):
                raise ValueError(f"incomplete Siso metrics: {len(edges)} of {count} steps")
            return edges


        @contextlib.contextmanager
        def preserve_ninja_log(out):
            # v1.6.5 writes .ninja_log in the output directory even on -n with an
            # isolated -state_dir/-log_dir. The runner has a single exclusive writer.
            src = out / ".ninja_log"
            with tempfile.TemporaryDirectory(prefix=".round28-plan-", dir=out) as name:
                before = Path(name) / "original"
                if src.exists() or src.is_symlink():
                    if not stat.S_ISREG(src.lstat().st_mode):
                        raise ValueError("unexpected Ninja log file type")
                    src.rename(before)
                try:
                    if before.exists():
                        shutil.copy2(before, src)
                    yield
                finally:
                    if before.exists():
                        os.replace(before, src)
                    else:
                        src.unlink(missing_ok=True)


        def run(out, command, targets, *, dry, noop=False):
            start = time.monotonic()
            with tempfile.TemporaryDirectory(prefix="bare28-plan-") as name:
                tmp = Path(name)
                metrics = tmp / "metrics.jsonl"
                args = [*command, "-C", str(out), "-j", "2", "-metrics_json", str(metrics)]
                if dry:
                    state = tmp / "state"
                    state.mkdir()
                    for basename in (".siso_deps", ".siso_fs_state", ".siso_fs_state.journal"):
                        path = out / basename
                        if path.exists():
                            if not stat.S_ISREG(path.lstat().st_mode):
                                raise ValueError("unexpected Siso state type")
                            shutil.copy2(path, state / basename)
                    args.extend(["-n", "-state_dir", os.path.relpath(state, out),
                                 "-log_dir", str(tmp / "logs")])
                with (tmp / "console").open("w+b") as console:
                    with preserve_ninja_log(out) if (dry or noop) else contextlib.nullcontext():
                        process = subprocess.run([*args, *targets], stdout=console,
                                                 stderr=subprocess.STDOUT, timeout=600, check=False)
                        console.seek(max(0, console.tell() - 8192))
                        tail = console.read()
                    counts = END.findall(tail)
                    if process.returncode or len(counts) != 1 or b"Build Failed" in tail:
                        raise ValueError("Siso completion/step count unavailable: "
                                         + tail[-1000:].decode(errors="replace"))
                edges = parse_metrics(metrics, int(counts[0]), out, actual=not dry)
            print(json.dumps({"operation": "plan" if dry else "execute",
                              "target": targets[0], "steps": len(edges),
                              "seconds": round(time.monotonic() - start, 2)}), flush=True)
            return edges


        def file_record(out, name):
            path = out / name
            if path.resolve().parent != path.parent or not stat.S_ISREG(path.lstat().st_mode):
                raise ValueError("target is not a regular file in the build tree")
            return [path.stat().st_size, sha(path)]


        def frontier(edges):
            return {canonical(names) for names in edges}


        def compare(parent, child, selected):
            if not child < parent or not selected <= (parent - child) or not selected:
                raise ValueError("APK frontier regressed or selected edge remains dirty")


        def pick(out, command, edges):
            # A small missing object with no other dirty prerequisites. Prefer an
            # early scheduled group over an arbitrary source object from another target.
            ranked = []
            for index, group in enumerate(edges):
                for n in group:
                    if n.startswith("obj/") and n.endswith(".o") and not (out / n).exists():
                        ranked.append((index, n, group))
                        break
            for _, target, group in sorted(ranked)[:32]:
                plan = run(out, command, [target], dry=True)
                if set(plan) == {group}:
                    return target, group
            raise ValueError("no missing single-step APK ancestor found among initial objects")


        def check_selected(out, command, names, expected):
            if {n: file_record(out, n) for n in names} != expected:
                raise ValueError("selected edge bytes changed or missing")
            if run(out, command, list(names), dry=True):
                raise ValueError("restored selected edge/dependencies require work")
            if run(out, command, list(names), dry=False, noop=True):
                raise ValueError("Siso actually executed a supposedly clean step")


        def produce(out, proof, command):
            if proof.exists():
                raise ValueError("proof already exists on initial parent")
            graph_id = fixed_graph(out)
            original = run(out, command, [TARGET], dry=True)
            parent = frontier(original)
            target, group = pick(out, command, original)
            executed = run(out, command, [target], dry=False)
            if set(executed) != {group}:
                raise ValueError("target executed different prerequisites or output group")
            log = (out / ".ninja_log").read_text(encoding="utf-8").splitlines()
            if not log or log[0].strip() != "# ninja log v5":
                raise ValueError("missing Ninja v5 success evidence")
            recorded = {output_name(fields[3], out) for line in log[1:]
                        if len(fields := line.split("\t")) == 5}
            if not set(group) <= recorded:
                raise ValueError("Ninja and Siso disagree about executed outputs")
            records = {n: file_record(out, n) for n in group}
            check_selected(out, command, group, records)
            child = frontier(run(out, command, [TARGET], dry=True))
            compare(parent, child, {canonical(group)})
            if graph_id != fixed_graph(out):
                raise ValueError("GN graph changed while measuring")
            data = {"format": FORMAT, "target": TARGET, "graph_sha256": graph_id,
                    "parent_pending": sorted(parent), "successor_pending": sorted(child),
                    "target_path": target, "outputs": records}
            with proof.open("x", encoding="ascii") as stream:
                json.dump(data, stream, ensure_ascii=True, separators=(",", ":"), sort_keys=True)
            return {"parent_dirty": len(parent), "child_dirty": len(child), "new_target": target,
                    "proof_sha256": sha(proof), "outputs": records}


        def receive(out, proof, command):
            if proof.stat().st_size > 64 * 1024**2:
                raise ValueError("unbounded graph proof")
            data = json.loads(proof.read_text(encoding="ascii"))
            if (data["format"] != FORMAT or data["target"] != TARGET
                    or data["graph_sha256"] != fixed_graph(out)):
                raise ValueError("graph provenance changed")
            records = data["outputs"]
            group = tuple(sorted(records))
            if not group or data["target_path"] not in group or any(output_name(n, out) != n for n in group):
                raise ValueError("invalid recorded group")
            check_selected(out, command, group, records)
            observed = frontier(run(out, command, [TARGET], dry=True))
            if observed != set(data["successor_pending"]):
                raise ValueError("independent restore has a different APK plan")
            compare(set(data["parent_pending"]), observed, {canonical(group)})
            return {"parent_dirty": len(data["parent_pending"]), "restored_dirty": len(observed),
                    "restored_target": data["target_path"], "proof_sha256": sha(proof)}


        if __name__ == "__main__":
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument("action", choices=["produce", "receive"])
            parser.add_argument("--out", type=Path, required=True)
            parser.add_argument("--proof", type=Path, required=True)
            args = parser.parse_args()
            result = {"produce": produce, "receive": receive}[args.action](
                args.out.resolve(), args.proof, ["autoninja"])
            print(json.dumps(result, sort_keys=True))
        REVIEWED_R28_GRAPH_GRAPH_PY
    - &id005
      name: Stage limits/guard.py
      run: |
        set -euo pipefail
        mkdir -p preflight28/limits
        cat > preflight28/limits/guard.py <<'REVIEWED_R28_LIMITS_GUARD_PY'
        #!/usr/bin/env python3
        """Bounded resource and delivery checks for a single Bare runner segment."""
        import argparse
        import concurrent.futures
        from datetime import datetime
        import http.client
        import json
        import os
        from pathlib import Path
        import signal
        import stat
        import subprocess
        import sys
        import time

        MIB = 1024 ** 2
        GIB = 1024 ** 3
        BYTE_CAPS = {'apk': 450 * MIB, 'cipher': 451 * MIB, 'checkpoint': 7 * GIB // 2}
        FLOOR = 20 * GIB
        INODE_FLOOR = 20_000
        OUT_CAP = 18 * GIB
        ENTRY_CAP = 525_000
        # R20 grew by 509,147,136 bytes while free space fell by 511,643,648 bytes
        # within 25.49 seconds. These margins are trial thresholds, not physical bounds.
        STOP_MARGIN = GIB
        FAST_MARGIN = 2 * GIB
        STOP_ENTRIES = 10_000
        FAST_ENTRIES = 20_000


        class GuardError(Exception):
            def __init__(self, reason, **details):
                super().__init__(reason)
                self.record = {'status': reason, **details}


        def check_size(kind, path):
            mode = path.lstat()
            if not stat.S_ISREG(mode.st_mode) or mode.st_size == 0:
                raise GuardError('invalid-file', kind=kind, size=mode.st_size)
            if mode.st_size > BYTE_CAPS[kind]:
                raise GuardError('size-exceeded', kind=kind, size=mode.st_size, limit=BYTE_CAPS[kind], retry=False)
            return {'status': 'within-size-limit', 'kind': kind, 'size': mode.st_size, 'limit': BYTE_CAPS[kind]}


        def disk(path):
            fs = os.statvfs(path)
            return {'device': os.stat(path).st_dev, 'free_bytes': fs.f_bavail * fs.f_frsize, 'free_inodes': fs.f_favail}


        def reserve(space, extra_bytes, extra_inodes, floor=FLOOR, inode_floor=INODE_FLOOR):
            if min(extra_bytes, extra_inodes) < 0 or floor < FLOOR or inode_floor < INODE_FLOOR:
                raise ValueError('Invalid incremental allocation or safety floor')
            result = dict(space, future_bytes=extra_bytes, future_inodes=extra_inodes,
                          byte_floor=floor, inode_floor=inode_floor)
            if space['free_bytes'] < floor + extra_bytes or space['free_inodes'] < inode_floor + extra_inodes:
                raise GuardError('insufficient-space', **result)
            return {'status': 'space-reserved', **result}


        def cache_budget(entries, capacity=10 * GIB, safety=128 * MIB):
            """Deduplicate referenced physical objects; an unsettled write has its own reservation."""
            distinct = {}
            for record in entries:
                identity = record['physical_id']
                size = record['bytes']
                if not isinstance(identity, str) or not identity or type(size) is not int or size <= 0:
                    raise ValueError('Invalid cache object or outstanding reservation')
                if distinct.setdefault(identity, size) != size:
                    raise ValueError('Conflicting sizes for the same cache identity')
            total = sum(distinct.values())
            headroom = capacity - safety - total
            record = {'objects': len(distinct), 'peak_bytes': total, 'headroom': headroom}
            if headroom < 0:
                raise GuardError('cache-budget-exceeded', **record)
            return {'status': 'within-cache-budget', **record}


        def compile_seconds(job_start, now, job_minutes=350):
            if not 40 < job_minutes <= 350 or not 0 < job_start <= now:
                raise ValueError('Invalid job epoch or duration')
            return max(0, int(job_start + (job_minutes - 40) * 60 - now))


        def job_clock(check_run):
            repo = 'Areal-U/bare-runner-disk-probe'
            if os.environ['GITHUB_REPOSITORY'] != repo or not os.environ.get('JOB_READ_TOKEN'):
                raise ValueError('Job clock requires the authorized repository and read credential')
            run = int(os.environ['GITHUB_RUN_ID'])
            attempt = int(os.environ['GITHUB_RUN_ATTEMPT'])
            allowed_sha = {os.environ['GITHUB_SHA']}
            if os.environ.get('GITHUB_EVENT_NAME') == 'pull_request':
                event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
                allowed_sha.add(event['pull_request']['head']['sha'])
            path = f'/repos/{repo}/actions/runs/{run}/attempts/{attempt}/jobs?per_page=100'
            headers = {'Accept': 'application/vnd.github+json', 'User-Agent': 'bare-trial-clock',
                       'Authorization': 'Bearer ' + os.environ['JOB_READ_TOKEN']}
            for retry in range(3):
                conn = http.client.HTTPSConnection('api.github.com', timeout=10)
                try:
                    conn.request('GET', path, headers=headers)
                    response = conn.getresponse()
                    if response.status != 200:
                        raise ValueError(f'Job start lookup HTTP {response.status}')
                    listing = json.load(response)
                    jobs = listing['jobs']
                    matches = [j for j in jobs if j['run_id'] == run and j['run_attempt'] == attempt
                               and j['head_sha'] in allowed_sha and j['status'] == 'in_progress'
                               and j['check_run_url'] == f'https://api.github.com/repos/{repo}/check-runs/{check_run}']
                    if len(jobs) != listing['total_count'] or len(matches) != 1:
                        raise ValueError('No unambiguous active check run clock')
                    start = datetime.fromisoformat(matches[0]['started_at'].replace('Z', '+00:00'))
                    if not start.tzinfo or start.timestamp() > time.time():
                        raise ValueError('Invalid job start')
                    return int(start.timestamp())
                except (OSError, ValueError, http.client.HTTPException):
                    if retry == 2:
                        raise
                    time.sleep(2)
                finally:
                    conn.close()


        def tree(path):
            wall = time.monotonic()
            cpu = time.thread_time()
            logical = allocated = entries = 0
            pending = [path]
            while pending:
                try:
                    directory = os.scandir(pending.pop())
                except FileNotFoundError:
                    continue
                with directory as contents:
                    for item in contents:
                        try:
                            info = item.stat(follow_symlinks=False)
                        except FileNotFoundError:
                            continue
                        if stat.S_ISDIR(info.st_mode):
                            pending.append(item.path)
                        elif stat.S_ISREG(info.st_mode):
                            logical += info.st_size
                        allocated += info.st_blocks * 512
                        entries += 1
            return {'estimate': max(allocated, logical) + entries * 2048, 'entries': entries,
                    'scan_seconds': time.monotonic() - wall, 'scan_cpu_seconds': time.thread_time() - cpu}


        def pressure(sample, fs, terminal):
            byte_margin = min(OUT_CAP - sample['estimate'], fs['free_bytes'] - FLOOR)
            inode_margin = min(ENTRY_CAP - sample['entries'], fs['free_inodes'] - INODE_FLOOR)
            if byte_margin <= STOP_MARGIN or inode_margin <= STOP_ENTRIES:
                return 'stop', 5
            if terminal or byte_margin <= FAST_MARGIN or inode_margin <= FAST_ENTRIES:
                return 'fast', 5
            return 'normal', 30


        def memory():
            root = Path('/sys/fs/cgroup')
            result = {}
            for item in ('memory.current', 'memory.peak', 'memory.events'):
                file = root / item
                if file.is_file():
                    raw = file.read_text().strip()
                    result[item] = (dict((x.split()[0], int(x.split()[1])) for x in raw.splitlines())
                                    if item == 'memory.events' else int(raw))
            return result


        def log_event(f, event, **fields):
            record = {'event': event, 'time': time.time(), **fields}
            f.write(json.dumps(record, separators=(',', ':'), sort_keys=True) + '\n')
            f.flush()


        def monitor(args):
            command = args.cmd[1:] if args.cmd[:1] == ['--'] else args.cmd
            if not command or not args.output.is_dir():
                raise ValueError('Missing checked output tree or build command')
            wall_remaining = compile_seconds(args.job_start, time.time(), args.job_minutes)
            limit = time.monotonic() + wall_remaining
            # Run inside the build container so SIGINT reaches Siso and every compiler.
            state = {'reason': None}
            def cancel(signum, frame):
                state['reason'] = 'cancelled'
            old = {sig: signal.signal(sig, cancel) for sig in (signal.SIGTERM, signal.SIGINT)}
            proc = None
            group_alive = False
            try:
                with args.jsonl.open('x', encoding='utf-8') as out, concurrent.futures.ThreadPoolExecutor(max_workers=1) as scan:
                    def emit(label, **fields):
                        log_event(out, label, **fields)
                    sample, fs = tree(args.output), disk(args.output)
                    level, interval = pressure(sample, fs, args.terminal)
                    mem_before = memory()
                    emit('start', **sample, **fs, **mem_before, level=level, remaining=wall_remaining, interval=interval)
                    if level == 'stop' or time.monotonic() >= limit or state['reason']:
                        raise GuardError('compile-not-started', level=level, remaining=wall_remaining)
                    proc = subprocess.Popen(command, start_new_session=True)
                    group_alive = True
                    scan_from = time.monotonic()
                    cheap_from = scan_from
                    future = None
                    scans = 1
                    peak_bytes, peak_entries = sample['estimate'], sample['entries']
                    min_free, min_inodes = fs['free_bytes'], fs['free_inodes']
                    int_time = None
                    while proc.poll() is None:
                        now = time.monotonic()
                        fs = disk(args.output)
                        min_free, min_inodes = min(min_free, fs['free_bytes']), min(min_inodes, fs['free_inodes'])
                        if future is not None and future.done():
                            sample = future.result()
                            future = None
                            scans += 1
                            peak_bytes = max(peak_bytes, sample['estimate'])
                            peak_entries = max(peak_entries, sample['entries'])
                            emit('scan', **sample, **fs, **memory())
                        level, interval = pressure(sample, fs, args.terminal)
                        if now - cheap_from >= 5:
                            emit('space', **fs, **memory(), level=level, interval=interval)
                            cheap_from = now
                        if future is None and now - scan_from >= interval:
                            future = scan.submit(tree, args.output)
                            scan_from = now
                        if int_time is None:
                            if level == 'stop' or now >= limit or state['reason']:
                                state['reason'] = state['reason'] or ('resource-margin' if level == 'stop' else 'time-budget')
                                emit('interrupt', reason=state['reason'], **fs, **sample)
                                try:
                                    os.killpg(proc.pid, signal.SIGINT)
                                except ProcessLookupError:
                                    pass
                                int_time = now
                        elif now - int_time >= 120:
                            try:
                                os.killpg(proc.pid, signal.SIGKILL)
                            except ProcessLookupError:
                                pass
                            state['reason'] = 'forced-kill'
                        time.sleep(0.5)
                    proc.wait()
                    if future is not None:
                        future.result()
                    try:
                        os.killpg(proc.pid, 0)
                    except ProcessLookupError:
                        group_alive = False
                    else:
                        raise GuardError('unsettled-process-group')
                    final = tree(args.output)
                    fs = disk(args.output)
                    peak_bytes = max(peak_bytes, final['estimate'])
                    peak_entries = max(peak_entries, final['entries'])
                    min_free, min_inodes = min(min_free, fs['free_bytes']), min(min_inodes, fs['free_inodes'])
                    mem_after = memory()
                    oom = (mem_after.get('memory.events', {}).get('oom_kill', 0) >
                           mem_before.get('memory.events', {}).get('oom_kill', 0))
                    ok = (not oom and not state['reason'] and proc.returncode == 0 and peak_bytes < OUT_CAP and
                          peak_entries < ENTRY_CAP and min_free >= FLOOR and min_inodes >= INODE_FLOOR)
                    emit('settled', ok=ok, reason=state['reason'], returncode=proc.returncode,
                         scans=scans + 1, peak_estimate=peak_bytes, peak_entries=peak_entries, min_free=min_free,
                         min_inodes=min_inodes, oom_kill=oom, **fs, **mem_after, **final)
                    if not ok:
                        raise GuardError('build-not-eligible', reason=state['reason'], returncode=proc.returncode)
                    return {'status': 'completed', 'file': str(args.jsonl)}
            finally:
                if proc is not None and group_alive:
                    try:
                        os.killpg(proc.pid, signal.SIGKILL)
                    except ProcessLookupError:
                        pass
                    proc.wait()
                for sig, handler in old.items():
                    signal.signal(sig, handler)


        def main():
            parser = argparse.ArgumentParser(description=__doc__)
            p = parser.add_subparsers(dest='action', required=True)
            cache = p.add_parser('cache')
            cache.add_argument('inventory', type=Path)
            clock = p.add_parser('job-clock')
            clock.add_argument('--check-run', type=int, required=True)
            size = p.add_parser('size')
            size.add_argument('kind', choices=BYTE_CAPS)
