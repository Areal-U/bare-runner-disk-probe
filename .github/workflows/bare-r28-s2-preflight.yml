                   "Canonical parent is missing or changed")
            print(f'protected_s2_id=11016400308 outer=2742685925 version={exact[0]["version"]}')


        def locate(name):
            assets = [a for a in api.draft(api.RELEASE_ID)["assets"] if a["name"] == name]
            demand(len(assets) <= 1, "Multiple identically named assets")
            return assets[0] if assets else None


        class Section:
            def __init__(self, file, count):
                self.file = file
                self.left = count

            def read(self, requested=-1):
                if requested <= 0:
                    requested = 1024**2
                block = self.file.read(min(self.left, requested))
                self.left -= len(block)
                return block


        def upload(suffix, stream, offset, size, digest):
            name = prefix() + suffix
            logical = name
            # Retry only a known empty starter under a second physical name.
            # An ambiguous response is reconciled by ID/name/hash before another POST.
            for index in range(2):
                name = logical if index == 0 else logical + "-retry1"
                row = locate(name)
                if row is None:
                    stream.seek(offset)
                    try:
                        conn, response = api.request(api.UPLOAD, "POST",
                            f"{api.BASE}/releases/{api.RELEASE_ID}/assets?name=" + quote(name),
                            auth=True, body=Section(stream, size), length=size, content_type="application/octet-stream")
                        try:
                            status = response.status
                            response.read(65536)
                        finally:
                            conn.close()
                        demand(status in (201, 422, 502), f"Asset upload status {status}")
                    except (OSError, api.http.client.HTTPException):
                        pass
                    for delay in (0, 2, 5):
                        if delay:
                            time.sleep(delay)
                        row = locate(name)
                        if row:
                            break
                    demand(row is not None, "Upload outcome unknown; keep original candidate and reconcile")
                if row["state"] == "starter" and row["size"] == 0:
                    continue
                checked = api.asset_info(api.draft(api.RELEASE_ID), name, size, digest, row["id"])
                print(f"asset={checked['id']} bytes={size} sha256={digest}", flush=True)
                return {"name": name, "id": checked["id"], "bytes": size, "sha256": digest}
            raise ValueError("Both upload attempts have an empty starter")


        def send():
            source()
            demand(os.environ["GITHUB_RUN_ATTEMPT"] == "1", "Only initial attempt may publish")
            file = TEMP / "r28-child.tar.zst"
            size = file.stat().st_size
            demand(0 < size <= TOTAL, "Total compressed size limit")
            base = TEMP / "bare-official/exchange/checkpoint"
            identity = json.loads((base / "child-provenance.json").read_text())["identity_sha256"]
            graph = (base / "graph-sha.txt").read_text().strip()
            demand(hashed(identity) and identity != INPUT and hashed(graph), "Incomplete graph/producer receipt")
            manifest = {**ctx(), "bytes": size, "identity": identity, "graph_sha": graph, "parts": []}
            with file.open("rb") as f:
                full = hashlib.sha256()
                for index, offset in enumerate(range(0, size, PART)):
                    length = min(size-offset, PART)
                    digest = hashlib.sha256()
                    f.seek(offset)
                    region = Section(f, length)
                    while block := region.read():
                        full.update(block)
                        digest.update(block)
                    demand(region.left == 0, "Short local candidate")
                    manifest["parts"].append(upload(f"p{index:02}", f, offset, length, digest.hexdigest()))
                manifest["sha256"] = full.hexdigest()
            raw = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode()
            receipt = upload("manifest.json", io.BytesIO(raw), 0, len(raw), hashlib.sha256(raw).hexdigest())
            print("manifest_receipt=" + json.dumps(receipt, sort_keys=True))
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                print("manifest_id=" + str(receipt["id"]), file=f)
                print("manifest_sha=" + receipt["sha256"], file=f)


        def anonymous(row):
            url = urlsplit(row["browser_download_url"])
            demand(url.scheme == "https" and url.netloc == "github.com" and not url.query and not url.fragment
                   and url.path.startswith("/" + api.REPO + "/releases/download/"), "Unexpected download URL")
            paths = [("github.com", url.path, "direct"),
                     (api.API, f"{api.BASE}/releases/assets/{row['id']}", "api")]
            for host, path, label in paths:
                for i in range(4):
                    until = api.anonymous_status(host, path, label)
                    if until is None:
                        break
                    delay = max(0, until-int(time.time()))
                    demand(i < 3 and delay <= 3900, "Anonymous access still unconfirmed")
                    time.sleep(delay)


        def receive():
            source()
            found = [row for suffix in ("manifest.json", "manifest.json-retry1")
                     if (row := locate(prefix() + suffix)) and row["state"] == "uploaded"]
            demand(len(found) == 1, "Canonical completed manifest missing or ambiguous")
            row = found[0]
            expected_id = os.environ.get("MANIFEST_ID")
            expected_hash = os.environ.get("MANIFEST_SHA")
            demand(not expected_id or str(row["id"]) == expected_id, "Manifest ID differs from job output")
            digest = row["digest"].removeprefix("sha256:")
            demand(0 < row["size"] <= 12288 and hashed(digest) and (not expected_hash or digest == expected_hash),
                   "Manifest digest differs")
            anonymous(row)
            raw = io.BytesIO()
            api.download(row["id"], row["size"], digest, raw)
            manifest = json.loads(raw.getvalue())
            demand(all(manifest.get(k) == v for k, v in ctx().items()), "Run, input, segment or source mismatch")
            size = manifest["bytes"]
            demand(type(size) == int and 0 < size <= TOTAL and hashed(manifest["sha256"]) and
                   hashed(manifest["identity"]) and manifest["identity"] != INPUT and hashed(manifest["graph_sha"]),
                   "Unbounded or unbound successor")
            parts = manifest["parts"]
            demand(isinstance(parts, list) and len(parts) == (size+PART-1)//PART and
                   len(set(p["id"] for p in parts)) == len(parts), "Parts are incomplete or repeated")
            destination = TEMP / "r28-child.tar.zst"
            with destination.open("xb") as f:
                for index, part in enumerate(parts):
                    wanted = prefix() + f"p{index:02}"
                    demand(part["name"] in (wanted, wanted + "-retry1") and
                           part["bytes"] == min(PART, size-index*PART) and hashed(part["sha256"]), "Invalid part")
                    row = api.asset_info(api.draft(api.RELEASE_ID), part["name"], part["bytes"], part["sha256"], part["id"])
                    anonymous(row)
                    api.download(part["id"], part["bytes"], part["sha256"], f)
                f.flush()
                os.fsync(f.fileno())
            demand(destination.stat().st_size == size and api.sha256_file(destination) == manifest["sha256"], "Reassembled content differs")
            (TEMP / "r28-child.json").write_bytes(raw.getvalue())
            print(f"independent_draft_read_id={found[0]['id']} archive_bytes={size} sha256={manifest['sha256']}")


        if __name__ == "__main__":
            mode, = sys.argv[1:]
            {"parent": source, "send": send, "receive": receive}[mode]()
        REVIEWED_R28_TRANSPORT_EXCHANGE_PY
    - &id011
      name: Load byte-verified existing owner-Draft helpers
      run: python3 preflight28/transport/prepare.py tools
    - name: Check canonical generation and reserve the single producer
      env: &id001
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 3
      run: python3 preflight28/control/admission.py compute --before "$EXPECTED_BEFORE" --helper-dir "$RUNNER_TEMP"
    - &id012
      name: Read the actual service job start and preflight source receipt
      env:
        GH_TOKEN: ${{ github.token }}
        JOB_READ_TOKEN: ${{ github.token }}
        CHECK_RUN: ${{ job.check_run_id }}
      timeout-minutes: 3
      run: |
        set -euo pipefail
        if [[ ! $CHECK_RUN =~ ^[1-9][0-9]*$ ]]; then
          case "$GITHUB_JOB" in
            produce) name='Create one S2 successor and transfer to fixed private Draft';;
            receive) name='Recover and verify required edge on an independent runner';;
            *) exit 1;;
          esac
          CHECK_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" |
            jq -er --arg name "$name" '[.jobs[]|select(.name==$name and .status=="in_progress")|.check_run_url|split("/")|last]|select(length==1)|first')
        fi
        epoch=$(python3 preflight28/limits/guard.py job-clock --check-run "$CHECK_RUN")
        echo "JOB_STARTED=$epoch" >> "$GITHUB_ENV"
        python3 preflight28/transport/exchange.py parent
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      name: Restore the exact S2 parent at its original path
      id: parent
      timeout-minutes: 15
      with:
        path: ${{ runner.temp }}/bare-official/exchange/checkpoint/checkpoint.tar.gz
        key: bare-coexist-204-45285202990-1-checkpoint-production-s2
        fail-on-cache-miss: true
    - name: Validate parent and advance one required APK edge, then pack bounded zstd
      timeout-minutes: 195
      env:
        MATCH: ${{ steps.parent.outputs.cache-matched-key }}
        HIT: ${{ steps.parent.outputs.cache-hit }}
      run: |
        set -euo pipefail
        [[ $HIT == true && $MATCH == 'bare-coexist-204-45285202990-1-checkpoint-production-s2' ]]
        python3 preflight28/transport/prepare.py produce
    - name: Send only the verified generation to the existing owner Draft
      id: send
      timeout-minutes: 6
      env: *id001
      run: python3 preflight28/transport/exchange.py send
    - name: Record retained parent and receiver manifest
      timeout-minutes: 2
      env: *id001
      run: python3 preflight28/transport/exchange.py parent
  receive:
    runs-on: ubuntu-24.04
    permissions: *id002
    timeout-minutes: 215
    name: Recover and verify required edge on an independent runner
    needs: produce
    cache-mode: none
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number ==
      9 && github.actor == 'Areal-U' && github.triggering_actor == 'Areal-U' && github.event.repository.fork == false && github.repository ==
      'Areal-U/bare-runner-disk-probe' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.repo.full_name
      == github.repository && github.head_ref == 'work-bare-27-storage-check' && github.base_ref == 'bare-coexist-v2.0.4' && github.event.pull_request.base.sha
      == 'bf70ddbf474f3390a62220a076b8c43347fecc64' && github.event.before == 'b9553267cbb4f1645db9d2d40c4d85eb68c26d5d' && (needs.produce.result
      == 'success' || github.run_attempt != '1') }}
    steps:
    - *id003
    - *id004
    - *id005
    - *id006
    - *id007
    - *id008
    - *id009
    - *id010
    - *id011
    - name: Check canonical generation and verify its existing claim
      env: *id001
      timeout-minutes: 3
      run: python3 preflight28/control/admission.py recover --before "$EXPECTED_BEFORE" --helper-dir "$RUNNER_TEMP"
    - *id012
    - name: Read and authenticate the exact private manifest and successor bytes
      timeout-minutes: 85
      env:
        GH_TOKEN: ${{ github.token }}
        MANIFEST_ID: ${{ needs.produce.outputs.manifest_id }}
        MANIFEST_SHA: ${{ needs.produce.outputs.manifest_sha }}
      run: |
        set -euo pipefail
        python3 preflight28/limits/guard.py space "$RUNNER_TEMP" --bytes 3758096384 --inodes 2
        python3 preflight28/transport/exchange.py receive
    - name: Rebuild fixed environment and prove full restored APK frontier without new compilation
      timeout-minutes: 195
      run: python3 preflight28/transport/prepare.py receive
    - name: Verify source cache remains intact after read-only acquisition
      timeout-minutes: 2
      env: *id001
      run: python3 preflight28/transport/exchange.py parent
