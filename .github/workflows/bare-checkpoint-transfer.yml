name: Bare Personal v2.0.4 build and recovery
run-name: ${{ inputs.mode == 'build-apk' && format('Bare ARM64 build (up to {0} segments)', inputs.build_segments) || (inputs.mode == 'recover-lost-slot' && 'Recover one confirmed lost Bare interval' || 'Recover encrypted Bare APK') }}
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Build the Bare Personal ARM64 APK or recover its encrypted artifact
        type: choice
        default: build-apk
        options:
        - build-apk
        - recover-encrypted-apk
        - recover-lost-slot
      loss_origin_run:
        description: Registered source run for verified ciphertext recovery or certified loss replacement
        type: string
      registration_asset_id:
        description: Optional exact ticket ID (leave both fields empty to discover the one prior collection registration)
        type: string
      registration_sha:
        description: Optional exact SHA-256 of that private collection registration
        type: string
      checkpoint_backend:
        description: Storage for numbered successors (draft is the private zstd route)
        type: choice
        default: draft
        options: [draft]
      checkpoint_compression:
        description: Auto selects zstd -4 for a measured-size tree and -9 for larger trees; compact always uses -9
        type: choice
        default: auto
        options: [auto, compact]
      apk_recipient:
        description: Pinned owner age public recipient for the encrypted APK
        type: string
        default: age1t69raxytlqula36e8w0tm6p3ezt49ztwnrtz8k57h6mvpwfguy7sjmr4yx
      checkpoint_key:
        description: Leave empty to build from R27 S2. Ciphertext recovery uses the exact original cache key.
        type: string
      checkpoint_sha:
        description: SHA-256 from the selected readback
        type: string
      checkpoint_identity:
        description: Input identity from the selected production readback
        type: string
      output_gib:
        description: Estimated output ceiling in GiB for one segment
        type: choice
        default: '18'
        options: ['18']
      compile_minutes:
        description: Compile to the remaining job deadline (0), or apply an explicit earlier cutoff
        type: choice
        default: '0'
        options: ['0', '180']
      build_segments:
        description: Maximum sequential build segments (12 uses the fixed R27 S2 parent)
        type: choice
        default: '12'
        options: ['12']
      jobs:
        description: Concurrent build actions
        type: choice
        default: '2'
        options: ['2']
      encrypted_apk_bytes:
        description: Verified encrypted APK byte count (only for recovery)
        type: string
permissions: {}
concurrency:
  group: bare-coexist-204-build
  cancel-in-progress: false
jobs:
  validate-build:
    name: Check the requested build segments
    if: ${{ github.run_attempt == '1' && inputs.mode == 'build-apk' && github.repository == 'Areal-U/bare-runner-disk-probe' && github.ref == 'refs/heads/bare-coexist-v2.0.4' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Validate the selected build settings
      shell: bash
      env:
        APK_RECIPIENT: ${{ inputs.apk_recipient }}
        SEGMENTS: ${{ inputs.build_segments }}
        MINUTES: ${{ inputs.compile_minutes }}
        JOBS: ${{ inputs.jobs }}
        OUTPUT_GIB: ${{ inputs.output_gib }}
        BACKEND: ${{ inputs.checkpoint_backend }}
        COMPRESSION: ${{ inputs.checkpoint_compression }}
        LOSS_ORIGIN: ${{ inputs.loss_origin_run }}
        RECOVERY_BYTES: ${{ inputs.encrypted_apk_bytes }}
        PARENT_KEY: ${{ inputs.checkpoint_key }}
        PARENT_SHA: ${{ inputs.checkpoint_sha }}
        PARENT_IDENTITY: ${{ inputs.checkpoint_identity }}
      run: |
        [[ $SEGMENTS == 12 && $BACKEND == draft && -z $LOSS_ORIGIN$RECOVERY_BYTES ]]
        [[ ${COMPRESSION:-auto} == auto || $COMPRESSION == compact ]]
        [[ $APK_RECIPIENT == age1t69raxytlqula36e8w0tm6p3ezt49ztwnrtz8k57h6mvpwfguy7sjmr4yx ]]
        [[ $OUTPUT_GIB == 18 && $JOBS == 2 && ($MINUTES == 180 || $MINUTES == 0) ]]
        if [[ -n $PARENT_KEY$PARENT_SHA$PARENT_IDENTITY ]]; then
          [[ $PARENT_KEY == bare-coexist-204-45285202990-1-checkpoint-production-s2 ]]
          [[ $PARENT_SHA == 4381b248b26a7d12443241192c27d00311abaeb5b7d1839c7a5a17d088f736cf ]]
          [[ $PARENT_IDENTITY == a11dd3df7bccafb011f90f562e997b4601fa8a200f85c39d09d6fc962de8a3dc ]]
        fi
  bind-private-receiver:
    name: Bind the prior private collection registration to this originating run
    needs: validate-build
    if: ${{ github.run_attempt == '1' && needs.validate-build.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      claim_asset_id: ${{ steps.bind.outputs.claim_asset_id }}
      latest_start: ${{ steps.bind.outputs.latest_start }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - run: python3 preflight28/transport/prepare.py tools
    - id: bind
      env:
        GH_TOKEN: ${{ github.token }}
        R28_RELAY_BYTE_CEILING: ${{ vars.R28_RELAY_BYTE_CEILING }}
        REGISTRATION_ASSET_ID: ${{ inputs.registration_asset_id }}
        REGISTRATION_SHA: ${{ inputs.registration_sha }}
      run: python3 preflight28/control/registration.py
    - name: Bind the allowlisted private claim identities for the registered owner
      id: owner_witness
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
        WITNESS_CLAIM_ID: ${{ steps.bind.outputs.claim_asset_id }}
      run: python3 preflight28/control/owner_witness.py claim
    - name: Preserve the registered owner claim witness in the original Draft
      id: private_witness
      continue-on-error: true
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
        WITNESS_NAME: ${{ steps.owner_witness.outputs.name }}
        WITNESS_SHA: ${{ steps.owner_witness.outputs.sha }}
      run: python3 preflight28/control/owner_witness.py preserve claim
    - name: Attest registered owner claim SHA256 ${{ steps.owner_witness.outputs.sha }}
      env:
        WITNESS_SHA: ${{ steps.owner_witness.outputs.sha }}
      run: '[[ $WITNESS_SHA =~ ^[a-f0-9]{64}$ ]]'
    - name: Check the free capacity for the optional owner witness Artifact
      id: witness_budget
      continue-on-error: true
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
        R28_STORAGE_CEILING: ${{ steps.bind.outputs.storage_ceiling }}
        R28_STORAGE_UNTIL: ${{ steps.bind.outputs.storage_until }}
        R28_RELAY_BYTE_CEILING: ${{ vars.R28_RELAY_BYTE_CEILING }}
      run: python3 preflight28/bridge/storage_admission.py witness --file "$RUNNER_TEMP/witness.json"
    - name: Persist verified owner claim identities
      id: owner_witness_upload
      if: ${{ steps.witness_budget.outcome == 'success' }}
      continue-on-error: true
      timeout-minutes: 2
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ steps.owner_witness.outputs.name }}
        path: ${{ runner.temp }}/witness.json
        if-no-files-found: error
        overwrite: false
        retention-days: 30
        compression-level: 0
    - name: Attest registered owner claim IDs ${{ steps.owner_witness.outputs.ids }}
      env:
        WITNESS_IDS: ${{ steps.owner_witness.outputs.ids }}
        WITNESS_SHA: ${{ steps.owner_witness.outputs.sha }}
      run: python3 preflight28/control/owner_witness.py attest claim
  readback:
    name: Read back the saved continuation on a fresh runner
    needs: production
    if: ${{ !cancelled() && needs.production.result == 'success' && needs.production.outputs.checkpoint_saved == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs: &checkpoint_outputs
      checkpoint_key: ${{ steps.verified.outputs.key }}
      checkpoint_sha: ${{ steps.verified.outputs.sha }}
      checkpoint_identity: ${{ steps.verified.outputs.identity }}
    defaults: &bash_defaults
      run:
        shell: bash
    env:
      KEY_SUFFIX: ''
      EXPECTED_KEY: ${{ needs.production.outputs.checkpoint_key }}
      EXPECTED_SHA: ${{ needs.production.outputs.checkpoint_sha }}
      EXPECTED_IDENTITY: ${{ needs.production.outputs.checkpoint_identity }}
    steps: &checkpoint_readback_steps
    - name: Validate the successor identity and load its exact verifier
      timeout-minutes: 4
      run: |
        [[ $GITHUB_EVENT_NAME == workflow_dispatch && $RUNNER_ENVIRONMENT == github-hosted && $RUNNER_ARCH == X64 ]]
        [[ $EXPECTED_KEY =~ ^bare-coexist-204-${GITHUB_RUN_ID}-[1-9][0-9]*-checkpoint-production${KEY_SUFFIX}$ ]]
        [[ $EXPECTED_SHA =~ ^[0-9a-f]{64}$ && $EXPECTED_IDENTITY =~ ^[0-9a-f]{64}$ ]]
        curl --fail --location --retry 2 --max-time 60 \
          "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/checkpoint.py" \
          --output "$RUNNER_TEMP/checkpoint.py"
    - name: Restore only the exact successor key
      id: successor
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/bare-official/exchange/checkpoint/checkpoint.tar.gz
        key: ${{ env.EXPECTED_KEY }}
        fail-on-cache-miss: true
    - name: Verify the restored successor bytes and newly completed outputs
      id: verified
      timeout-minutes: 25
      env:
        CACHE_HIT: ${{ steps.successor.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.successor.outputs.cache-matched-key }}
      run: |
        [[ $CACHE_HIT == true && $MATCHED_KEY == "$EXPECTED_KEY" ]]
        archive="$RUNNER_TEMP/bare-official/exchange/checkpoint/checkpoint.tar.gz"
        [[ -f $archive && ! -L $archive ]]
        actual_sha=$(sha256sum -- "$archive")
        actual_sha=${actual_sha%% *}
        [[ $actual_sha == "$EXPECTED_SHA" ]]
        python3 "$RUNNER_TEMP/checkpoint.py" validate-archive "$archive" --production
        python3 "$RUNNER_TEMP/checkpoint.py" verify-continuation "$archive" \
          --expected-identity "$EXPECTED_IDENTITY" --ci-revision "$GITHUB_SHA" --production
        printf 'key=%s\nsha=%s\nidentity=%s\n' "$MATCHED_KEY" "$actual_sha" "$EXPECTED_IDENTITY" >> "$GITHUB_OUTPUT"
        printf 'Verified successor cache %s\n' "$EXPECTED_KEY"
        {
          printf 'Verified checkpoint: `%s`\n\n' "$EXPECTED_KEY"
          printf -- '- SHA-256: `%s`\n' "$EXPECTED_SHA"
          printf -- '- Input identity: `%s`\n' "$EXPECTED_IDENTITY"
        } >> "$GITHUB_STEP_SUMMARY"
  production:
    if: ${{ github.run_attempt == '1' && inputs.build_segments != '12' && needs.bind-private-receiver.result == 'success' && needs.bind-private-receiver.outputs.claim_asset_id != '' }}
    needs: [validate-build, bind-private-receiver]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/bare-arm64-probe.yml
    with:
      collector_latest_start: ${{ needs.bind-private-receiver.outputs.latest_start }}
      probe: checkpoint-production
      coexist_cold: ${{ inputs.checkpoint_key == '' }}
      expected_checkpoint_key: ${{ inputs.checkpoint_key }}
      expected_checkpoint_sha: ${{ inputs.checkpoint_sha }}
      expected_checkpoint_identity: ${{ inputs.checkpoint_identity }}
      expected_base_image: ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
      apk_recipient: ${{ inputs.apk_recipient }}
      apk_output_gib: ${{ fromJSON(inputs.output_gib) }}
      apk_jobs: ${{ fromJSON(inputs.jobs) }}
      compile_minutes: ${{ fromJSON(inputs.compile_minutes) }}
      retain_existing_caches: false
  read-back-apk:
    name: Read back the encrypted APK on a fresh runner
    needs: production
    if: ${{ !cancelled() && needs.production.result == 'success' && (needs.production.outputs.apk_artifact_id != '' || needs.production.outputs.apk_cache_key != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults: *bash_defaults
    env:
      ARTIFACT_ID: ${{ needs.production.outputs.apk_artifact_id }}
      EXPECTED_CACHE: ${{ needs.production.outputs.apk_cache_key }}
      EXPECTED_SHA: ${{ needs.production.outputs.apk_encrypted_sha }}
      EXPECTED_BYTES: ${{ needs.production.outputs.apk_encrypted_bytes }}
    steps: &apk_readback_steps
    - name: Download the exact encrypted APK artifact
      if: ${{ env.ARTIFACT_ID != '' }}
      continue-on-error: true
      id: exact_artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 10
      with:
        artifact-ids: ${{ env.ARTIFACT_ID }}
        path: ${{ runner.temp }}/bare-apk-artifact
        merge-multiple: true
    - name: Restore the exact encrypted APK fallback cache
      if: ${{ !cancelled() && env.EXPECTED_CACHE != '' }}
      continue-on-error: true
      id: apk_cached
      timeout-minutes: 12
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/bare-apk-delivery/Bare-Personal-2.0.4-arm64-v8a.tar.age
        key: ${{ env.EXPECTED_CACHE }}
        fail-on-cache-miss: true
    - name: Verify the exact encrypted APK bytes
      timeout-minutes: 2
      env:
        ARTIFACT_OK: ${{ steps.exact_artifact.outcome }}
        CACHE_HIT: ${{ steps.apk_cached.outputs.cache-hit }}
        CACHE_MATCH: ${{ steps.apk_cached.outputs.cache-matched-key }}
      run: |
        [[ $EXPECTED_SHA =~ ^[0-9a-f]{64}$ && $EXPECTED_BYTES =~ ^[1-9][0-9]*$ ]]
        (( EXPECTED_BYTES > 0 && EXPECTED_BYTES <= 451 * 1024**2 ))
        sources=()
        if [[ -n $ARTIFACT_ID && $ARTIFACT_OK == success ]]; then sources+=(bare-apk-artifact); fi
        if [[ -n $EXPECTED_CACHE && $CACHE_HIT == true && $CACHE_MATCH == "$EXPECTED_CACHE" ]]; then sources+=(bare-apk-delivery); fi
        (( ${#sources[@]} > 0 ))
        for source in "${sources[@]}"; do
          file="$RUNNER_TEMP/$source/Bare-Personal-2.0.4-arm64-v8a.tar.age"
          [[ -f $file && ! -L $file && $(stat -c %s -- "$file") == "$EXPECTED_BYTES" ]]
          [[ $(head -n 1 -- "$file") == age-encryption.org/v1 ]]
          printf '%s  %s\n' "$EXPECTED_SHA" "$file" | sha256sum --check --strict
        done
  collection-lease:
    name: Re-read the existing owner-bound collection lease for this segment
    needs: [production, readback]
    if: ${{ github.run_attempt == '1' && inputs.build_segments == '2' && needs.production.outputs.checkpoint_advanced == 'true' && needs.readback.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      latest_start: ${{ steps.lease.outputs.latest_start }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: |
          preflight28
        sparse-checkout-cone-mode: false
    - run: python3 preflight28/transport/prepare.py tools
    - name: Verify the prior collector acknowledgement with a GET-only client
      id: lease
      env:
        GH_TOKEN: ${{ github.token }}
        REGISTRATION_ASSET_ID: ''
        REGISTRATION_SHA: ''
      run: python3 preflight28/control/registration.py check-lease
  production-next:
    needs: [production, readback, collection-lease]
    if: >-
      ${{ !cancelled() && github.run_attempt == '1' && inputs.build_segments == '2' &&
          needs.collection-lease.result == 'success' && needs.production.result == 'success' && needs.readback.result == 'success' &&
          needs.production.outputs.checkpoint_saved == 'true' && needs.production.outputs.checkpoint_advanced == 'true' &&
          needs.production.outputs.apk_artifact_id == '' && needs.production.outputs.apk_cache_key == '' &&
          needs.production.outputs.apk_encrypted_sha == '' && needs.production.outputs.apk_encrypted_bytes == '' &&
          needs.readback.outputs.checkpoint_key != '' && needs.readback.outputs.checkpoint_sha != '' && needs.readback.outputs.checkpoint_identity != '' &&
          needs.readback.outputs.checkpoint_key == needs.production.outputs.checkpoint_key &&
          needs.readback.outputs.checkpoint_sha == needs.production.outputs.checkpoint_sha &&
          needs.readback.outputs.checkpoint_identity == needs.production.outputs.checkpoint_identity }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/bare-arm64-probe.yml
    with:
      collector_latest_start: ${{ needs.collection-lease.outputs.latest_start }}
      probe: checkpoint-production
      checkpoint_segment: next
      coexist_cold: false
      expected_checkpoint_key: ${{ needs.readback.outputs.checkpoint_key }}
      expected_checkpoint_sha: ${{ needs.readback.outputs.checkpoint_sha }}
      expected_checkpoint_identity: ${{ needs.readback.outputs.checkpoint_identity }}
      expected_base_image: ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
      apk_recipient: ${{ inputs.apk_recipient }}
      apk_output_gib: 18
      apk_jobs: 2
      compile_minutes: ${{ fromJSON(inputs.compile_minutes) }}
      retain_existing_caches: false
  readback-next:
    name: Read back the second continuation on a fresh runner
    needs: production-next
    if: ${{ !cancelled() && needs.production-next.result == 'success' && needs.production-next.outputs.checkpoint_saved == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults: *bash_defaults
    outputs: *checkpoint_outputs
    env:
      KEY_SUFFIX: '-s2'
      EXPECTED_KEY: ${{ needs.production-next.outputs.checkpoint_key }}
      EXPECTED_SHA: ${{ needs.production-next.outputs.checkpoint_sha }}
      EXPECTED_IDENTITY: ${{ needs.production-next.outputs.checkpoint_identity }}
    steps: *checkpoint_readback_steps
  read-back-apk-next:
    name: Read back the second segment's encrypted APK on a fresh runner
    needs: production-next
    if: ${{ !cancelled() && needs.production-next.result == 'success' && (needs.production-next.outputs.apk_artifact_id != '' || needs.production-next.outputs.apk_cache_key != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults: *bash_defaults
    env:
      ARTIFACT_ID: ${{ needs.production-next.outputs.apk_artifact_id }}
      EXPECTED_CACHE: ${{ needs.production-next.outputs.apk_cache_key }}
      EXPECTED_SHA: ${{ needs.production-next.outputs.apk_encrypted_sha }}
      EXPECTED_BYTES: ${{ needs.production-next.outputs.apk_encrypted_bytes }}
    steps: *apk_readback_steps
  recover-encrypted-apk:
    if: ${{ github.run_attempt == '1' && inputs.mode == 'recover-encrypted-apk' && inputs.loss_origin_run == '' && github.repository == 'Areal-U/bare-runner-disk-probe' && github.ref == 'refs/heads/bare-coexist-v2.0.4' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_KEY: ${{ inputs.checkpoint_key }}
      EXPECTED_SHA: ${{ inputs.checkpoint_sha }}
      EXPECTED_BYTES: ${{ inputs.encrypted_apk_bytes }}
    steps:
    - name: Check the exact encrypted APK receipt
      run: |
        [[ $EXPECTED_KEY =~ ^bare-coexist-204-apk-v1-[1-9][0-9]*-[1-9][0-9]*(-s2)?$ && $EXPECTED_SHA =~ ^[0-9a-f]{64}$ ]]
        [[ $EXPECTED_BYTES =~ ^[1-9][0-9]{0,8}$ ]]
        (( EXPECTED_BYTES <= 451 * 1024**2 ))
    - name: Restore only the encrypted APK
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/bare-apk-delivery/Bare-Personal-2.0.4-arm64-v8a.tar.age
        key: ${{ env.EXPECTED_KEY }}
        fail-on-cache-miss: true
    - name: Verify encrypted bytes before re-upload
      env:
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit == 'true' }}
        CACHE_MATCH: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        [[ $CACHE_HIT == true && $CACHE_MATCH == "$EXPECTED_KEY" ]]
        file="$RUNNER_TEMP/bare-apk-delivery/Bare-Personal-2.0.4-arm64-v8a.tar.age"
        [[ -f $file && ! -L $file && $(stat -c %s -- "$file") == "$EXPECTED_BYTES" ]]
        [[ $(head -n 1 -- "$file") == age-encryption.org/v1 ]]
        printf '%s  %s\n' "$EXPECTED_SHA" "$file" | sha256sum --check --strict
    - name: Upload the recovered ciphertext
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: bare-arm64-apk-recovered-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/bare-apk-delivery/Bare-Personal-2.0.4-arm64-v8a.tar.age
        if-no-files-found: error
        retention-days: 3
        compression-level: 0


  deliver-recovered-cached-apk:
    name: Transfer the original cached ciphertext to its registered owner
    if: ${{ github.run_attempt == '1' && inputs.mode == 'recover-encrypted-apk' && inputs.loss_origin_run != '' && github.actor == 'Areal-U' && github.repository == 'Areal-U/bare-runner-disk-probe' && github.ref == 'refs/heads/bare-coexist-v2.0.4' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      actions: read
      contents: write
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: |
          preflight28
        sparse-checkout-cone-mode: false
    - run: python3 preflight28/transport/prepare.py tools
    - name: Bind the exact original cache to its registered owner
      id: origin
      timeout-minutes: 7
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 preflight28/bridge/terminal_draft.py authorize-rescue
    - name: Restore only the original ciphertext and seal
      if: ${{ steps.origin.outputs.prior_id == '' }}
      id: cache
      timeout-minutes: 12
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/bare-apk-delivery
        key: ${{ steps.origin.outputs.cache_key }}
        fail-on-cache-miss: true
    - name: Deposit and read back the owner-encrypted bytes and immutable receiver record
      id: deposited
      timeout-minutes: 20
      env:
        GH_TOKEN: ${{ github.token }}
        PRIOR_RECEIPT_ID: ${{ steps.origin.outputs.prior_id }}
        PRIOR_RECEIPT_SHA: ${{ steps.origin.outputs.prior_sha }}
        R28_SOURCE_RUN: ${{ steps.origin.outputs.source_run }}
        R28_SLOT: ${{ steps.origin.outputs.ordinal }}
        R28_PARENT_SHA: ${{ steps.origin.outputs.parent }}
        R28_COLLECTION_CLAIM: ${{ steps.origin.outputs.claim_id }}
        CACHE_ID: ${{ steps.origin.outputs.cache_id }}
        CACHE_KEY: ${{ steps.origin.outputs.cache_key }}
        CACHE_MATCH: ${{ steps.cache.outputs.cache-matched-key }}
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        CIPHER_SHA: ${{ steps.origin.outputs.sha }}
        CIPHER_BYTES: ${{ steps.origin.outputs.bytes }}
      run: python3 preflight28/bridge/terminal_draft.py
    - name: Bind the allowlisted private terminal identities for the registered owner
      id: owner_witness
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
        WITNESS_RECEIPT_ID: ${{ steps.deposited.outputs.receipt_id }}
        WITNESS_RECEIPT_SHA: ${{ steps.deposited.outputs.receipt_sha }}
        R28_SOURCE_RUN: ${{ steps.origin.outputs.source_run }}
        R28_SLOT: ${{ steps.origin.outputs.ordinal }}
        R28_PARENT_SHA: ${{ steps.origin.outputs.parent }}
        R28_COLLECTION_CLAIM: ${{ steps.origin.outputs.claim_id }}
      run: python3 preflight28/control/owner_witness.py terminal
    - name: Preserve the registered owner terminal witness in the original Draft
      id: private_witness
      continue-on-error: true
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
        WITNESS_NAME: ${{ steps.owner_witness.outputs.name }}
        WITNESS_SHA: ${{ steps.owner_witness.outputs.sha }}
        R28_SLOT: ${{ steps.origin.outputs.ordinal }}
