name: Bare Personal 2.0.9 ARM64
run-name: Bare Personal 2.0.9 ARM64 build
'on':
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Create the personal ARM64 APK
        options:
        - build-apk
        default: build-apk
      owner_alias_sha:
        description: SHA-256 of the owner-observed Draft tag after saving this ticket
        type: string
        required: true
      ticket_id:
        type: string
        description: Immutable owner ticket asset ID or lookup by verified digest
        required: true
      ticket_sha:
        type: string
        description: Owner ticket SHA-256
        required: true
      resume:
        type: string
        description: Empty for cold build, or a verified prior 2.0.9 recovery selector
        required: false
permissions: {}
concurrency:
  group: bare-personal-209-production
  cancel-in-progress: false
jobs:
  admit:
    name: Verify new generation and bind owner registration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    env:
      BARE_GENERATION: 2.0.9
      R209_DRAFT_ALIAS_SHA: ${{ inputs.owner_alias_sha }}
      R28_HEAD_SHA: ${{ github.sha }}
    outputs:
      ordinal: ${{ steps.source.outputs.ordinal }}
      parent: ${{ steps.source.outputs.parent }}
      parent_identity: ${{ steps.source.outputs.parent_identity }}
      origin: ${{ steps.source.outputs.origin }}
      manifest: ${{ steps.source.outputs.manifest }}
      manifest_sha: ${{ steps.source.outputs.manifest_sha }}
      genesis: ${{ steps.source.outputs.genesis }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Stage pinned private transfer client
      run: python3 preflight28/transport/prepare.py tools
    - name: Select fresh source or independently re-read approved private predecessor
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        R209_RESUME: ${{ inputs.resume }}
      run: python3 preflight209/campaign.py start
    - name: Bind the independently registered private destination
      env:
        GH_TOKEN: ${{ github.token }}
        TICKET: ${{ inputs.ticket_id }}
        TICKET_SHA: ${{ inputs.ticket_sha }}
        R209_GENESIS: ${{ steps.source.outputs.genesis }}
      run: python3 preflight209/owner.py bind --ticket-id "$TICKET" --ticket-sha "$TICKET_SHA" --genesis "$R209_GENESIS"
  slot01:
    needs: admit
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/bare-personal209-slot.yml
    with:
      owner_alias_sha: ${{ inputs.owner_alias_sha }}
      ticket_id: ${{ inputs.ticket_id }}
      ticket_sha: ${{ inputs.ticket_sha }}
      genesis: ${{ needs.admit.outputs.genesis }}
      ordinal: ${{ needs.admit.outputs.ordinal }}
      parent: ${{ needs.admit.outputs.parent }}
      parent_identity: ${{ needs.admit.outputs.parent_identity }}
      origin: ${{ needs.admit.outputs.origin }}
      manifest: ${{ needs.admit.outputs.manifest }}
      manifest_sha: ${{ needs.admit.outputs.manifest_sha }}
  slot02:
    needs:
    - admit
    - slot01
    if: ${{ needs.slot01.outputs.kind == 'checkpoint' }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/bare-personal209-slot.yml
    with:
      owner_alias_sha: ${{ inputs.owner_alias_sha }}
      ticket_id: ${{ inputs.ticket_id }}
      ticket_sha: ${{ inputs.ticket_sha }}
      genesis: ${{ needs.admit.outputs.genesis }}
      ordinal: ${{ needs.slot01.outputs.next_slot }}
      parent: ${{ needs.slot01.outputs.parent }}
      parent_identity: ${{ needs.slot01.outputs.parent_identity }}
      origin: ''
      manifest: ${{ needs.slot01.outputs.manifest }}
      manifest_sha: ${{ needs.slot01.outputs.manifest_sha }}
