name: Bare private Draft compatibility check
run-name: Verify current registration and read free storage
'on':
  workflow_dispatch:
    inputs:
      ticket_sha:
        type: string
        required: true
        description: Independently read target ticket SHA-256
      owner_alias_sha:
        type: string
        required: true
        description: Owner-observed SHA-256 after the final Draft save
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # A read-scoped job token returned 403 for this unpublished Draft (#41).
      # The strict GET-only transport is the same tested network boundary as #42.
      contents: write
      actions: read
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: 6e3f7c7e38f07a1d2a012f0717318e5f45af68b9
        persist-credentials: false
    - name: Read new owner receipt and live admission
      env:
        GH_TOKEN: ${{ github.token }}
        BARE_GENERATION: 2.0.9
        TICKET_SHA: ${{ inputs.ticket_sha }}
        R209_DRAFT_ALIAS_SHA: ${{ inputs.owner_alias_sha }}
      run: |
        set -euo pipefail
        umask 077
        [[ "$GITHUB_REF" == refs/heads/bare-209-private-draft-check-20261128 && "$GITHUB_RUN_ATTEMPT" == 1 ]]
        [[ "$(git rev-parse HEAD)" == 6e3f7c7e38f07a1d2a012f0717318e5f45af68b9 ]]
        [[ "$(git rev-parse 'HEAD^{tree}')" == 957099393e951b250cc1a2cdc5906aea170f39c8 ]]
        python3 preflight28/transport/prepare.py tools >/dev/null
        cat >"$RUNNER_TEMP/current-preissue.py" <<'PYTHON'
        """Read the new production receipt and live inputs without creating a run claim."""
        from ast import literal_eval
        from contextlib import redirect_stdout
        from datetime import datetime, timezone
        import hashlib
        import io
        import json
        import os
        from pathlib import Path
        import re
        import sys
        import time

        HEAD = "6e3f7c7e38f07a1d2a012f0717318e5f45af68b9"
        TREE = "957099393e951b250cc1a2cdc5906aea170f39c8"
        DIAGNOSTIC_BRANCH = "bare-209-private-draft-check-20261128"
        PREVIOUS = {45996971462: "a17316eecfdc92f77db46e5f48604e65ad41508c",
                    46088654643: "888cb5b20d3470131a1d77f9a08b7010e09a4110"}
        BLOCKED = 46088654643
        PHASE = "inputs"


        def require(ok):
            if not ok:
                raise ValueError("Conditions changed")


        def now():
            return datetime.now(timezone.utc)


        def evidence(label, **fields):
            print(label + " " + json.dumps(fields, sort_keys=True), file=sys.stderr, flush=True)


        def safe_failure(exc):
            # Public constants only. Raw provider messages, unknown field names, URLs and values never leave this process.
            message = str(exc)
            for prefix, name in (
                ("Incomplete repository Artifact inventory", "incomplete_artifact_views"),
                ("Artifact inventory still settling between complete layouts", "unequal_complete_views"),
                ("Complete Artifact layouts omit", "omitted_previously_observed_ids"),
                ("Invalid Artifact pagination", "invalid_pagination"), ("Invalid Artifact ID", "invalid_asset_id"),
                ("Invalid Artifact inventory", "invalid_inventory"), ("Invalid Artifact size", "invalid_artifact_fields"),
                ("Artifact inventory deadline", "inventory_timeout"), ("Artifact inventory did not terminate", "page_limit"),
                ("Artifact observation exceeds", "artifact_limit"), ("Another run ", "other_active_run"),
                ("Active-run inventory recheck exceeded", "active_run_deadline"),
                ("Active-run inventory recheck incomplete", "inconsistent_active_count"),
                ("Active-run inventory rechecks differ", "active_states_changed"),
                ("Another deadline is active", "concurrent_deadline"),
                ("Candidate exceeds configured", "capacity_exceeded"), ("Storage policy expire", "policy_expiry"),
                ("Insufficient private Release asset slots", "draft_slots_exhausted"),
                ("Public non-fork", "runner_or_repository"), ("Unexpectedly large metadata", "metadata_size_limit")):
                if message.startswith(prefix):
                    details = {}
                    if name == "other_active_run":
                        matched = re.match(r"Another run ([0-9]+) in state=(in_progress|queued|waiting|pending|requested) ", message)
                        if matched:
                            details.update(run=int(matched[1]), state=matched[2])
                    if name in ("incomplete_artifact_views", "inventory_timeout"):
                        observed = re.search(r"([0-9]+) (?:distinct )?observed IDs", message)
                        if observed:
                            details["observed"] = int(observed[1])
                    if name == "unequal_complete_views":
                        for key in ("missing", "unbound additions"):
                            group = re.search(re.escape(key) + r"=\[([0-9, ]*)\]", message)
                            if group:
                                details[key.replace(" ", "_")] = [int(i) for i in group[1].split(",") if i.strip()][:5]
                    return dict(reason=name, **details)
            changed = re.fullmatch(r"Artifact inventory still settling: ID ([0-9]+) changed metadata (\[.*?\]) at per_page=([0-9]+) page=([0-9]+)", message)
            if changed:
                fields = literal_eval(changed[2])
                known = {"id", "node_id", "name", "size_in_bytes", "digest", "expired", "created_at", "updated_at",
                         "expires_at", "url", "archive_download_url", "workflow_run"}
                return dict(reason="artifact_metadata_changed", artifact_id=int(changed[1]), per_page=int(changed[3]),
                            page=int(changed[4]), fields=sorted(known.intersection(fields)), other_fields=len(set(fields)-known))
            status = re.fullmatch(r"(?:GitHub metadata GET|Asset retrieval) returned ([1-5][0-9]{2})", message)
            if status:
                return dict(reason="http_status", status=int(status[1]))
            return {"reason": {ValueError: "local_verification", KeyError: "missing_response_field",
                               TimeoutError: "timeout", IndexError: "missing_result"}.get(type(exc), "unclassified_failure")}


        def print_storage_records(journal):
            admission = []
            for line in journal.getvalue().splitlines():
                tag, _, text = line.partition(" ")
                if tag not in ("R28_ARTIFACT_VIEW", "R28_ARTIFACT_ADMISSION"):
                    continue
                row = json.loads(text)
                names = ("per_page", "pages", "first_total", "last_total", "unique", "last_page_rows", "complete") if tag.endswith("VIEW") else (
                    "known_repository_bytes", "candidate_zip_ceiling_bytes", "concurrent_control_bytes", "peak_bytes",
                    "ceiling_bytes", "expired_still_visible_bytes", "policy_until", "latest_retained_expiry_epoch")
                summary = {k: row[k] for k in names if type(row.get(k)) in (int, bool)}
                if tag.endswith("VIEW"):
                    summary["duplicate_ids"] = [n for n in row.get("duplicates", []) if type(n) is int][:5]
                    summary["count_changes"] = [pair for pair in row.get("count_changes", []) if
                                                isinstance(pair, list) and len(pair) == 2 and all(type(x) is int for x in pair)][:5]
                else:
                    admission.append(summary)
                evidence(tag, **summary)
            return admission


        def preissue():
            global PHASE
            workspace = Path(os.environ["GITHUB_WORKSPACE"])
            sys.path[:0] = [os.environ["RUNNER_TEMP"], str(workspace / "preflight209")]
            import owner
            import transfer
            env = dict(os.environ, R28_STORAGE_VERIFY_ONLY="false")
            alias, ticket_sha = (env[key] for key in ("R209_DRAFT_ALIAS_SHA", "TICKET_SHA"))
            require(all(re.fullmatch("[0-9a-f]{64}", v) for v in (alias, ticket_sha)))
            require(env["BARE_GENERATION"] == "2.0.9" and env["GITHUB_RUN_ATTEMPT"] == "1" and
                    env["GITHUB_REF"] == "refs/heads/" + DIAGNOSTIC_BRANCH and
                    env["GITHUB_EVENT_NAME"] == "workflow_dispatch" and env["GITHUB_REPOSITORY"] == owner.REPO)
            actual = transfer.request
            def read(host, method, path, **kw):
                require(method == "GET" and host in {transfer.API, *transfer.CDNS} and
                        not kw.get("body") and not kw.get("length") and (host == transfer.API or not kw.get("auth")))
                return actual(host, method, path, **kw)
            transfer.request = read
            ordinary_download = transfer.download
            def small(aid, size, digest, output):
                require(type(size) is int and 0 < size <= 16384)
                return ordinary_download(aid, size, digest, output)
            transfer.download = small
            api = owner.PagedOwnerDraft(transfer)
            def check_head_and_runs():
                remote = api.metadata(f"{api.BASE}/git/ref/heads/{owner.BRANCH}")
                require(remote["object"]["type"] == "commit" and remote["object"]["sha"] == HEAD and
                        remote["ref"] == "refs/heads/" + owner.BRANCH)
                rows = api.metadata(f"{api.BASE}/actions/runs?branch={owner.BRANCH}&per_page=100&page=1")
                found = rows["workflow_runs"]
                require(rows["total_count"] == len(found) == len(PREVIOUS) and {r["id"] for r in found} == set(PREVIOUS))
                require(all(r["head_sha"] == PREVIOUS[r["id"]] and r["repository"]["id"] == r["head_repository"]["id"] == owner.REPO_ID
                            and r["head_branch"] == owner.BRANCH and r["run_attempt"] == 1 and r["event"] == "workflow_dispatch"
                            and r["path"] == owner.WORKFLOW and r["status"] == "completed" and r["conclusion"] == "failure"
                            and owner.owner_account(r["actor"]) for r in found))

            PHASE = "production_head_and_run_inventory"
            check_head_and_runs()
            require(api.metadata(f"{api.BASE}/git/commits/{HEAD}")["tree"]["sha"] == TREE)
            rid = int(env["GITHUB_RUN_ID"])
            run = api.metadata(f"{api.BASE}/actions/runs/{rid}/attempts/1")
            require(run["id"] == rid and run["run_attempt"] == 1 and run["path"] == owner.WORKFLOW and
                    run["event"] == "workflow_dispatch" and run["status"] == "in_progress" and
                    run["head_branch"] == DIAGNOSTIC_BRANCH and run["head_sha"] == env["GITHUB_SHA"] and
                    run["repository"]["id"] == run["head_repository"]["id"] == owner.REPO_ID and owner.owner_account(run["actor"]))
            created = owner.instant(run["created_at"])
            require(created <= now())
            genesis = hashlib.sha256((workspace / "preflight209" / "upstream-lock.json").read_bytes()).hexdigest()
            selector = owner.cold.SELECTOR
            require(selector["origin_run"] != BLOCKED and set(PREVIOUS) == {selector["origin_run"], BLOCKED})
            def no_other_claim(release):
                require(not any(re.fullmatch(owner.CAMPAIGN + r"-after-[0-9]+-claim\.json", a["name"]) or
                                a["name"].startswith(f"r209-{BLOCKED}-") for a in release["assets"]))

            PHASE = "new_owner_ticket_and_ack"
            draft = api.draft(api.RELEASE_ID)
            no_other_claim(draft)
            ticket_name = f"{owner.CAMPAIGN}-{HEAD}-after-{selector['origin_run']}-ticket.json"
            ticket_id, ticket = owner.doc(api, draft, ticket_name, "lookup", ticket_sha, created)
            ack_name = f'{owner.CAMPAIGN}-ack-{ticket["registration_nonce"]}.json'
            ack_sha = ticket["collector_ack_sha"]
            ack_id, ack = owner.doc(api, draft, ack_name, ticket["collector_ack_asset_id"], ack_sha, created)
            latest = owner.validate_route(ticket, ack, head=HEAD, genesis=genesis, created=created, now=now(), resume=selector)
            ceiling, until = owner.storage.policy(ticket, ack)
            env.update(R28_STORAGE_CEILING=str(ceiling), R28_STORAGE_UNTIL=str(until))
            def window():
                t = now().timestamp()
                require(t <= latest and t <= until - (owner.SEGMENT + owner.storage.JOURNAL_TAIL +
                                                       owner.storage.JOURNAL_DAYS * owner.storage.DAY))
            window()

            PHASE = "previous_claim_and_recovery_inventory"
            # The canonical cold-parent method is GET-only, including its compute-path availability checks.
            with redirect_stdout(io.StringIO()):
                old_claim = owner.cold_parent(api, draft, ticket, ack, genesis, HEAD, now(), created, verify_only=False)
            require(old_claim == ack["precompile_origin"]["claim_asset_id"])
            blocked_outputs = api.metadata(f"{api.BASE}/actions/runs/{BLOCKED}/artifacts?per_page=100&page=1")
            require(blocked_outputs["total_count"] == 0 and blocked_outputs["artifacts"] == [])

            PHASE = "private_draft_room"
            evidence("CAPACITY_WINDOW", measured_epoch=int(now().timestamp()), latest_start_epoch=latest, storage_until_epoch=until,
                     ceiling_bytes=ceiling, draft_assets=len(draft["assets"]))
            owner.storage.draft_room(draft, env, claim=True)
            inventory = []
            ordinary_rows = owner.storage.receipt_rows
            def count_returned(*args, **kwargs):
                rows = ordinary_rows(*args, **kwargs)
                inventory.append((len(rows), sum(row[0] for row in rows.values())))
                return rows
            def public_get(path):
                global PHASE
                artifact = re.fullmatch(re.escape(api.BASE) + r"/actions/artifacts\?per_page=([0-9]+)&page=([0-9]+)", path)
                active = re.fullmatch(re.escape(api.BASE) + r"/actions/runs\?status=(in_progress|queued|waiting|pending|requested)&per_page=2", path)
                PHASE = "artifact_page" if artifact else "active_runs" if active else "public_repository"
                result = api.metadata(path)
                if active:
                    reported, rows = result.get("total_count"), result.get("workflow_runs")
                    count = len(rows) if isinstance(rows,list) else -1
                    if count or reported != count:
                        ids = [r["id"] for r in rows if isinstance(r,dict) and type(r.get("id")) is int][:2] if isinstance(rows,list) else []
                        evidence("ACTIVE_RUN_VIEW", state=active[1], reported=reported if type(reported) is int else -1, rows=count, ids=ids)
                PHASE = "artifact_inventory" if artifact else "active_run_inventory" if active else "standard_runner"
                return result
            owner.storage.receipt_rows = count_returned
            try:
                for attempt, retry in enumerate((0, 8, 16), 1):
                    if retry:
                        time.sleep(retry)
                    PHASE = "lease_window"
                    window()
                    PHASE = "storage_policy"
                    journal = io.StringIO()
                    try:
                        with redirect_stdout(journal):
                            verdict = owner.storage.admit(public_get, env, owner.storage.lease_size(env),
                                                         1, stage="lease", lead=owner.SEGMENT)
                    except Exception as error:
                        print_storage_records(journal)
                        details = safe_failure(error)
                        evidence("STORAGE_REJECT", attempt=attempt, phase=PHASE, **details)
                        if attempt < 3 and isinstance(error, owner.storage.StorageUnconfirmed) and "inventory" in str(error).lower():
                            continue
                        raise
                    admission = print_storage_records(journal)
                    break
            finally:
                owner.storage.receipt_rows = ordinary_rows
            PHASE = "aggregate_confirmation"
            require(verdict == "admitted" and inventory and len(admission) == 1)
            receipt = admission[0]
            count, total = inventory[-1]
            require(total == receipt["known_repository_bytes"])
            PHASE = "final_head_alias_and_claim_state"
            check_head_and_runs()
            final = api.draft(api.RELEASE_ID)
            no_other_claim(final)
            for name, ident, sha, doc in ((ticket_name, ticket_id, ticket_sha, ticket),
                                           (ack_name, ack_id, ack_sha, ack)):
                require(owner.doc(api, final, name, ident, sha, created)[1] == doc)
            owner.storage.draft_room(final, env, claim=True)
            owner.storage.check_active_runs(api.metadata, env)
            window()
            return dict(measured_at=now().isoformat(timespec="seconds"), production_head=HEAD,
                        production_runs=len(PREVIOUS), draft_assets=len(final["assets"]),
                        repository_artifacts=count, repository_artifact_bytes=receipt["known_repository_bytes"],
                        projected_peak_bytes=receipt["peak_bytes"], ceiling_bytes=ceiling,
                        latest_start_epoch=latest, storage_until_epoch=until, result="pass")


        if __name__ == "__main__":
            try:
                print(json.dumps(preissue(), sort_keys=True))
            except Exception as e:
                evidence("PREISSUE_FAILURE", phase=PHASE, **safe_failure(e))
                sys.exit(1)
        PYTHON
        python3 -I "$RUNNER_TEMP/current-preissue.py"
