name: Bare checkpoint transfer probe
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Resume the small seed, run the paired short trial, or measure one continuation from the verified successor
        type: choice
        default: restore-saved
        options:
        - restore-saved
        - paired
        - measure-scale
permissions: {}
concurrency:
  group: bare-checkpoint-transfer-workflow
  cancel-in-progress: false
jobs:
  seed:
    if: ${{ inputs.mode == 'paired' }}
    uses: ./.github/workflows/bare-arm64-probe.yml
    with:
      probe: checkpoint-seed
  restore:
    if: ${{ inputs.mode == 'paired' }}
    needs: seed
    uses: ./.github/workflows/bare-arm64-probe.yml
    with:
      probe: checkpoint-restore
      expected_checkpoint_key: ${{ needs.seed.outputs.checkpoint_key }}
      expected_checkpoint_sha: ${{ needs.seed.outputs.checkpoint_sha }}
      expected_checkpoint_identity: ${{ needs.seed.outputs.checkpoint_identity }}
      expected_base_image: ${{ needs.seed.outputs.base_image }}
  restore-saved:
    if: ${{ inputs.mode == 'restore-saved' }}
    uses: ./.github/workflows/bare-arm64-probe.yml
    with:
      probe: checkpoint-restore
      expected_checkpoint_key: bare-transfer-v2-42928862523-1-checkpoint-seed
      expected_checkpoint_sha: d03e5ce8221691eec57a5610050931af5d117fe8bb61785f0c93ac89a2676d37
      expected_checkpoint_identity: fc3b4584696b8239bfc3b04db9490e3c0b722b62b81c54c772b96f27543a8896
      expected_base_image: ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
      repair_legacy_input_paths: true
  readback:
    name: Read back the saved continuation on a fresh runner
    needs:
    - restore
    - restore-saved
    - measure-scale
    if: ${{ !cancelled() && (needs.restore.result == 'success' || needs['restore-saved'].result == 'success' || (inputs.mode == 'measure-scale'
      && needs['measure-scale'].outputs.checkpoint_saved == 'true')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.mode == 'measure-scale' && 20 || 10 }}
    defaults:
      run:
        shell: bash
    env:
      EXPECTED_KEY: ${{ needs.restore.outputs.checkpoint_key || needs['restore-saved'].outputs.checkpoint_key || needs['measure-scale'].outputs.checkpoint_key
        }}
      EXPECTED_SHA: ${{ needs.restore.outputs.checkpoint_sha || needs['restore-saved'].outputs.checkpoint_sha || needs['measure-scale'].outputs.checkpoint_sha
        }}
      EXPECTED_IDENTITY: ${{ needs.restore.outputs.checkpoint_identity || needs['restore-saved'].outputs.checkpoint_identity || needs['measure-scale'].outputs.checkpoint_identity
        }}
      READBACK_MODE: ${{ inputs.mode }}
    steps:
    - name: Validate the successor identity and load its exact verifier
      timeout-minutes: 4
      run: |
        [[ $GITHUB_EVENT_NAME == workflow_dispatch && $RUNNER_ENVIRONMENT == github-hosted && $RUNNER_ARCH == X64 ]]
        suffix=restore
        [[ $READBACK_MODE != measure-scale ]] || suffix=scale
        [[ $EXPECTED_KEY =~ ^bare-transfer-v2-${GITHUB_RUN_ID}-[0-9]+-checkpoint-$suffix$ ]]
        [[ $EXPECTED_SHA =~ ^[0-9a-f]{64}$ && $EXPECTED_IDENTITY =~ ^[0-9a-f]{64}$ ]]
        curl --fail --location --retry 2 --max-time 60 \
          "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/checkpoint.py" \
          --output "$RUNNER_TEMP/checkpoint.py"
    - name: Restore only the exact successor key
      id: successor
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/bare-official/exchange/checkpoint/checkpoint.tar.gz
        key: ${{ env.EXPECTED_KEY }}
        fail-on-cache-miss: true
    - name: Verify the restored successor bytes and newly completed outputs
      timeout-minutes: ${{ inputs.mode == 'measure-scale' && 12 || 4 }}
      env:
        CACHE_HIT: ${{ steps.successor.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.successor.outputs.cache-matched-key }}
      run: |
        [[ $CACHE_HIT == true && $MATCHED_KEY == "$EXPECTED_KEY" ]]
        archive="$RUNNER_TEMP/bare-official/exchange/checkpoint/checkpoint.tar.gz"
        [[ -f $archive && ! -L $archive ]]
        printf '%s  %s\n' "$EXPECTED_SHA" "$archive" | sha256sum --check --strict
        limits=()
        [[ $READBACK_MODE != measure-scale ]] || limits+=(--scale)
        python3 "$RUNNER_TEMP/checkpoint.py" validate-archive "$archive" "${limits[@]}"
        python3 "$RUNNER_TEMP/checkpoint.py" verify-continuation "$archive" \
          --expected-identity "$EXPECTED_IDENTITY" --ci-revision "$GITHUB_SHA" "${limits[@]}"
        printf 'Verified successor cache %s\n' "$EXPECTED_KEY"
  measure-scale:
    if: ${{ inputs.mode == 'measure-scale' }}
    uses: ./.github/workflows/bare-arm64-probe.yml
    with:
      probe: checkpoint-scale
      expected_checkpoint_key: bare-transfer-v2-42950651335-1-checkpoint-restore
      expected_checkpoint_sha: 0fec6f756b98561191ef3199f86d965b5fe5b58146bcdb64b51f348f0aeab9a3
      expected_checkpoint_identity: 87c8946d20f1f0f97d494c21291b1bb1865772084f0e1a09577414007c3ae170
      expected_base_image: ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
