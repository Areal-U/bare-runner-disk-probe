  result:
    name: Check terminal certificate
    needs:
    - admit
    - slot01
    - slot02
    - slot03
    - slot04
    - slot05
    - slot06
    - slot07
    - slot08
    - slot09
    - slot10
    - slot11
    - slot12
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions: {}
    steps:
    - name: Require one recovered encrypted terminal and no failed slot
      env:
        SLOTS: ${{ toJSON(needs) }}
      run: |
        python3 - <<'PYTHON'
        import json, os
        j=json.loads(os.environ['SLOTS'])
        finished=[i['outputs'].get('artifact') for i in j.values() if i['result']=='success' and i['outputs'].get('kind')=='apk']
        if any(i['result'] not in ('success','skipped') for i in j.values()) or len(finished)!=1 or not finished[0].isdigit():
            raise SystemExit('No unique fully received APK. Retain the latest immutable checkpoint and diagnostic receipts.')
        print('Encrypted terminal artifact for independent owner signing:',finished[0])
        PYTHON
