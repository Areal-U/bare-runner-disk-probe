name: Look up one R28 owner registration ID
run-name: Look up one R28 owner registration ID
'on':
  workflow_dispatch:
    inputs:
      lookup_kind:
        description: Registration component
        type: choice
        required: true
        options: [ack, ticket]
      expected_sha256:
        description: Expected registration document SHA-256
        type: string
        required: true
permissions: {}
jobs:
  lookup:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Areal-U/bare-runner-disk-probe' &&
      github.repository_id == '1450926240' &&
      github.event.repository.private == false && github.event.repository.fork == false &&
      github.ref == 'refs/heads/bare-r28-owner-receipt-lookup-20261125' &&
      github.actor == 'Areal-U' && github.triggering_actor == 'Areal-U' &&
      github.event.sender.id == 292261483 && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify owner metadata and seal the physical ID
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKUP_KIND: ${{ inputs.lookup_kind }}
          EXPECTED_SHA: ${{ inputs.expected_sha256 }}
        shell: python
        run: |
          import base64
          import datetime
          import http.client
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile

          REPO = "Areal-U/bare-runner-disk-probe"
          BASE = "/repos/" + REPO
          OWNER_ID = 292261483
          RELEASE_ID = 452114666
          CAMPAIGN = "bare-personal-204-r28"
          START = datetime.datetime(2026, 11, 25, tzinfo=datetime.timezone.utc)
          END = datetime.datetime(2026, 11, 26, 6, tzinfo=datetime.timezone.utc)
          RECIPIENT_KEY = '-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqrQlNxoMZ6SjcMOWHrch\nekCyAIcFKdlTnZwI0BggZVIegFT+ss1qJ3dkI6rfZBcDsG2I1KDSjadR57zVe7p+\ng+RcHxNsc5ZfLQyT7EYhXIU1FknRd6evkSAgaR9hyDSlXcWytS3QUihILN27hlm0\njfSZYZ0l52winNTbE3CPEhvVrrzjYJ4kLrCKsEDIEzoOnlwk+rA7Sg/ULVLqI2WV\nt6dAR14ahVfO7yVv0tMhnLnMdMsenx3GgHAU/dbMGncxz4t2LBrLxnmJJJHE3gqS\no4XKqL2qaEA2yc/OWJLQjJrH+gv+ZcFHte4LpAMZ7TgIgFnzZpXpBcsBuXkFhzSy\na2J/W2see4Ylrm4Ec2Vg4iD0vN13ZWT6+MpKqSYBZznrGsqnghByt+XMbOPYH3Oy\nLqwY7cUAkUZs+q4UCUEj/ZooyoFkbv+EWKHxS31Gng9Q6spciNqifC1zfb/EkTzh\n3+C3SInKeZyIdsIU3qDyfv83ORD1bcR03ElD9oTZh1RnAgMBAAE=\n-----END PUBLIC KEY-----\n'


          class LookupFailure(Exception):
              pass


          def check(condition, reason):
              if not condition:
                  raise LookupFailure(reason)


          def get(path):
              connection = http.client.HTTPSConnection("api.github.com", timeout=12)
              try:
                  connection.request("GET", BASE + path, headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "User-Agent": "R28-owner-receipt-lookup",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  response = connection.getresponse()
                  check(response.status == 200, f"Read failed (HTTP {response.status})")
                  body = response.read(4 * 1024 * 1024 + 1)
                  check(len(body) <= 4 * 1024 * 1024, "Unexpected metadata length")
                  return json.loads(body)
              finally:
                  connection.close()


          def owner(row):
              return row.get("login") == "Areal-U" and row.get("id") == OWNER_ID


          def time_of(value):
              if not isinstance(value, str) or not value.endswith("Z"):
                  raise LookupFailure("Invalid service time")
              return datetime.datetime.fromisoformat(value[:-1] + "+00:00")


          def issue_id(kind, digest, now, api=get):
              check(START <= now <= END, "Lookup authorization expired")
              check(kind in ("ack", "ticket") and re.fullmatch("[a-f0-9]{64}", digest),
                    "Invalid lookup request")
              release = api(f"/releases/{RELEASE_ID}")
              check(release.get("id") == RELEASE_ID and release.get("draft") is True and
                    release.get("published_at") is None and owner(release.get("author", {})),
                    "Pinned private draft did not match")
              name_pattern = CAMPAIGN + ("-collector-ack-[0-9a-f]{32,64}" if kind == "ack"
                                         else "-collection-registration") + r"\.json"
              expected = []
              seen = set()
              for page in range(1, 12):
                  rows = api(f"/releases/{RELEASE_ID}/assets?per_page=100&page={page}")
                  check(isinstance(rows, list) and len(rows) <= 100, "Incomplete private inventory")
                  for row in rows:
                      identifier = row.get("id")
                      check(type(identifier) is int and identifier > 0 and identifier not in seen,
                            "Ambiguous or invalid asset identity")
                      seen.add(identifier)
                      if re.fullmatch(name_pattern, row["name"]):
                          if kind == "ticket" or row.get("digest") == "sha256:" + digest:
                              expected.append(row)
                  if len(rows) < 100:
                      break
              else:
                  raise LookupFailure("Incomplete private inventory")
              check(len(expected) == 1, "One matching owner object required")
              row = expected[0]
              check(row.get("state") == "uploaded" and 0 < row["size"] <= 4096 and
                    row.get("digest") == "sha256:" + digest and owner(row.get("uploader", {})) and
                    START <= time_of(row.get("created_at")) <= time_of(row.get("updated_at")) <= now,
                    "Owner, upload state, timestamp, size or service digest mismatch")
              reread = api(f"/releases/assets/{row['id']}")
              check(all(row[k] == reread.get(k) for k in
                        ("id", "name", "uploader", "digest", "created_at", "updated_at", "size", "state")),
                    "Owner metadata changed during lookup")
              return row["id"]


          def encrypted_id(identifier):
              with tempfile.TemporaryDirectory() as tmp:
                  key = Path(tmp) / "public.pem"
                  key.write_text(RECIPIENT_KEY, encoding="ascii")
                  result = subprocess.run(["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", str(key),
                                           "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256",
                                           "-pkeyopt", "rsa_mgf1_md:sha256"],
                                          input=str(identifier).encode("ascii"), stdout=subprocess.PIPE,
                                          stderr=subprocess.DEVNULL, check=True)
                  return base64.b64encode(result.stdout).decode("ascii")


          if __name__ == "__main__":
              try:
                  now = datetime.datetime.now(datetime.timezone.utc)
                  identifier = issue_id(os.environ["LOOKUP_KIND"], os.environ["EXPECTED_SHA"], now)
                  print("R28_OWNER_ID_OAEP_SHA256 " + encrypted_id(identifier))
              except LookupFailure as error:
                  sys.exit(str(error))
              except Exception:
                  sys.exit("Private registration metadata unavailable")
