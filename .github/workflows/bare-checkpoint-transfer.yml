    - slot12
    if: ${{ !cancelled() && github.run_attempt == '1' && inputs.mode == 'build-apk' && inputs.build_segments == '12' && needs.slot12.result == 'success'
      && needs.slot12.outputs.status == 'candidate' && needs.slot12.outputs.ordinal == '12' && needs.slot12.outputs.producer_sha == github.sha &&
      needs.slot12.outputs.accepted_parent == needs.slot11.outputs.sha && needs.slot12.outputs.sha != needs.slot12.outputs.accepted_parent && needs.slot12.outputs.sha
      != '' }}
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/bare-r28-native-slot.yml
    with:
      ordinal: 13
      backend: ${{ inputs.checkpoint_backend }}
      checkpoint_compression: ${{ inputs.checkpoint_compression }}
      parent_manifest_id: ${{ needs.slot12.outputs.manifest_id }}
      parent_manifest_sha: ${{ needs.slot12.outputs.manifest_sha }}
      verify_only: true
      parent_key: ${{ needs.slot12.outputs.key }}
      parent_sha: ${{ needs.slot12.outputs.sha }}
      parent_identity: ${{ needs.slot12.outputs.identity }}
      parent_producer: ${{ needs.slot12.outputs.producer_sha }}
      apk_recipient: ${{ inputs.apk_recipient }}
      minutes: ${{ fromJSON(inputs.compile_minutes) }}
  terminal-12:
    name: Record the terminal receipt of any build segment
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs:
    - slot01
    - slot02
    - slot03
    - slot04
    - slot05
    - slot06
    - slot07
    - slot08
    - slot09
    - slot10
    - slot11
    - slot12
    - slot13
    if: ${{ !cancelled() && inputs.mode == 'build-apk' && inputs.build_segments == '12' && github.run_attempt == '1' }}
    steps:
    - name: Check every causal transition and select the sole outcome
      env:
        NEEDS: ${{ toJSON(needs) }}
      shell: python
      run: |
        import json, os, re
        jobs = json.loads(os.environ["NEEDS"])
        parent = "4381b248b26a7d12443241192c27d00311abaeb5b7d1839c7a5a17d088f736cf"
        end = None
        seen = {parent}
        verified_parent = parent
        for n in range(1,14):
            row = jobs["slot%02d"%n]
            if end is not None:
                if row["result"] != "skipped": raise SystemExit("Unexpected work after terminal state")
                continue
            o = row["outputs"]
            if row["result"] != "success" or o.get("accepted_parent") != parent or o.get("ordinal") != str(n):
                print("R28_INTERRUPTED_RECEIPT "+json.dumps({"slot":n, "verified_parent":verified_parent,
                    "pending_parent":parent if parent != verified_parent else None},sort_keys=True))
                raise SystemExit(f"Slot {n} failed or returned stale lineage")
            # Each successful non-bootstrap receipt requires the restored whole parent frontier.
            if n > 1:
                verified_parent = parent
            state = o.get("status")
            if state == "candidate" and n <= 12:
                child = o["sha"]
                if child in seen or not re.fullmatch("[0-9a-f]{64}", child): raise SystemExit("Repeated or invalid child")
                seen.add(child); parent=child
            elif state in {"apk", "no-progress", "apk-size-exceeded", "cipher-size-exceeded", "limit-verified", "manifest_present_visibility_pending",
                           "relay-quota-denied","relay-capacity-exceeded","relay-deadline","relay-missing","relay-ambiguous"}:
                if state == "limit-verified" and (n != 13 or o["sha"] != parent): raise SystemExit("Unverified terminal parent")
                if state == "apk" and not (o.get("cipher_id") or o.get("cipher_cache")): raise SystemExit("No recoverable APK")
                end = dict(o, slot=n, verified_parent=verified_parent)
            else:
                raise SystemExit("Unknown terminal state")
        if end is None: raise SystemExit("No final receipt")
        print("R28_TERMINAL_RECEIPT "+json.dumps(end, sort_keys=True, separators=(",", ":")))
        if end["status"] == "apk":
            print("Encrypted APK preserved. The independently registered collector must verify owner access, signing and final delivery.")
        if end["status"] != "apk": raise SystemExit("Stopped: " + end["status"])

  recover-first-attempt:
    needs: [terminal-12, reread-loss-admission]
    name: Read-only recovery of the original 12-slot operation
    if: ${{ !cancelled() && github.run_attempt != '1' && github.repository == 'Areal-U/bare-runner-disk-probe' &&
      github.ref == 'refs/heads/bare-coexist-v2.0.4' && ((inputs.mode == 'build-apk' && inputs.build_segments == '12') ||
      (inputs.mode == 'recover-lost-slot' && needs.reread-loss-admission.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    timeout-minutes: 35
    outputs:
      private_ordinal: ${{ steps.lookup.outputs.private_ordinal }}
      private_parent: ${{ steps.lookup.outputs.private_parent }}
      private_identity: ${{ steps.lookup.outputs.private_identity }}
      expected_manifest: ${{ steps.lookup.outputs.manifest_id }}
      expected_manifest_sha: ${{ steps.lookup.outputs.manifest_sha }}
    steps:
    - name: Load the exact read-only reconciliation code
      run: |-
        set -euo pipefail
        cd "$RUNNER_TEMP"
        for file in admission.py receipt_journal.py apk_seal.py recover.py; do
          curl --proto '=https' -fsS --retry 2 --max-time 60 "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/preflight28/control/$file" -o "$file"
        done
    - name: Resolve the original producing attempt and immutable receipts
      id: lookup
      env:
        GH_TOKEN: ${{ github.token }}
        R28_REPLAY_MODE: ${{ inputs.mode }}
        R28_REPLAY_ORDINAL: ${{ needs.reread-loss-admission.outputs.ordinal }}
        R28_REPLAY_PARENT: ${{ needs.reread-loss-admission.outputs.parent_sha }}
        R28_REPLAY_IDENTITY: ${{ needs.reread-loss-admission.outputs.parent_identity }}
      run: python3 "$RUNNER_TEMP/recover.py"
    - name: Download and authenticate the exact encrypted APK Artifact ZIP
      if: ${{ !cancelled() && steps.lookup.outputs.status == 'inspect-terminal' && steps.lookup.outputs.cipher_id != '' }}
      id: exact_artifact
      continue-on-error: true
      timeout-minutes: 10
      env:
        GH_TOKEN: ${{ github.token }}
        ARTIFACT_ID: ${{ steps.lookup.outputs.cipher_id }}
        ARCHIVE_BYTES: ${{ steps.lookup.outputs.cipher_zip_bytes }}
        ARCHIVE_DIGEST: ${{ steps.lookup.outputs.cipher_outer_digest }}
      run: python3 "$RUNNER_TEMP/recover.py" fetch-terminal
    - name: Restore the exact encrypted APK fallback cache
      if: ${{ !cancelled() && steps.lookup.outputs.status == 'inspect-terminal' && steps.lookup.outputs.cipher_cache != '' }}
      continue-on-error: true
      id: apk_cached
      timeout-minutes: 12
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/bare-apk-delivery
        key: ${{ steps.lookup.outputs.cipher_cache }}
        fail-on-cache-miss: true
    - name: Verify the exact encrypted APK bytes
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_ID: ${{ steps.lookup.outputs.cipher_cache_id }}
        ARTIFACT_OK: ${{ steps.exact_artifact.outcome }}
        CACHE_HIT: ${{ steps.apk_cached.outputs.cache-hit }}
        CACHE_MATCH: ${{ steps.apk_cached.outputs.cache-matched-key }}
        ARTIFACT_ID: ${{ steps.lookup.outputs.cipher_id }}
        EXPECTED_CACHE: ${{ steps.lookup.outputs.cipher_cache }}
        EXPECTED_SHA: ${{ steps.lookup.outputs.cipher_sha }}
        EXPECTED_BYTES: ${{ steps.lookup.outputs.cipher_bytes }}
        ORDINAL: ${{ steps.lookup.outputs.ordinal }}
        ACCEPTED_PARENT: ${{ steps.lookup.outputs.accepted_parent }}
      run: python3 "$RUNNER_TEMP/recover.py" verify-terminal
      if: ${{ !cancelled() && steps.lookup.outputs.status == 'inspect-terminal' }}


  recover-draft-checkpoint:
    name: Re-read the exact last private checkpoint without resuming compilation
    needs: recover-first-attempt
    if: ${{ !cancelled() && github.run_attempt != '1' && inputs.checkpoint_backend == 'draft' && needs.recover-first-attempt.result == 'success' && needs.recover-first-attempt.outputs.private_ordinal != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: write
      actions: read
    env:
      R28_SLOT: ${{ needs.recover-first-attempt.outputs.private_ordinal }}
      R28_PARENT_SHA: ${{ needs.recover-first-attempt.outputs.private_parent }}
      R28_PARENT_IDENTITY: ${{ needs.recover-first-attempt.outputs.private_identity }}
      R28_HEAD_SHA: ${{ github.sha }}
      R28_EXPECTED_RECOVERY_MANIFEST: ${{ needs.recover-first-attempt.outputs.expected_manifest }}
      R28_EXPECTED_RECOVERY_MANIFEST_SHA: ${{ needs.recover-first-attempt.outputs.expected_manifest_sha }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: |
          preflight28
        sparse-checkout-cone-mode: false
    - run: python3 preflight28/transport/prepare.py tools
    - name: Reacquire the canonical Draft assets with a GET-only client
      id: recovered
      timeout-minutes: 80
      env:
        GH_TOKEN: ${{ github.token }}
        R28_CHECK_RUN: ${{ job.check_run_id }}
      run: |
        export R28_STEP_START="$(date +%s)"
        python3 preflight28/control/recover_private.py
    - name: Record the recovered checkpoint receipt
      env:
        PRIVATE_VERIFIED: ${{ steps.recovered.outputs.private_readback_verified }}
        PARTIAL: ${{ steps.recovered.outputs.recovery_status }}
        OWNER_OUTCOME_ARTIFACT_ID: ${{ steps.recovered.outputs.owner_outcome_artifact_id }}
        MANIFEST_ID: ${{ steps.recovered.outputs.checkpoint_manifest_id }}
        MANIFEST_SHA: ${{ steps.recovered.outputs.checkpoint_manifest_sha }}
        DIGEST: ${{ steps.recovered.outputs.checkpoint_sha }}
      run: |
        if [[ $PRIVATE_VERIFIED == false ]]; then
          case "$PARTIAL" in
            manifest_present_visibility_pending)
              [[ $MANIFEST_ID =~ ^[1-9][0-9]*$ && $MANIFEST_SHA =~ ^[0-9a-f]{64}$ && $DIGEST =~ ^[0-9a-f]{64}$ ]]
              printf 'Original slot %s manifest %s SHA-256 %s. Authenticated bytes agree. Anonymous visibility confirmation is pending.\n' "$R28_SLOT" "$MANIFEST_ID" "$MANIFEST_SHA"
              exit 1 ;;
            owner_outcome_artifact_available)
              printf 'Owner outcome Artifact %s. The preceding record contains its ZIP digest and expiry.\n' "$OWNER_OUTCOME_ARTIFACT_ID"
              exit 0 ;;
            partial_private_parts|all_private_bytes_verified_manifest_absent)
              printf 'Original slot %s private recovery: %s. Immutable intent and verified part IDs are in the preceding evidence. Compilation remains stopped.\n' "$R28_SLOT" "$PARTIAL"
              exit 0 ;;
            *) exit 1 ;;
          esac
        fi
        [[ $PRIVATE_VERIFIED == true ]]
        [[ $MANIFEST_ID =~ ^[1-9][0-9]*$ && $DIGEST =~ ^[0-9a-f]{64}$ ]]
        printf 'Prior attempt slot %s checkpoint SHA-256 %s, private manifest ID %s.\n' "$R28_SLOT" "$DIGEST" "$MANIFEST_ID"
