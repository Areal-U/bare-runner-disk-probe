        #!/usr/bin/env bash
        # A fresh GitHub-hosted runner receives one authenticated draft asset before calling this.
        # The caller downloads to RUNNER_TEMP; this script never obtains a cache or an asset.
        set -euo pipefail
        umask 022
        [[ $# == 1 && ${GITHUB_ACTIONS:-} == true && ${RUNNER_ENVIRONMENT:-} == github-hosted ]]
        [[ $RUNNER_OS == Linux && $RUNNER_ARCH == X64 && $GITHUB_EVENT_NAME == pull_request ]]
        [[ $GITHUB_REPOSITORY == Areal-U/bare-runner-disk-probe ]]
        [[ -d $RUNNER_TEMP && ! -L $RUNNER_TEMP && -f $1 && ! -L $1 ]]
        asset=$(realpath -e -- "$1")
        [[ $asset == "$RUNNER_TEMP/"* && ! -e $RUNNER_TEMP/bare-official && ! -e $RUNNER_TEMP/bare-ci ]]
