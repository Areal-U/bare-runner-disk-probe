name: Receive original sealed APK cache in the owner's Draft
'on':
  workflow_call:
    inputs:
      ticket_id:
        required: true
        type: string
      ticket_sha:
        required: true
        type: string
      genesis:
        required: true
        type: string
      ordinal:
        required: true
        type: string
      parent:
        required: true
        type: string
      claim:
        required: true
        type: string
      cache_id:
        required: true
        type: string
      cache_key:
        required: true
        type: string
      cipher_sha:
        required: true
        type: string
      cipher_bytes:
        required: true
        type: string
      seal_sha:
        required: true
        type: string
    outputs:
      receipt_id:
        value: ${{ jobs.deliver-cached-apk.outputs.receipt_id }}
      receipt_sha:
        value: ${{ jobs.deliver-cached-apk.outputs.receipt_sha }}
      cipher_id:
        value: ${{ jobs.deliver-cached-apk.outputs.cipher_id }}
permissions: {}
jobs:
  deliver-cached-apk:
    name: Recover original encrypted cache slot ${{ inputs.ordinal }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    env:
      BARE_GENERATION: 2.0.9
      R28_SLOT: ${{ inputs.ordinal }}
      R28_PARENT_SHA: ${{ inputs.parent }}
      CLAIM: ${{ inputs.claim }}
      CACHE_KEY: ${{ inputs.cache_key }}
      CACHE_ID: ${{ inputs.cache_id }}
      CIPHER_SHA: ${{ inputs.cipher_sha }}
      CIPHER_BYTES: ${{ inputs.cipher_bytes }}
      SEAL_SHA: ${{ inputs.seal_sha }}
    outputs:
      receipt_id: ${{ steps.deposit.outputs.receipt_id }}
      receipt_sha: ${{ steps.deposit.outputs.receipt_sha }}
      cipher_id: ${{ steps.deposit.outputs.cipher_id }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Stage pinned private Draft client
      run: python3 preflight28/transport/prepare.py tools
    - name: Read the original physical claim and receiving window
      id: owner
      env:
        GH_TOKEN: ${{ github.token }}
        TICKET: ${{ inputs.ticket_id }}
        TICKET_SHA: ${{ inputs.ticket_sha }}
        GENESIS: ${{ inputs.genesis }}
      run: python3 preflight209/owner.py delivery --ticket-id "$TICKET" --ticket-sha "$TICKET_SHA" --genesis "$GENESIS"
    - name: Check exact source cache and original Artifact absence
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        REGISTERED_CLAIM: ${{ steps.owner.outputs.claim }}
      run: python3 preflight209/cache_delivery.py authorize
    - name: Restore only the confirmed original cache
      id: restore
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      timeout-minutes: 6
      with:
        path: .r209-owner-cache
        key: ${{ steps.source.outputs.key }}
        fail-on-cache-miss: true
    - name: Deposit and read back the original sealed pair
      id: deposit
      env:
        GH_TOKEN: ${{ github.token }}
        REGISTERED_CLAIM: ${{ steps.owner.outputs.claim }}
        DELIVERY_LATEST: ${{ steps.owner.outputs.latest_start }}
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CACHE_MATCH: ${{ steps.restore.outputs.cache-matched-key }}
      run: python3 preflight209/cache_delivery.py deposit
