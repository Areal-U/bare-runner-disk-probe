name: Bare R28 independently read the accepted original S2
run-name: r28-preflight-s2-20261125 / read private manifest 789542812
'on':
  pull_request:
    types:
    - synchronize
    branches:
    - bare-coexist-v2.0.4
    paths:
    - .github/workflows/bare-r28-s2-thaw.yml
permissions: {}
cache-mode: none
concurrency:
  group: r28-read-original-789542812
  cancel-in-progress: false
env:
  PRIOR_SHA: e051ee53bae0b2ce885b778bb1ccf5beea0f7249
  TRIAL_SHA: ${{ github.event.pull_request.head.sha }}
  R28_CAMPAIGN: r28-preflight-s2-20261125-v3
  R28_RESUME_PUBLISHED: '45522666298'
defaults:
  run:
    shell: bash
jobs:
  issue:
    runs-on: ubuntu-24.04
    cache-mode: none
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number
      == 9 && github.actor == 'Areal-U' && github.triggering_actor == 'Areal-U' && github.repository == 'Areal-U/bare-runner-disk-probe'
      && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name
      == github.repository && github.head_ref == 'work-bare-27-storage-check' && github.base_ref == 'bare-coexist-v2.0.4'
      && github.event.pull_request.base.sha == 'bf70ddbf474f3390a62220a076b8c43347fecc64' && github.event.before == 'e051ee53bae0b2ce885b778bb1ccf5beea0f7249'
      }}
    permissions:
      actions: read
      contents: write
    name: Grant only a short-lived read of original private checkpoint parts
    timeout-minutes: 110
    env:
      MANIFEST_ID: '789542812'
      MANIFEST_SHA: 2bf4a5a4516e5c5609d151a26436a7e4a0f04f067079796880333cdb32329267
    steps:
    - name: Read fixed public source at the exact synchronized head
      timeout-minutes: 6
      run: |-
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Areal-U/bare-runner-disk-probe
        [[ $TRIAL_SHA =~ ^[0-9a-f]{40}$ ]]
        git init --quiet .
        git sparse-checkout set --no-cone '/preflight28/' '/.github/workflows/'
        GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$TRIAL_SHA"
        git checkout --quiet --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$TRIAL_SHA"
        printf 'run=%s attempt=%s role=%s hosted_runner=%s version=%s
        ' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$RUNNER_NAME" "${ImageVersion:-unknown}"
    - name: Load fixed R26 environment and validated owner-Draft client
      timeout-minutes: 5
      run: python3 preflight28/transport/prepare.py tools
    - name: Confirm the immutable private generation and original completed audit
      timeout-minutes: 8
      env: &id001
        GH_TOKEN: ${{ github.token }}
      run: python3 preflight28/transport/published_reader.py verify
    - name: Locate authenticated key Artifact
      timeout-minutes: 20
      env: *id001
      run: python3 preflight28/transport/thaw_read.py wait key
      id: find
    - name: Read exact peer Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 5
      with:
        artifact-ids: ${{ steps.find.outputs.id }}
        path: ${{ runner.temp }}/r28-thaw/incoming
        digest-mismatch: error
        merge-multiple: true
    - name: Issue fresh part-scoped GET redirects encrypted to the separate runner
      timeout-minutes: 80
      env: *id001
      run: python3 preflight28/transport/thaw_read.py issue
    - name: Deposit descriptor for this exact recovery
      id: put_descriptor
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      with:
        name: r28-thaw-${{ github.run_id }}-a${{ github.run_attempt }}-descriptor
        if-no-files-found: error
        overwrite: false
        retention-days: 1
        compression-level: 0
        path: ${{ runner.temp }}/r28-thaw/descriptor.cms
  receive:
    runs-on: ubuntu-24.04
    cache-mode: none
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.number
      == 9 && github.actor == 'Areal-U' && github.triggering_actor == 'Areal-U' && github.repository == 'Areal-U/bare-runner-disk-probe'
      && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name
      == github.repository && github.head_ref == 'work-bare-27-storage-check' && github.base_ref == 'bare-coexist-v2.0.4'
      && github.event.pull_request.base.sha == 'bf70ddbf474f3390a62220a076b8c43347fecc64' && github.event.before == 'e051ee53bae0b2ce885b778bb1ccf5beea0f7249'
      }}
    permissions:
      actions: read
    name: Ordinary runner reads and verifies the private generation from the original recipe
    timeout-minutes: 300
    env:
      MANIFEST_ID: '789542812'
      MANIFEST_SHA: 2bf4a5a4516e5c5609d151a26436a7e4a0f04f067079796880333cdb32329267
    steps:
    - name: Read fixed public source at the exact synchronized head
      timeout-minutes: 6
      run: |-
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = Areal-U/bare-runner-disk-probe
        [[ $TRIAL_SHA =~ ^[0-9a-f]{40}$ ]]
        git init --quiet .
        git sparse-checkout set --no-cone '/preflight28/' '/.github/workflows/'
        GIT_TERMINAL_PROMPT=0 git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" "$TRIAL_SHA"
        git checkout --quiet --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "$TRIAL_SHA"
        printf 'run=%s attempt=%s role=%s hosted_runner=%s version=%s
        ' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_JOB" "$RUNNER_NAME" "${ImageVersion:-unknown}"
    - name: Pin original source separately from this recovery ticket
      timeout-minutes: 5
      run: |
        set -euo pipefail
        source_tree="$RUNNER_TEMP/r28-frozen-81105d5f7b"
        git -c credential.helper= -c http.extraHeader= fetch --no-tags --depth=1 "https://github.com/$GITHUB_REPOSITORY.git" 81105d5f7b9ba994034753ce4fbd65d9b981dde3
        git -c advice.detachedHead=false worktree add --detach "$source_tree" 81105d5f7b9ba994034753ce4fbd65d9b981dde3
        test "$(git -C "$source_tree" rev-parse HEAD)" = 81105d5f7b9ba994034753ce4fbd65d9b981dde3
        test "$(git rev-parse HEAD)" = "$TRIAL_SHA"
        test -f "$source_tree/.github/workflows/bare-r28-s2-recovery.yml"
        {
         echo "THAW_SOURCE_TREE=$source_tree"
         echo "THAW_CIPHER_DIR=$RUNNER_TEMP/r28-thaw/original-cipher"
         echo "THAW_KEY_ARTIFACT_DIR=$RUNNER_TEMP/r28-thaw/original-key"
         echo "THAW_KEY_PEM=$RUNNER_TEMP/r28-thaw/original-private.pem"
         echo "THAW_PARENT=$RUNNER_TEMP/bare-official/exchange/checkpoint/checkpoint.tar.gz"
        } >> "$GITHUB_ENV"
    - name: Use authenticated service job start and confirm original cache identity
      timeout-minutes: 3
      run: |
        set -euo pipefail
        if [[ ! ${CHECK_RUN:-} =~ ^[1-9][0-9]*$ ]]; then
         CHECK_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" |
           jq -er --arg name "$CLOCK_NAME" '[.jobs[]|select(.name==$name and .status=="in_progress")|.check_run_url|split("/")|last]|select(length==1)|first')
        fi
        epoch=$(python3 preflight28/limits/guard.py job-clock --check-run "$CHECK_RUN")
        echo "JOB_STARTED=$epoch" >> "$GITHUB_ENV"
      env:
        GH_TOKEN: ${{ github.token }}
        JOB_READ_TOKEN: ${{ github.token }}
        CHECK_RUN: ${{ job.check_run_id }}
        CLOCK_NAME: Ordinary runner reads and verifies the private generation from the original recipe
    - name: Reserve the receiving disk before requesting expiring private redirects
      timeout-minutes: 6
      run: bash preflight28/bridge/host_space.sh
    - name: Verify ordinary token denial and generate ephemeral receiver public key
      timeout-minutes: 4
      env: *id001
      run: python3 preflight28/transport/thaw_read.py key
    - name: Deposit receiver-key for this exact recovery
      id: put_receiver_key
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 5
      with:
        name: r28-thaw-${{ github.run_id }}-a${{ github.run_attempt }}-receiver-key
        if-no-files-found: error
        overwrite: false
        retention-days: 1
        compression-level: 0
        path: |-
          ${{ runner.temp }}/r28-thaw/public.pem
          ${{ runner.temp }}/r28-thaw/holder.json
    - name: Locate authenticated descriptor Artifact
      timeout-minutes: 88
      env: *id001
      run: python3 preflight28/transport/thaw_read.py wait descriptor
      id: find
    - name: Read exact peer Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 5
      with:
        artifact-ids: ${{ steps.find.outputs.id }}
        path: ${{ runner.temp }}/r28-thaw/incoming
        digest-mismatch: error
        merge-multiple: true
    - name: Download and hash every private checkpoint byte without repository credentials
      timeout-minutes: 20
      run: python3 preflight28/transport/thaw_read.py read
    - name: Independently restore using the exact original code, provenance, and strictly dry APK plan
      timeout-minutes: 178
      run: |-
        set -euo pipefail
        observer="$GITHUB_WORKSPACE/preflight28/transport/thaw_observe.py"
        cd "$THAW_SOURCE_TREE"
        test "$(git rev-parse HEAD)" = 81105d5f7b9ba994034753ce4fbd65d9b981dde3
        env GITHUB_WORKSPACE="$THAW_SOURCE_TREE" TRIAL_SHA=81105d5f7b9ba994034753ce4fbd65d9b981dde3 R28_CAMPAIGN=r28-preflight-s2-20261125-v2 python3 -I "$observer"
