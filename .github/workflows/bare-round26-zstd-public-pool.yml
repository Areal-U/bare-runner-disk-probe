name: Read round 26 zstd with exact signed Ubuntu packages
run-name: Round 28 preparation — public pool zstd readback
'on':
  pull_request:
    types:
    - synchronize
    branches:
    - bare-coexist-v2.0.4
    paths:
    - .github/workflows/bare-round26-zstd-public-pool.yml
permissions: {}
cache-mode: none
concurrency:
  group: bare-round26-zstd-public-pool-pr9
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  zstd_read:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      SOURCE_SHA: 47c60e1b6c7e9d9668234a7ec3d6cedcf9ae041d1bb8e183c4c4630d40098b57
      RAW_SHA: 594aff5008fbbe18c411ec4ab9cd909b02b33741d1249948a7332737a2f9af55
      SOURCE_REV: bf70ddbf474f3390a62220a076b8c43347fecc64
      IDENTITY: a11dd3df7bccafb011f90f562e997b4601fa8a200f85c39d09d6fc962de8a3dc
      BARE_R26_TAR_CEILING: '12884901888'
    name: Independently read the zstd cache, verify reuse and compile a new object
    cache-mode: read
    timeout-minutes: 175
    steps:
    - name: Check the previous failed independent recipient
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\napi=\"repos/$GITHUB_REPOSITORY/actions/runs/45345947762/attempts/1\"\ngh api \"$api\" --jq '[.id,.run_attempt,.head_sha,.path,.conclusion]\
        \ | @tsv' |\n  grep -Fx $'45345947762\t1\t98f86e5ce9fbb449b6f34da47509a72ca4e00363\t.github/workflows/bare-round26-zstd-readback.yml\tfailure'\ngh api \"\
        $api/jobs?per_page=100\" --jq '.jobs[] | select(.id==138280403338 and .run_id==45345947762 and .conclusion==\"failure\") | .steps[] | select(.name==\"Verify\
        \ producer provenance, Ninja reuse and fresh compile progress\") | .conclusion' | grep -Fx failure\n"
    - name: Stage the reviewed fixed-index Ubuntu package verifier
      run: |
        cat > "$RUNNER_TEMP/round26-pool-install.py" <<'SIGNED_APT_POOL_PY'
        """Install the pinned Chromium dependency plan using public, integrity-matched Ubuntu pool objects."""
        from concurrent.futures import ThreadPoolExecutor
        from hashlib import sha256
        from pathlib import Path
        from tempfile import TemporaryDirectory
        from urllib.parse import quote, unquote, urlsplit
        import http.client
        import json
        import os
        import re
        import runpy
        import shlex
        import subprocess
        import sys
        import time

        SNAP = "https://snapshot.ubuntu.com/ubuntu/20261112T093000Z/"
        REV = "800628ad1ca1fd0c51e3b43b5b2bca081e81c3f6"
        ALLOWED_POOL = re.compile(r"pool/(main|universe|restricted|multiverse)/[a-z0-9]+/[a-z0-9][a-z0-9+.\-]*/[a-zA-Z0-9.+~_%:\-]+\.deb")
        DEB_NAME = re.compile(r"[A-Za-z0-9][A-Za-z0-9.+~_%:\-]*\.deb")

        def fail(reason):
            raise ValueError(reason)

        def checked(cmd):
            return subprocess.check_output(cmd, text=True).strip()

        def fields(lines):
            record = {}
            for line in lines:
                line = line.rstrip("\n")
                if not line:
                    if record:
                        yield record
                        record = {}
                elif not line[0].isspace() and ": " in line:
                    key, value = line.split(": ", 1)
                    record[key] = value
            if record:
                yield record

        def requested(lines):
            plan = {}
            for line in lines.splitlines():
                if not line.startswith("'"):
                    continue
                uri, dest, size, _hash = shlex.split(line)
                path = unquote(uri.removeprefix(SNAP))
                if not uri.startswith(SNAP) or urlsplit(uri).query or not ALLOWED_POOL.fullmatch(path) or not DEB_NAME.fullmatch(dest):
                    fail("Unrecognized package URI or local cache filename in APT transaction: " + uri)
                item = (dest, int(size))
                if item[1] <= 0 or (path in plan and plan[path] != item):
                    fail("Conflicting APT transaction entry")
                plan[path] = item
            if len(plan) != len({v[0] for v in plan.values()}):
                fail("Conflicting APT destination filenames")
            return plan

        def records_for(plan):
            targets = list(fields(checked(["apt-get","indextargets"]).splitlines()))
            package_indexes = [t for t in targets if t.get("Identifier") == "Packages"]
            if not package_indexes:
                fail("No verified APT Packages indexes")
            records = {}
            for target in package_indexes:
                index = Path(target["Filename"])
                if target.get("Trusted") != "yes" or not target["URI"].startswith(SNAP+"dists/") or index.parent != Path("/var/lib/apt/lists"):
                    fail("Repository outside the exact trusted snapshot: "+target.get("URI","?"))
                with subprocess.Popen(["/usr/lib/apt/apt-helper","cat-file",str(index)],stdout=subprocess.PIPE,text=True) as proc:
                    for rec in fields(proc.stdout):
                        path = rec.get("Filename")
                        if path not in plan:
                            continue
                        record = (rec["Package"], rec["Version"], rec["Architecture"], int(rec["Size"]), rec["SHA256"])
                        if record[2] not in ("amd64","i386","all") or not re.fullmatch(r"[0-9a-f]{64}",record[4]) or record[3] != plan[path][1]:
                            fail("Signed package metadata does not match APT transaction: " + path)
                        if path in records and records[path] != record:
                            fail("Conflicting signed package metadata: " + path)
                        records[path] = record
                    if proc.wait():
                        fail("Failed to read signed Packages data")
            if records.keys() != plan.keys():
                fail("Missing signed records: " + str(sorted(plan.keys()-records.keys())))
            return records

        def download(host, path, record, dest):
            with open(dest,"wb") as f:
                con = http.client.HTTPSConnection(host, timeout=35)
                try:
                    # Use the official pool's path; credentials and cross-host redirects are unnecessary.
                    url = "/ubuntu/"+quote(path,safe="/+.~_:-")
                    con.request("GET",url,headers={"User-Agent":"bare-checkpoint-dependency-readback"})
                    response = con.getresponse()
                    if response.status != 200:
                        return f"HTTP {response.status}"
                    digest = sha256()
                    total = 0
                    while block := response.read(512*1024):
                        total += len(block)
                        if total > record[3]:
                            fail("Oversized public package: " + path)
                        f.write(block)
                        digest.update(block)
                finally:
                    con.close()
            if (total, digest.hexdigest()) != (record[3], record[4]):
                fail("Size/SHA256 mismatch for " + host + "/" + path)
            for field, expected in zip(("Package","Version","Architecture"),record[:3]):
                if checked(["dpkg-deb","-f",str(dest),field]) != expected:
                    fail(f"Public package {field} differs from signed index: {path}")
            return "verified"

        def acquire(args):
            path,record,dest = args
            status = []
            for host in ("archive.ubuntu.com","security.ubuntu.com"):
                try:
                    result = download(host,path,record,dest)
                except (OSError,http.client.HTTPException) as exc:
                    result = type(exc).__name__
                if result == "verified":
                    return None
                status.append(host+"="+result)
            return (path, *status)

        def main():
            os.environ["LC_ALL"] = "C"
            source = "build/install-build-deps.py"
            if checked(["git","rev-parse","HEAD"]) != REV or checked(["git","hash-object",source]) != checked(["git","rev-parse",REV+":"+source]):
                fail("Chromium dependency resolver differs from the reviewed revision")
            # Start from this new runner's signed release indexes; the apt repository
            # configuration comes from the fixed image build above.
            apt_dir = Path("/etc/apt")
            for src in [apt_dir/"sources.list", *(apt_dir/"sources.list.d").glob("*.list"), *(apt_dir/"sources.list.d").glob("*.sources")]:
                if not src.exists():
                    continue
                for line in src.read_text().splitlines():
                    stripped = line.split("#",1)[0].strip()
                    if stripped and (not stripped.startswith(("deb ","deb-src ")) or not stripped.split()[1].rstrip("/")+"/" == SNAP):
                        fail("Unexpected APT source; need only the fixed snapshot")
            module = runpy.run_path(source)
            options = module["parse_args"](["--android","--no-prompt"])
            for check in ["check_lsb_release","check_architecture","check_root"]:
                module[check]()
            module["check_distro"](options)
            module["quick_check"](options)
            if options.lib32 or options.backwards_compatible:
                subprocess.run(["sudo","dpkg","--add-architecture","i386"],check=True)
            subprocess.run(["sudo","apt-get","-o","APT::Update::Error-Mode=any","-o","Acquire::Retries=0","-o","Acquire::AllowInsecureRepositories=false","update"],check=True)
            packages = module["find_missing_packages"](options)
            if packages:
                base = ["apt-get","--allow-downgrades","--assume-yes"]
                plan = requested(checked([*base,"--print-uris","--download-only","install",*packages]))
                records = records_for(plan)
                total = sum(r[3] for r in records.values())
                print(f"Signed snapshot plan: {len(plan)} downloadable files, {total} bytes, {len(packages)} install arguments",flush=True)
                with TemporaryDirectory(prefix="bare-signed-pool-") as tmp:
                    destination = Path(tmp)
                    tasks = [(p,records[p],destination/plan[p][0]) for p in sorted(plan)]
                    with ThreadPoolExecutor(max_workers=8) as pool:
                        missing = [result for result in pool.map(acquire,tasks) if result is not None]
                    if missing:
                        print(json.dumps({"failure":"unavailable exact files at official public pools","count":len(missing),"files":missing},sort_keys=True),flush=True)
                        sys.exit(1)
                    if tasks:
                        subprocess.run(["sudo","cp","--",*(str(t[2]) for t in tasks),"/var/cache/apt/archives/"],check=True)
                # APT still controls package installation and dependency resolution; disallow
                # any transport back to the original archive or installation of an unsigned item.
                subprocess.run(["sudo","DEBIAN_FRONTEND=noninteractive",*base,"--no-download","-o","APT::Get::AllowUnauthenticated=false","-qq","install",*packages],check=True)
                for name,version,arch,size,digest in set(records.values()):
                    package = name if arch == "all" else name+":"+arch
                    actual = checked(["dpkg-query","-W","-f=${db:Status-Status} ${Version} ${Architecture}",package])
                    if actual != f"installed {version} {arch}":
                        fail(f"Unmatched installed package: {package} {actual}")
                print(f"Installed and verified the sealed APT transaction using {len(plan)} exact pool files.",flush=True)
            module["install_chromeos_fonts"](options)
            module["install_locales"]()

        if __name__ == "__main__":
            main()
        SIGNED_APT_POOL_PY
    - name: Check the original successful writer and failed recipient
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        api="repos/$GITHUB_REPOSITORY/actions/runs/45344329355/attempts/1"
        gh api "$api" > "$RUNNER_TEMP/original-r26-run.json"
        gh api "$api/jobs?per_page=100" > "$RUNNER_TEMP/original-r26-jobs.json"
        python3 -I - <<'PYTHON'
        from pathlib import Path
        import json, os
        p = Path(os.environ["RUNNER_TEMP"])
        run = json.loads((p/"original-r26-run.json").read_text())
        jobs = json.loads((p/"original-r26-jobs.json").read_text())["jobs"]
        if (run["id"], run["run_attempt"], run["head_sha"], run["head_branch"], run["event"], run["path"]) != (
            45344329355, 1, "15143d3b560aee6e3585b19484409b6444c1ae1f", "work-bare-27-storage-check", "pull_request",
            ".github/workflows/bare-round26-transport-check.yml"):
            raise SystemExit("Original producer attempt does not match")
        def check(job_id, result, step, step_result):
            hits = [j for j in jobs if j["id"] == job_id and j["run_id"] == run["id"]
                    and j["status"] == "completed" and j["conclusion"] == result]
            if len(hits) != 1 or [s["conclusion"] for s in hits[0]["steps"] if s["name"] == step] != [step_result]:
                raise SystemExit("Original commit, job or step outcome differs")
        check(138275144730, "success", "Read the new cache ID and confirm every prior entry", "success")
        check(138276855581, "failure", "Verify producer provenance, Ninja reuse and fresh compile progress", "failure")
        print("Confirmed original sender receipt and actual failed readback job on immutable attempt 1")
        PYTHON
    - name: Prepare the reviewed dual-format reader and metadata checks
      run: "set -euo pipefail\nroot=\"$RUNNER_TEMP/bare-zstd-tools\"\nmkdir \"$root\"\ncd \"$root\"\ncurl --proto '=https' -fsSL --retry 2 --max-time 60 \\\n  \"\
        https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$SOURCE_REV/checkpoint.py\" -o checkpoint.py\necho '20ca6c2f1ac6862e730ec06575e3cd009673e34a833610b1b7bc9c10fca4683d\
        \  checkpoint.py' | sha256sum --check --strict\ncat > \"$RUNNER_TEMP/dual-reader.patch\" <<'R28_INLINE_PATCH'\n--- a/checkpoint.py\n+++ b/checkpoint.py\n\
        @@ -1,6 +1,7 @@\n #!/usr/bin/env python3\n \"\"\"Validate, identify and verify the bounded Bare build checkpoint.\"\"\"\n \n+from contextlib import contextmanager\n\
        \ import argparse\n import gzip\n import hashlib\n@@ -323,6 +324,54 @@\n             yield entry\n \n \n+class BoundedTarStream:\n+    \"\"\"Cap raw tar bytes,\
        \ including headers and padding, before tarfile parses them.\"\"\"\n+    def __init__(self, stream, limit):\n+        self.stream = stream\n+        self.remaining\
        \ = limit\n+\n+    def read(self, size):\n+        block = self.stream.read(min(size, self.remaining + 1))\n+        if len(block) > self.remaining:\n+  \
        \          raise ValueError(\"Checkpoint raw tar stream exceeds local ceiling\")\n+        self.remaining -= len(block)\n+        return block\n+\n+\n+@contextmanager\n\
        +def open_checkpoint_tar(archive_path):\n+    with archive_path.open(\"rb\", buffering=0) as source:\n+        magic = source.read(4)\n+        source.seek(0)\n\
        +        if magic[:2] == b\"\\x1f\\x8b\":\n+            with tarfile.open(fileobj=source, mode=\"r|gz\") as archive:\n+                yield archive\n+  \
        \          return\n+        if magic != b\"\\x28\\xb5\\x2f\\xfd\":\n+            raise ValueError(\"Unknown checkpoint compression format\")\n+\n+       \
        \ # LOCAL PROTOTYPE: the harness supplies a trusted, bounded tar ceiling.\n+        # The CI-side ceiling includes tar headers and padding, separate from\
        \ file payload.\n+        limit = int(os.environ[\"BARE_R26_TAR_CEILING\"])\n+        if limit <= 0:\n+            raise ValueError(\"Raw tar ceiling must\
        \ be positive\")\n+        with subprocess.Popen([\"zstd\", \"-qdc\", \"-M128MB\"], stdin=source,\n+                              stdout=subprocess.PIPE)\
        \ as decoder:\n+            try:\n+                stream = BoundedTarStream(decoder.stdout, limit)\n+                with tarfile.open(fileobj=stream, mode=\"\
        r|\") as archive:\n+                    yield archive\n+                # tarfile can stop at the logical tar EOF before the frame checksum.\n+          \
        \      while stream.read(1024 ** 2):\n+                    pass\n+                if decoder.wait() != 0:\n+                    raise ValueError(\"Checkpoint\
        \ zstd integrity check failed\")\n+            finally:\n+                if decoder.poll() is None:\n+                    decoder.kill()\n+             \
        \   decoder.stdout.close()\n+\n+\n def inspect_input_paths(archive_path, max_records=2_000_000,\n                         max_line_bytes=64 * 1024, max_decompressed_bytes=1024\
        \ ** 3,\n                         *, max_archive_bytes=1024 ** 3,\n@@ -343,7 +392,7 @@\n     result = None\n     members = 0\n     unpacked_bytes = 0\n- \
        \   with tarfile.open(archive_path, mode=\"r|gz\") as archive:\n+    with open_checkpoint_tar(archive_path) as archive:\n         for member in archive:\n\
        \             members += 1\n             unpacked_bytes += member.size\n@@ -858,7 +907,7 @@\n     limits = {CONTINUATION_RECORD: 32 * 1024, CONTINUATION_TRIAL:\
        \ trial_limit,\n               PROVENANCE_RECORD: 1024 ** 2}\n     records = {}\n-    with tarfile.open(archive_path, mode=\"r|gz\") as archive:\n+    with\
        \ open_checkpoint_tar(archive_path) as archive:\n         for member in archive:\n             name = member.name\n             if name not in limits:\n@@\
        \ -940,7 +989,7 @@\n         expected[APK_PATH] = apk\n \n     verified = set()\n-    with tarfile.open(archive_path, mode=\"r|gz\") as archive:\n+    with\
        \ open_checkpoint_tar(archive_path) as archive:\n         for member in archive:\n             name = member.name\n             if production and is_android_packaging(archive_relative(name)):\n\
        @@ -1055,7 +1104,7 @@\n     hardlinks = {}\n     unpacked_bytes = 0\n     gn_dependencies = None\n-    with tarfile.open(archive_path, mode=\"r|gz\") as archive:\n\
        +    with open_checkpoint_tar(archive_path) as archive:\n         for member in archive:\n             relative = archive_relative(member.name)\n        \
        \     name = relative.as_posix()\nR28_INLINE_PATCH\npatch --fuzz=0 -p1 < \"$RUNNER_TEMP/dual-reader.patch\"\ncat > \"$RUNNER_TEMP/inventory-r26.py\" <<'R28_INLINE_API'\n\
        \"\"\"Read GitHub metadata just before save, confirm the receipt and original inventory.\"\"\"\nimport hashlib\nimport json\nimport os\nimport subprocess\n\
        import sys\nimport time\n\nBASE_REF = \"refs/heads/bare-coexist-v2.0.4\"\nGZIP = \"bare-coexist-204-44477110657-1-checkpoint-production\"\nPARENT = \"bare-coexist-204-45285202990-1-checkpoint-production-s2\"\
        \nTEST = \"bare-trial-28-r26-zstd9-native-v1\"\nLIMIT = 10 * 1024**3\nMARGIN = 128 * 1024**2\n\ndef get(path):\n    url = \"/repos/Areal-U/bare-runner-disk-probe/actions/\"\
        \ + path\n    return json.loads(subprocess.check_output([\"gh\", \"api\", url], timeout=35))\n\ndef rows():\n    all_rows = []\n    for page in range(1, 11):\n\
        \        response = get(f\"caches?per_page=100&page={page}\")\n        batch = response[\"actions_caches\"]\n        all_rows.extend(batch)\n        if len(batch)\
        \ < 100:\n            if len(all_rows) != response[\"total_count\"] or len({e[\"id\"] for e in all_rows}) != len(all_rows):\n                raise SystemExit(\"\
        Cache inventory changed during pagination\")\n            return all_rows\n    raise SystemExit(\"Cannot bound the repository cache inventory\")\n\ndef snapshot():\n\
        \    entries = rows()\n    for key, expected_id, size in [(GZIP, 10780907241, 2318534667), (PARENT, 11016400308, 2742685925)]:\n        pinned = [v for v\
        \ in entries if v[\"key\"] == key]\n        if len(pinned) != 1 or (pinned[0][\"id\"], pinned[0][\"ref\"], pinned[0][\"size_in_bytes\"]) != (expected_id,\
        \ BASE_REF, size):\n            raise SystemExit(\"Protected original/active parent did not match its confirmed receipt\")\n    present = [v for v in entries\
        \ if v[\"key\"] == TEST]\n    if len(present) > 1 or any(v[\"ref\"] != os.environ[\"GITHUB_REF\"] or v[\"size_in_bytes\"] <= 0 for v in present):\n      \
        \  raise SystemExit(\"A conflicting test cache already exists; reconcile before writing\")\n    baseline = sorted((e[\"id\"], e[\"key\"], e[\"ref\"], e[\"\
        version\"], e[\"size_in_bytes\"]) for e in entries if e[\"key\"] != TEST)\n    digest = hashlib.sha256(json.dumps(baseline, separators=(\",\",\":\")).encode()).hexdigest()\n\
        \    return entries, present, digest\n\ndef out(k, v):\n    print(f\"{k}={v}\")\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\") as f:\n        print(f\"\
        {k}={v}\", file=f)\n\nmode = sys.argv[1]\nif mode == \"guard\":\n    entries, present, digest = snapshot()\n    if not present:\n        for state in (\"\
        in_progress\", \"queued\", \"waiting\", \"pending\", \"requested\"):\n            response = get(f\"runs?status={state}&per_page=100\")\n            if response[\"\
        total_count\"] != len(response[\"workflow_runs\"]) or any(str(v[\"id\"]) != os.environ[\"GITHUB_RUN_ID\"] for v in response[\"workflow_runs\"]):\n       \
        \         raise SystemExit(\"Concurrent repository run detected; capacity cannot be reserved\")\n        used = max(get(\"cache/usage\")[\"active_caches_size_in_bytes\"\
        ], sum(e[\"size_in_bytes\"] for e in entries))\n        want = int(os.environ[\"MEASURED\"])\n        if not 0 < want < 2_000_000_000 or used + want + MARGIN\
        \ > LIMIT:\n            raise SystemExit(f\"Insufficient space to retain all caches: used={used}, measured={want}, margin={MARGIN}\")\n        print(f\"Occupied\
        \ {used} bytes, candidate {want} bytes, reserve {MARGIN} bytes\")\n    out(\"baseline\", digest)\n    out(\"existing\", \"true\" if present else \"false\"\
        )\nelif mode == \"receipt\":\n    for attempt in range(8):\n        entries, present, digest = snapshot()\n        if digest != os.environ[\"BASELINE\"]:\n\
        \            raise SystemExit(\"An existing cache changed; retention is unconfirmed\")\n        if present:\n            stored = present[0]\n           \
        \ if not 0 < stored[\"size_in_bytes\"] <= int(os.environ[\"MEASURED\"]) + 8*1024**2:\n                raise SystemExit(\"Test cache size is inconsistent with\
        \ the measured outer package\")\n            out(\"cache_id\", stored[\"id\"])\n            out(\"outer_bytes\", stored[\"size_in_bytes\"])\n            break\n\
        \        if attempt < 7:\n            time.sleep(4)\n    else:\n        raise SystemExit(\"No exact test-cache receipt\")\nelse:\n    raise SystemExit(\"\
        Unknown metadata check\")\nR28_INLINE_API\n"
    - name: Confirm the existing cache ID, size and all protected generations before reading
      env: &id001
        GH_TOKEN: ${{ github.token }}
        MEASURED: '1497106379'
        BASELINE: 7025b06245fe48c472a026bb7ff25beb741dbf4f2a22542437a21e0500dc6507
        WANT_ID: '11017220077'
        WANT_SIZE: '1495649356'
      run: |
        set -euo pipefail
        receipt=$(python3 -I "$RUNNER_TEMP/inventory-r26.py" receipt)
        echo "$receipt"
        grep -Fx "cache_id=$WANT_ID" <<< "$receipt"
        grep -Fx "outer_bytes=$WANT_SIZE" <<< "$receipt"
    - name: Read the zstd test cache on a clean runner
      id: cache
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      timeout-minutes: 15
      with:
        path: ${{ runner.temp }}/bare-zstd-trial/checkpoint.tar.zst
        key: bare-trial-28-r26-zstd9-native-v1
        fail-on-cache-miss: true
    - name: Check exact cache identity, tar digest, object hashes and input manifest
      timeout-minutes: 30
      env:
        MATCHED: ${{ steps.cache.outputs.cache-matched-key }}
        HIT: ${{ steps.cache.outputs.cache-hit }}
        ZSTD_SHA: 990eef8d03413749ee6ff30c425731f835c8df48987d1a31bab84e6f6177584e
        ZSTD_BYTES: '1497106379'
      run: |
        set -euo pipefail
        [[ $HIT == true && $MATCHED == bare-trial-28-r26-zstd9-native-v1 ]]
        archive="$RUNNER_TEMP/bare-zstd-trial/checkpoint.tar.zst"
        [[ -f $archive && ! -L $archive && $(stat -c %s "$archive") == "$ZSTD_BYTES" ]]
        echo "$ZSTD_SHA  $archive" | sha256sum --check --strict
        test "$(zstd -qdc -M128MB -- "$archive" | sha256sum | cut -d' ' -f1)" = "$RAW_SHA"
        reader="$RUNNER_TEMP/bare-zstd-tools/checkpoint.py"
        python3 -I "$reader" validate-archive "$archive" --production
        python3 -I "$reader" verify-continuation "$archive" --production --expected-identity "$IDENTITY" --ci-revision "$SOURCE_REV"
        python3 -I "$reader" inspect-input-paths "$archive" --production
    - name: Verify producer provenance, Ninja reuse and fresh compile progress
      timeout-minutes: 145
      env:
        ZSTD_SHA: 990eef8d03413749ee6ff30c425731f835c8df48987d1a31bab84e6f6177584e
      run: |
        set -- "$RUNNER_TEMP/bare-zstd-trial/checkpoint.tar.zst"
        #!/usr/bin/env bash
