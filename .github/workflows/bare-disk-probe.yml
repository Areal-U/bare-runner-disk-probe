name: Bare runner disk probe
run-name: ${{ inputs.trial && inputs.trial != 'disk' && format('Bare next-build trial {0} {1}', inputs.trial, github.sha) || 'Bare runner disk probe' }}

on:
  workflow_dispatch:
    inputs:
      trial:
        description: Optional bounded next-build comparison on the dedicated test branch
        type: choice
        default: disk
        options: [disk, source-v8, source-chromium, source-android, split, receiver]
      expected_sha:
        description: Reviewed test branch SHA from next_build/trials.py
        type: string
      recovery_clear:
        description: Prior independent collection has no pending GitHub work
        type: boolean
        default: false
      storage_ceiling:
        description: Pre-dispatch total from next_build/trials.py
        type: string
      storage_until:
        description: Pre-dispatch expiration epoch
        type: string
      reclaim:
        description: Measure again after removing listed unused tools from the temporary runner
        type: boolean
        default: false

permissions: {}

jobs:
  measure:
    if: ${{ (inputs.trial == 'disk' || inputs.trial == '') && toJSON(github.event.repository.private) == 'false' && toJSON(github.event.repository.fork) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RECLAIM: ${{ inputs.reclaim }}
    steps:
      - name: Measure runner disk and optional reclamation
        shell: bash
        run: |
          set -euo pipefail

          if [[ ${GITHUB_EVENT_NAME:-} != workflow_dispatch ||
                ${RUNNER_ENVIRONMENT:-} != github-hosted ||
                ${RUNNER_ARCH:-} != X64 ]]; then
            echo 'Expected a manually started GitHub-hosted x64 runner.' >&2
            exit 1
          fi

          . /etc/os-release
          if [[ $ID != ubuntu || $VERSION_ID != 24.04 ]]; then
            echo 'Expected Ubuntu 24.04.' >&2
            exit 1
          fi

          docker_root=$(sudo -n docker info --format '{{.DockerRootDir}}')
          if [[ $docker_root != /* ]] || ! sudo -n test -d "$docker_root"; then
            echo 'Cannot locate the Docker data directory.' >&2
            exit 1
          fi

          report_disk() {
            for path in / /mnt "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$docker_root"; do
              if sudo -n test -d "$path"; then
                printf '\n%s\n' "$path"
                sudo -n df -B1 --output=source,fstype,size,used,avail,itotal,iavail,target -- "$path"
              fi
            done
          }

          printf 'Image: %s\n' "${ImageVersion:-unknown}"
          lsblk --bytes --output NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS
          echo 'Before reclaim'
          report_disk

          # These preinstalled toolchains are outside the official Bare build container.
          tool_dirs=(
            /usr/local/lib/android
            /usr/local/share/boost
            /usr/share/dotnet
            /usr/share/swift
            /usr/local/.ghcup
            /opt/ghc
            /usr/lib/google-cloud-sdk
          )
          echo 'Allocated bytes in optional tool directories'
          for path in "${tool_dirs[@]}"; do
            if [[ -d $path && $(realpath -- "$path") == "$path" ]] && ! mountpoint -q -- "$path"; then
              sudo -n du -s -x -B1 -- "$path"
              if [[ $RECLAIM == true ]]; then
                sudo -n rm -rf --one-file-system -- "$path"
              fi
            fi
          done

          if [[ $RECLAIM == true ]]; then
            echo 'After reclaim'
            report_disk
          fi

  trial-admission:
    if: ${{ inputs.trial != 'disk' && inputs.trial != '' && github.actor == 'Areal-U' && github.event.sender.id == 292261483 && github.repository == 'Areal-U/bare-runner-disk-probe' && github.ref == 'refs/heads/bare-next-build-prep-20261125' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ceiling: ${{ steps.admit.outputs.ceiling }}
      until: ${{ steps.admit.outputs.until }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_TRIAL: ${{ inputs.trial }}
          NEXT_EXPECTED_SHA: ${{ inputs.expected_sha }}
          NEXT_RECOVERY_CLEAR: ${{ inputs.recovery_clear }}
          NEXT_CEILING: ${{ inputs.storage_ceiling }}
          NEXT_UNTIL: ${{ inputs.storage_until }}
          R28_RELAY_BYTE_CEILING: ${{ vars.R28_RELAY_BYTE_CEILING }}
        run: python3 next_build/trials.py "$NEXT_TRIAL" --inside-run

  source-comparison:
    needs: trial-admission
    if: ${{ inputs.trial == 'source-v8' || inputs.trial == 'source-chromium' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/next-source-compare.yml
    with:
      scope: ${{ inputs.trial == 'source-v8' && 'v8' || 'chromium' }}
      reuses: 2
      storage_ceiling: ${{ needs.trial-admission.outputs.ceiling }}
      storage_until: ${{ needs.trial-admission.outputs.until }}

  split-comparison:
    needs: trial-admission
    if: ${{ inputs.trial == 'split' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/bare-next-split.yml
    with:
      storage_ceiling: ${{ needs.trial-admission.outputs.ceiling }}
      storage_until: ${{ needs.trial-admission.outputs.until }}

  receiver-comparison:
    needs: trial-admission
    if: ${{ inputs.trial == 'receiver' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/bare-next-receiver-trial.yml
    with:
      storage_ceiling: ${{ needs.trial-admission.outputs.ceiling }}
      storage_until: ${{ needs.trial-admission.outputs.until }}

  android-source-import:
    needs: trial-admission
    if: ${{ inputs.trial == 'source-android' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/next-android-source-import.yml
