name: Restore a two-packet checkpoint on fresh hosted runners
'on':
  workflow_call:
    inputs:
      owner_alias_sha:
        required: true
        type: string
permissions: {}
concurrency:
  group: bare-personal-209-production
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      genesis: ${{ steps.lock.outputs.genesis }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: lock
      env:
        EXPECTED_HEAD: ${{ github.event.inputs.expected_head }}
      run: |
        set -euo pipefail
        [[ $GITHUB_REPOSITORY == Areal-U/bare-runner-disk-probe && $GITHUB_ACTOR == Areal-U ]]
        [[ $GITHUB_REF == refs/heads/bare-coexist-v2.0.9 && $GITHUB_EVENT_NAME == workflow_dispatch ]]
        [[ $RUNNER_ENVIRONMENT == github-hosted && $GITHUB_RUN_ATTEMPT == 1 ]]
        [[ $EXPECTED_HEAD =~ ^[0-9a-f]{40}$ && $GITHUB_SHA == "$EXPECTED_HEAD" ]]
        echo "genesis=$(sha256sum preflight209/upstream-lock.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
  trial:
    needs: fixture
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/bare-personal209-slot.yml
    with:
      relay_trial: true
      owner_alias_sha: ${{ inputs.owner_alias_sha }}
      ticket_id: ''
      ticket_sha: ''
      genesis: ${{ needs.fixture.outputs.genesis }}
      ordinal: '1'
      parent: ${{ needs.fixture.outputs.genesis }}
      parent_identity: ${{ needs.fixture.outputs.genesis }}
      origin: ''
      manifest: ''
      manifest_sha: ''
  restore-trial:
    needs: [fixture, trial]
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/bare-personal209-slot.yml
    with:
      relay_trial: true
      owner_alias_sha: ${{ inputs.owner_alias_sha }}
      ticket_id: ''
      ticket_sha: ''
      genesis: ${{ needs.fixture.outputs.genesis }}
      ordinal: '2'
      parent: ${{ needs.trial.outputs.parent }}
      parent_identity: ${{ needs.trial.outputs.parent_identity }}
      origin: ''
      manifest: ${{ needs.trial.outputs.manifest }}
      manifest_sha: ${{ needs.trial.outputs.manifest_sha }}
  verify:
    needs: [trial, restore-trial]
    if: ${{ !cancelled() }}
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
    - name: Require the original certificate and separate read-only restore certificate
      env:
        SENT: ${{ needs.trial.result }}
        RESTORED: ${{ needs.restore-trial.result }}
        FIRST: ${{ needs.trial.outputs.kind }}
        NEXT: ${{ needs.restore-trial.outputs.kind }}
        MID: ${{ needs.trial.outputs.manifest }}
        CONFIRMED_MID: ${{ needs.restore-trial.outputs.manifest }}
        SHA: ${{ needs.trial.outputs.manifest_sha }}
        CONFIRMED_SHA: ${{ needs.restore-trial.outputs.manifest_sha }}
        ARCHIVE: ${{ needs.trial.outputs.parent }}
        CONFIRMED_ARCHIVE: ${{ needs.restore-trial.outputs.parent }}
        IDENTITY: ${{ needs.trial.outputs.parent_identity }}
        CONFIRMED_IDENTITY: ${{ needs.restore-trial.outputs.parent_identity }}
      run: |
        set -euo pipefail
        [[ $SENT == success && $RESTORED == success && $FIRST == checkpoint && $NEXT == trial-restored ]]
        [[ $MID =~ ^[1-9][0-9]*$ && $MID == "$CONFIRMED_MID" ]]
        [[ $SHA =~ ^[0-9a-f]{64}$ && $SHA == "$CONFIRMED_SHA" ]]
        [[ $ARCHIVE =~ ^[0-9a-f]{64}$ && $ARCHIVE == "$CONFIRMED_ARCHIVE" ]]
        [[ $IDENTITY =~ ^[0-9a-f]{64}$ && $IDENTITY == "$CONFIRMED_IDENTITY" ]]
        echo "R209_PRIVATE_RELAY_TRIAL_VERIFIED head=$GITHUB_SHA run=$GITHUB_RUN_ID manifest=$MID sha=$SHA archive=$ARCHIVE identity=$IDENTITY"
