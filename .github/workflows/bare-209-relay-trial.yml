name: Restore a two-packet checkpoint on fresh hosted runners
'on':
  workflow_call:
    inputs:
      owner_alias_sha:
        required: true
        type: string
permissions: {}
concurrency:
  group: bare-personal-209-production
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      genesis: ${{ steps.lock.outputs.genesis }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - id: lock
      env:
        EXPECTED_HEAD: ${{ github.event.inputs.expected_head }}
      run: |
        set -euo pipefail
        [[ $GITHUB_REPOSITORY == Areal-U/bare-runner-disk-probe && $GITHUB_ACTOR == Areal-U ]]
        [[ $GITHUB_REF == refs/heads/bare-coexist-v2.0.9 && $GITHUB_EVENT_NAME == workflow_dispatch ]]
        [[ $RUNNER_ENVIRONMENT == github-hosted && $GITHUB_RUN_ATTEMPT == 1 ]]
        [[ $EXPECTED_HEAD =~ ^[0-9a-f]{40}$ && $GITHUB_SHA == "$EXPECTED_HEAD" ]]
        echo "genesis=$(sha256sum preflight209/upstream-lock.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
  trial:
    needs: fixture
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/bare-personal209-slot.yml
    with:
      relay_trial: true
      owner_alias_sha: ${{ inputs.owner_alias_sha }}
      ticket_id: ''
      ticket_sha: ''
      genesis: ${{ needs.fixture.outputs.genesis }}
      ordinal: '1'
      parent: ${{ needs.fixture.outputs.genesis }}
      parent_identity: ${{ needs.fixture.outputs.genesis }}
      origin: ''
      manifest: ''
      manifest_sha: ''
  restore-trial:
    needs: [fixture, trial]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      R209_RELAY_TRIAL: 'true'
      BARE_GENERATION: 2.0.9
      R28_HEAD_SHA: ${{ github.sha }}
      R209_GENESIS: ${{ needs.fixture.outputs.genesis }}
      R28_PARENT_SHA: ${{ needs.fixture.outputs.genesis }}
      R28_PARENT_IDENTITY: ${{ needs.fixture.outputs.genesis }}
      R28_SLOT: '1'
      R209_DRAFT_ALIAS_SHA: ${{ inputs.owner_alias_sha }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Open the original private Draft client and restore the exact certified bytes
      env:
        GH_TOKEN: ${{ github.token }}
        KIND: ${{ needs.trial.outputs.kind }}
        MANIFEST: ${{ needs.trial.outputs.manifest }}
        MANIFEST_SHA: ${{ needs.trial.outputs.manifest_sha }}
        PARENT: ${{ needs.trial.outputs.parent }}
        IDENTITY: ${{ needs.trial.outputs.parent_identity }}
      run: |
        set -euo pipefail
        test "$KIND" = checkpoint
        python3 preflight28/transport/prepare.py tools
        python3 preflight209/relay_trial.py restore
