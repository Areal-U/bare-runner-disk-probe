          tr '\r' '\n' < /exchange/checkpoint/production-noop.log > /exchange/checkpoint/production-noop.txt
          grep -Fx 'ninja: no work to do.' /exchange/checkpoint/production-noop.txt
          summary=$(grep -F 'Build Succeeded:' /exchange/checkpoint/production-noop.txt | tail -n 1)
          [[ $summary == *'Build Succeeded: 0 steps -'* ]]
          python3 /exchange/checkpoint.py verify-reuse-markers "$record" > /exchange/checkpoint/production-after.json
          cmp /exchange/checkpoint/production-before.json /exchange/checkpoint/production-after.json
          printf 'Verified production reuse: %s\n' "$summary"
        elif [[ $PROBE_MODE == checkpoint-scale || $PROBE_MODE == checkpoint-large ]]; then
          for pass in before after; do
            python3 - "$pass" <<'PYTHON'
        import json, sys
        from pathlib import Path, PurePosixPath
        sys.path.insert(0, '/exchange')
        from checkpoint import object_metadata, safe_relative

        phase = sys.argv[1]
        record = json.loads(Path('out/Bare/checkpoint-continuation.json').read_text())
        root = Path.cwd()
        targets = []
        observed = []
        for output in record['outputs']:
            path = safe_relative(output['path'])
            target = path.relative_to(PurePosixPath('out/Bare')).as_posix()
            if not target.endswith('.o') or any(character.isspace() for character in target):
                raise SystemExit('The pinned scale predecessor has an unexpected evidence target.')
            current = object_metadata(root / path, root)
            if any(current[field] != output[field] for field in ('size', 'sha256')):
                raise SystemExit(f'Predecessor output differs during {phase}: {target}')
            targets.append(target)
            observed.append(current)
        if len(targets) != 3 or len(set(targets)) != 3:
            raise SystemExit('Expected three distinct pinned continuation outputs.')
        snapshot = Path('/exchange/checkpoint/scale-objects-before.json')
        if phase == 'before':
            Path('/exchange/checkpoint/scale-targets.txt').write_text('\n'.join(targets) + '\n')
            snapshot.write_text(json.dumps(observed) + '\n')
        else:
            if json.loads(snapshot.read_text()) != observed:
                raise SystemExit('Predecessor output metadata changed during the no-op.')
            print('Three predecessor objects match their before-build hashes and metadata.')
        PYTHON
            if [[ $pass == before ]]; then
              mapfile -t scale_targets < /exchange/checkpoint/scale-targets.txt
              autoninja -C out/Bare -j 2 -v "${scale_targets[@]}" 2>&1 | tee /exchange/checkpoint/scale-objects-noop.log
              tr '\r' '\n' < /exchange/checkpoint/scale-objects-noop.log > /exchange/checkpoint/scale-objects-noop.txt
              if ! grep -Fx 'ninja: no work to do.' /exchange/checkpoint/scale-objects-noop.txt; then
                echo 'The expected Ninja no-op marker was missing.' >&2
                exit 1
              fi
              summary=$(grep -F 'Build Succeeded:' /exchange/checkpoint/scale-objects-noop.txt | tail -n 1) || {
                echo 'The final Siso step count was missing.' >&2
                exit 1
              }
              if [[ $summary != *'Build Succeeded: 0 steps -'* ]]; then
                printf 'Expected a zero-step Siso run; observed: %s\n' "$summary" >&2
                exit 1
              fi
              printf 'Verified Siso summary: %s\n' "$summary"
            fi
          done
        fi
        touch /exchange/checkpoint/reuse-verified
        CONTAINER
    - name: Run the real APK target within its time and output budgets
      id: trial
      if: ${{ startsWith(inputs.probe, 'checkpoint-') }}
      timeout-minutes: ${{ inputs.probe == 'checkpoint-production' && 188 || inputs.probe == 'checkpoint-large' && 95 || inputs.probe == 'checkpoint-scale' && 65 || 12 }}
      env:
        APK_OUTPUT_GIB: ${{ inputs.apk_output_gib }}
        APK_JOBS: ${{ inputs.apk_jobs }}
      run: |
        cd "$RUNNER_TEMP/bare-official"
        # The clock starts before preparation and restore, not at compiler startup.
        elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/bare-probe-start") ))
        latest_start=55
        [[ $PROBE_MODE != checkpoint-large ]] || latest_start=60
        [[ $PROBE_MODE != checkpoint-production ]] || latest_start=65
        if (( elapsed > latest_start * 60 )); then
          echo 'Not enough time reserved for stop, hashing, packing, upload and diagnostics.' >&2
          exit 1
        fi
        phase=seed
        [[ $PROBE_MODE == checkpoint-seed ]] || phase=restore
        trial_timeout=9m
        kill_after=2m
        compile_seconds=0
        if [[ $PROBE_MODE == checkpoint-scale ]]; then
          trial_timeout=63m
          kill_after=1m
        elif [[ $PROBE_MODE == checkpoint-large ]]; then
          trial_timeout=93m
          kill_after=1m
        elif [[ $PROBE_MODE == checkpoint-production ]]; then
          # Allow time for quiescence, validation, packing, transfer, and the hard job deadline.
          compile_seconds=$(( (350 - 80 - 17 - 8) * 60 - elapsed ))
          (( compile_seconds > 0 ))
          if (( compile_seconds > 10800 )); then
            compile_seconds=10800
          fi
          trial_timeout="$((compile_seconds + 300))s"
          kill_after=1m
          df -B1 "$RUNNER_TEMP" "${TMPDIR:-/tmp}"
          df -Pi "$RUNNER_TEMP" "${TMPDIR:-/tmp}"
          for path in "$RUNNER_TEMP" "${TMPDIR:-/tmp}"; do
            free=$(df -B1 --output=avail "$path" | awk 'NR == 2 { print $1 }')
            (( free >= 20 * 1024**3 ))
          done
        fi
        echo "phase=$phase" >> "$GITHUB_OUTPUT"
        docker compose exec -T -e DEPOT_TOOLS_UPDATE=0 -e DEPOT_TOOLS_METRICS=0 \
          -e "TRIAL_PHASE=$phase" -e "PROBE_MODE=$PROBE_MODE" -e "COMPILE_SECONDS=$compile_seconds" \
          -e "APK_OUTPUT_GIB=$APK_OUTPUT_GIB" -e "APK_JOBS=$APK_JOBS" chromium-builder \
          timeout --kill-after="$kill_after" "$trial_timeout" bash -seu <<'CONTAINER'
        set -o pipefail
        cd /work/chromium/src
        if [[ $TRIAL_PHASE == restore ]]; then
          test -f /exchange/checkpoint/reuse-verified
        fi
        if [[ $TRIAL_PHASE == seed ]]; then
          autoninja -C out/Bare -j 2 -v base/third_party/cityhash:cityhash
          object=out/Bare/obj/base/third_party/cityhash/cityhash/city.o
          test -s "$object"
          python3 /exchange/checkpoint.py object-info "$object" out/Bare/checkpoint-object.json
        fi
        args=(--seconds 180 --max-output-bytes 1879048192 --min-free-bytes 10000000000)
        if [[ $PROBE_MODE == checkpoint-scale ]]; then
          args=(--scale --seconds 3600 --max-output-bytes 2684354560 --max-output-entries 140000 --min-free-bytes 21474836480)
        elif [[ $PROBE_MODE == checkpoint-large ]]; then
          args=(--large --seconds 5400 --max-output-bytes 6442450944 --max-output-entries 300000 --min-free-bytes 21474836480)
        elif [[ $PROBE_MODE == checkpoint-production ]]; then
          args=(--production --seconds "$COMPILE_SECONDS" --jobs "$APK_JOBS" --max-output-bytes "$((APK_OUTPUT_GIB * 1024**3))" --max-output-entries 525000 --min-free-bytes 21474836480)
        elif [[ $TRIAL_PHASE == restore ]]; then
          args+=(--previous-result out/Bare/checkpoint-trial-seed.json)
        fi
        python3 /exchange/build_trial.py --phase "$TRIAL_PHASE" \
          --result "/exchange/checkpoint/trial-$TRIAL_PHASE.json" \
          --log "/exchange/checkpoint/trial-$TRIAL_PHASE.log" \
          "${args[@]}"
        CONTAINER
    - name: Stop every build writer before making the archive
      id: quiesce
      if: ${{ always() && startsWith(inputs.probe, 'checkpoint-') && steps.trial.outputs.phase != '' }}
      timeout-minutes: 3
      run: |
        cd "$RUNNER_TEMP/bare-official"
        container=chromium-android-builder
        volume=$(docker inspect "$container" --format '{{range .Mounts}}{{if eq .Destination "/work"}}{{.Name}}{{end}}{{end}}')
        [[ -n $volume ]]
        mapfile -t users < <(docker ps --filter "volume=$volume" --format '{{.Names}}')
        [[ ${#users[@]} == 1 && ${users[0]} == "$container" ]]
        if [[ $PROBE_MODE == checkpoint-scale || $PROBE_MODE == checkpoint-large || $PROBE_MODE == checkpoint-production ]]; then
          timeout --kill-after=2s 10s docker compose exec -T chromium-builder bash -c '
            df -B1 /work /exchange
            df -Pi /work /exchange
            for name in memory.max memory.peak memory.swap.max memory.events; do
              path=/sys/fs/cgroup/$name
              if test -r "$path"; then
                printf "%s:\n" "$name"
                cat "$path"
              fi
            done
          ' || echo '::warning::Could not collect pre-stop resource counters.'
        fi
        docker stop --time 20 "$container"
        [[ $(docker inspect "$container" --format '{{.State.Running}}') == false ]]
        # This pinned container starts an idle bash, never the build command.
        docker start "$container"
        docker compose exec -T chromium-builder true
        echo 'quiescent=true' >> "$GITHUB_OUTPUT"
    - name: Verify the completed APK and encrypt it for private recovery
      id: apk_seal
      if: ${{ always() && inputs.probe == 'checkpoint-production' && steps.quiesce.outputs.quiescent == 'true' }}
      timeout-minutes: 12
      env:
        APK_RECIPIENT: ${{ inputs.apk_recipient }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/bare-official"
        terminal=$(docker compose exec -T chromium-builder python3 - <<'PYTHON'
        import json
        from pathlib import Path
        report = Path('/exchange/checkpoint/trial-restore.json')
        data = json.loads(report.read_text(encoding='utf-8')) if report.is_file() else {}
        print('true' if data.get('reason') == 'completed' else 'false')
        PYTHON
        )
        if [[ $terminal != true ]]; then
          exit 0
        fi
        echo 'terminal=true' >> "$GITHUB_OUTPUT"
        umask 077
        delivery=$(mktemp -d "$RUNNER_TEMP/bare-apk-seal.XXXXXXXX")
        trap 'rm -rf -- "$delivery"' EXIT
        final_dir="$RUNNER_TEMP/bare-apk-delivery"
        [[ ! -e $final_dir && ! -L $final_dir ]]
        mkdir -m 700 "$final_dir"
        [[ $APK_RECIPIENT =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]
        docker compose exec -T -e "BARE_REV=$BARE_REV" -e "CHROMIUM_REV=$CHROMIUM_REV" \
          -e "CI_REVISION=$GITHUB_SHA" chromium-builder bash -seu <<'CONTAINER' \
          | age -r "$APK_RECIPIENT" -o "$delivery/Bare-2.0.0-beta.6-arm64-v8a.tar.age"
        set -o pipefail
        cd /work/chromium/src
        temp=$(mktemp -d)
        trap 'rm -rf -- "$temp"' EXIT
        apk=out/Bare/apks/ChromePublic.apk
        sdk=third_party/android_sdk/public/build-tools/37.0.0
        [[ -x $sdk/aapt2 && -x $sdk/apksigner && -x third_party/jdk/current/bin/java ]]
        export JAVA_HOME="$PWD/third_party/jdk/current"
        export PATH="$JAVA_HOME/bin:$PATH"
        "$sdk/aapt2" dump badging "$apk" > "$temp/badging.txt" 2>&1 || {
          echo 'Android manifest inspection failed.' >&2
          exit 1
        }
        "$sdk/apksigner" verify --verbose --print-certs "$apk" > "$temp/signing.txt" 2>&1 || {
          echo 'Android APK signature verification failed.' >&2
          exit 1
        }
        python3 - "$apk" "$temp" <<'PYTHON'
        import hashlib
        import json
        import os
        import re
        import stat
        import sys
        import zipfile
        from pathlib import Path

        apk, temp = map(Path, sys.argv[1:])
        with Path('/exchange/checkpoint/trial-restore.json').open(encoding='utf-8') as stream:
            report = json.load(stream)
        observed = report.get('apk')
        if not (report.get('reason') == 'completed' and report.get('returncode') == 0 and report.get('artifact_ready') is True
                and report.get('forced_kill') is False and report.get('failed_step_count') == 0
                and isinstance(observed, dict) and observed.get('path') == apk.as_posix()):
            raise SystemExit('The exact APK target has no clean successful result.')
        info = apk.lstat()
        if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 450 * 1024**2:
            raise SystemExit('Unexpected APK file type or size.')
        hasher = hashlib.sha256()
        with apk.open('rb') as stream:
            for chunk in iter(lambda: stream.read(4 * 1024 * 1024), b''):
                hasher.update(chunk)
        digest = hasher.hexdigest()
        if info.st_size != observed.get('size') or digest != observed.get('sha256'):
            raise SystemExit('APK changed after the build completed.')

        expected_package = 'org.barebrowser'
        expected_version = '2.0.0-beta.6'
        expected_code = '802000065'
        expected_crx = 'd688ed3f0262ec4f8bdcd4c8f65987c5444c560aeb387a9e02aca1facdfa7046'
        expected_cert = '32a2fc74d731105859e5a85df16d95f102d85b22099b8064c5d8915c61dad1e0'
        badging = (temp / 'badging.txt').read_text(encoding='utf-8')
        package_line = next((line for line in badging.splitlines() if line.startswith('package: ')), '')
        fields = dict(re.findall(r"\b([A-Za-z][A-Za-z0-9]*)='([^']*)'", package_line))
        if (fields.get('name'), fields.get('versionName'), fields.get('versionCode')) != (
            expected_package, expected_version, expected_code,
        ):
            raise SystemExit('Unexpected Android package name or version.')
        architectures = [line.strip() for line in badging.splitlines() if line.startswith('native-code:')]
        if architectures != ["native-code: 'arm64-v8a'"]:
            raise SystemExit('APK does not report exactly the ARM64 ABI.')

        signing = (temp / 'signing.txt').read_text(encoding='utf-8')
        signer_pattern = r'^(?:Signer #\d+ certificate|V\d+(?:\.\d+)? Signer(?: #\d+)?: certificate) SHA-256 digest: ([0-9a-f]{64})\s*$'
        signers = re.findall(signer_pattern, signing, flags=re.IGNORECASE | re.MULTILINE)
        if ({signer.lower() for signer in signers} != {expected_cert}
                or not re.search(r'^Number of signers: 1\s*$', signing, re.MULTILINE)):
            raise SystemExit('APK signing certificate does not match pinned Chromium build key.')

        crx = 'assets/bare/ublock_origin.crx'
        with zipfile.ZipFile(apk) as archive:
            members = archive.namelist()
            if len(members) != len(set(members)):
                raise SystemExit('APK ZIP contains a duplicate member.')
            if archive.testzip() is not None:
                raise SystemExit('APK ZIP integrity verification failed.')
            if crx not in members or hashlib.sha256(archive.read(crx)).hexdigest() != expected_crx:
                raise SystemExit('Pinned embedded uBlock Origin did not match.')
            core = 'lib/arm64-v8a/libchrome.so'
            if core not in members:
                raise SystemExit('Missing expected ARM64 Chromium library.')
            with archive.open(core) as library:
                header = library.read(20)
            if header[:6] != b'\x7fELF\x02\x01' or header[18:20] != b'\xb7\x00':
                raise SystemExit('Chromium library is not AArch64 ELF.')

        metadata = {
            'apk': 'ChromePublic.apk',
            'package': expected_package,
            'version_name': expected_version,
            'version_code': expected_code,
            'abi': 'arm64-v8a',
            'bytes': info.st_size,
            'sha256': digest,
            'signer_sha256': expected_cert,
            'embedded_ublock_origin_sha256': expected_crx,
            'bare_revision': os.environ['BARE_REV'],
            'chromium_revision': os.environ['CHROMIUM_REV'],
            'ci_revision': os.environ['CI_REVISION'],
        }
