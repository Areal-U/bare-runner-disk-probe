name: Bare ARM64 compile probe

on:
  workflow_dispatch:
    inputs:
      probe:
        description: Build target to test (APK mode leaves only logs)
        type: choice
        default: smoke
        options:
          - smoke
          - apk

permissions: {}

jobs:
  compile-probe:
    if: ${{ toJSON(github.event.repository.private) == 'false' && toJSON(github.event.repository.fork) == 'false' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    concurrency:
      group: bare-arm64-compile-probe
      cancel-in-progress: false
    env:
      BARE_REV: e776f77629bb915e0f3df63449f1f993cc1b0648
      CHROMIUM_REV: 2f9a11097447f226133bc1a31c787291a5eeab98
      DEPOT_REV: 96a7c1418eedaa6bea333a8941e8a0078681b4d0
      GIT_TERMINAL_PROMPT: '0'
    defaults:
      run:
        shell: bash
    steps:
      - name: Reclaim runner space and start the pinned Bare container
        timeout-minutes: 25
        run: |
          date +%s > "$RUNNER_TEMP/bare-probe-start"
          if [[ $GITHUB_EVENT_NAME != workflow_dispatch || $RUNNER_ENVIRONMENT != github-hosted || $RUNNER_ARCH != X64 ]]; then
            echo 'Expected a manually started GitHub-hosted x64 runner.' >&2
            exit 1
          fi
          . /etc/os-release
          [[ $ID == ubuntu && $VERSION_ID == 24.04 ]]
          docker_root=$(sudo -n docker info --format '{{.DockerRootDir}}')
          [[ $docker_root == /* ]]
          echo "Runner image: ${ImageVersion:-unknown}"
          sudo -n df -B1 -- "$docker_root"
          awk '/^(MemTotal|MemAvailable|SwapTotal):/' /proc/meminfo

          tool_dirs=(
            /usr/local/lib/android
            /usr/local/share/boost
            /usr/share/dotnet
            /usr/share/swift
            /usr/local/.ghcup
            /opt/ghc
            /usr/lib/google-cloud-sdk
          )
          for path in "${tool_dirs[@]}"; do
            if [[ -d $path && $(realpath -- "$path") == "$path" ]] && ! mountpoint -q -- "$path"; then
              sudo -n rm -rf --one-file-system -- "$path"
            fi
          done
          sudo -n df -B1 -- "$docker_root"

          mkdir "$RUNNER_TEMP/bare-official"
          cd "$RUNNER_TEMP/bare-official"
          git init -q
          git fetch --no-tags --depth=1 https://github.com/BareBrowser/bare-browser.git "$BARE_REV"
          git checkout --detach FETCH_HEAD
          [[ $(git rev-parse HEAD) == "$BARE_REV" ]]
          shopt -s nullglob
          patches=(patches/*.patch)
          [[ ${#patches[@]} == 296 ]]
          cp -R patches exchange/
          crx=third_party/ublock_origin/uBlockOrigin-1.75.0.crx
          printf '%s  %s\n' d688ed3f0262ec4f8bdcd4c8f65987c5444c560aeb387a9e02aca1facdfa7046 "$crx" | sha256sum --check --strict
          cp "$crx" exchange/ublock_origin.crx
          awk '/^```gn$/ { gn = 1; next } gn && /^```$/ { exit } gn { print }' docs/build-from-source.md > exchange/args.gn
          printf '%s  %s\n' 6fb681205a50bf9b20d6c1f18a4dd5708bcd99cfc258e577069442a8be2114ab exchange/args.gn | sha256sum --check --strict
          [[ $(python3 tools/version.py gn arm64) == "$(grep '^android_override_version_' exchange/args.gn)" ]]

          bash builder.sh build
          bash builder.sh start
          docker compose exec -T chromium-builder bash -seu <<'CONTAINER'
          id
          test -w /work
          df -B1 /work
          free_bytes=$(df -B1 --output=avail /work | awk 'NR == 2 { print $1 }')
          if (( free_bytes < 100000000000 )); then
            echo 'Stopping before checkout: the build volume has less than 100 GB free.' >&2
            exit 1
          fi
          CONTAINER

      - name: Fetch only the pinned Chromium revision and Android dependencies
        timeout-minutes: 220
        run: |
          cd "$RUNNER_TEMP/bare-official"
          docker compose exec -T -e "DEPOT_REV=$DEPOT_REV" -e "CHROMIUM_REV=$CHROMIUM_REV" -e GIT_TERMINAL_PROMPT=0 chromium-builder \
            timeout --kill-after=2m 210m bash -seu <<'CONTAINER'
          set -o pipefail
          export DEPOT_TOOLS_UPDATE=0 DEPOT_TOOLS_METRICS=0
          git init -q "$HOME/depot_tools"
          git -C "$HOME/depot_tools" fetch --no-tags --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$DEPOT_REV"
          git -C "$HOME/depot_tools" checkout --detach FETCH_HEAD
          [[ $(git -C "$HOME/depot_tools" rev-parse HEAD) == "$DEPOT_REV" ]]
          "$HOME/depot_tools/ensure_bootstrap"
          mkdir /work/chromium
          cd /work/chromium
          cat > .gclient <<'GCLIENT'
          solutions = [{
              'name': 'src',
              'url': 'https://chromium.googlesource.com/chromium/src.git',
              'deps_file': 'DEPS',
              'managed': False,
              'custom_deps': {},
              'custom_vars': {},
          }]
          target_os = ['linux', 'android']
          cache_dir = None
          GCLIENT
          gclient sync --no-history --nohooks --revision "src@$CHROMIUM_REV" --jobs 4
          [[ $(git -C src rev-parse HEAD) == "$CHROMIUM_REV" ]]
          df -B1 /work
          CONTAINER

      - name: Install build tools, apply Bare patches, and generate ARM64 build rules
        timeout-minutes: 65
        env:
          PROBE_MODE: ${{ inputs.probe }}
        run: |
          cd "$RUNNER_TEMP/bare-official"
          docker compose exec -T -e GIT_TERMINAL_PROMPT=0 -e "PROBE_MODE=$PROBE_MODE" chromium-builder \
            timeout --kill-after=2m 60m bash -seu <<'CONTAINER'
          set -o pipefail
          export DEPOT_TOOLS_UPDATE=0 DEPOT_TOOLS_METRICS=0
          cd /work/chromium/src
          echo 'Installing Chromium build dependencies'
          ./build/install-build-deps.sh --android --no-prompt
          echo 'Running Chromium checkout hooks'
          gclient runhooks
          if [[ $PROBE_MODE == apk ]]; then
            echo 'Fetching and validating the V8 builtin PGO profiles for the pinned revision'
            (
              cd /work/chromium
              python3 src/v8/tools/builtins-pgo/download_profiles.py download \
                --depot-tools src/third_party/depot_tools --check-v8-revision --quiet
              test -s src/v8/tools/builtins-pgo/profiles/x64.profile
            )
          fi
          df -B1 /work
          echo 'Applying the official Bare patch series'
          git apply --index /exchange/patches/*.patch
          mkdir -p chrome/browser/resources/bare out/Bare
          cp /exchange/ublock_origin.crx chrome/browser/resources/bare/ublock_origin.crx
          cp /exchange/args.gn out/Bare/args.gn
          echo 'Generating ARM64 build rules'
          gn gen out/Bare
          df -B1 /work
          CONTAINER

      - name: Compile a Chromium C++ target for Android ARM64
        if: ${{ inputs.probe == 'smoke' }}
        timeout-minutes: 18
        run: |
          cd "$RUNNER_TEMP/bare-official"
          docker compose exec -T -e GIT_TERMINAL_PROMPT=0 chromium-builder \
            timeout --kill-after=2m 15m bash -seu <<'CONTAINER'
          set -o pipefail
          export DEPOT_TOOLS_UPDATE=0 DEPOT_TOOLS_METRICS=0
          cd /work/chromium/src
          autoninja -C out/Bare -j 1 -v base/third_party/cityhash:cityhash
          object=$(find out/Bare/obj/base/third_party/cityhash -type f -name city.o -print -quit)
          [[ -n $object && -s $object ]]
          format=$(file -b "$object")
          printf 'Compiled %s: %s\n' "$object" "$format"
          if [[ $format == *LLVM*bitcode* ]]; then
            # ThinLTO can emit bitcode. Infer the architecture from this one object.
            relocatable=out/Bare/city-probe.elf
            third_party/llvm-build/Release+Asserts/bin/ld.lld -r --threads=1 -o "$relocatable" "$object"
            object=$relocatable
          fi
          header=$(LC_ALL=C readelf -h "$object")
          printf '%s\n' "$header"
          grep -Eq 'Machine:[[:space:]]+AArch64' <<< "$header"
          echo 'ARM64 compile probe passed.'
          CONTAINER

      - name: Build and verify the official ARM64 APK within runner limits
        if: ${{ inputs.probe == 'apk' }}
        timeout-minutes: 330
        run: |
          cd "$RUNNER_TEMP/bare-official"
          remaining=$(( 325 * 60 - ($(date +%s) - $(cat "$RUNNER_TEMP/bare-probe-start")) ))
          if (( remaining <= 0 )); then
            echo 'No time left for the APK target in the probe budget.' >&2
            exit 124
          fi
          docker compose exec -T -w /work/chromium/src -e "BARE_BUILD_SECONDS=$remaining" \
            -e DEPOT_TOOLS_UPDATE=0 -e DEPOT_TOOLS_METRICS=0 -e GIT_TERMINAL_PROMPT=0 \
            chromium-builder python3 -u - <<'PYTHON'
          import contextlib
          import os
          from pathlib import Path
          import shutil
          import signal
          import subprocess
          import time
          from zipfile import ZipFile

          cgroup = Path('/sys/fs/cgroup')
          disk_floor = 10_000_000_000
          sample_interval = 120
          start = time.monotonic()
          budget = int(os.environ['BARE_BUILD_SECONDS'])

          def fields(path, keys):
              try:
                  with path.open() as stream:
                      return {name.rstrip(':'): value for name, value, *_ in
                              (line.split() for line in stream) if name.rstrip(':') in keys}
              except OSError:
                  return {}

          def sample():
              free = shutil.disk_usage('/work').free
              host = fields(Path('/proc/meminfo'), {'MemAvailable', 'SwapFree'})
              memory = fields(cgroup / 'memory.stat', {'anon', 'file'})
              events = fields(cgroup / 'memory.events', {'oom', 'oom_kill'})
              print(f'sample elapsed_s={int(time.monotonic() - start)} work_free_bytes={free} '
                    f'host_kib={host} container_bytes={memory} memory_events={events}')
              return free, events.get('oom_kill')

          def stop(build):
              with contextlib.suppress(ProcessLookupError):
                  os.killpg(build.pid, signal.SIGINT)
              try:
                  build.wait(timeout=120)
              except subprocess.TimeoutExpired:
                  print('Build did not stop after SIGINT; sending SIGKILL to its process group.')
                  with contextlib.suppress(ProcessLookupError):
                      os.killpg(build.pid, signal.SIGKILL)
                  build.wait()

          print(f'Building chrome_public_apk with -j 2, budget={budget}s, disk floor={disk_floor} bytes.')
          free, oom_before = sample()
          if free < disk_floor:
              print('Probe stopped before compilation: free disk below guard threshold.')
              raise SystemExit(75)

          build = subprocess.Popen(['autoninja', '-C', 'out/Bare', '-j', '2', 'chrome_public_apk'],
                                   stdin=subprocess.DEVNULL, start_new_session=True)
          stop_code = 0
          try:
              while build.poll() is None:
                  remaining = budget - (time.monotonic() - start)
                  if remaining <= 0:
                      print('Probe stopping at the planned wall-time limit.')
                      stop_code = 124
                      break
                  try:
                      build.wait(timeout=min(sample_interval, remaining))
                  except subprocess.TimeoutExpired:
                      free, _ = sample()
                      if free < disk_floor:
                          print('Probe stopping at the free-disk guard threshold.')
                          stop_code = 75
                          break
          finally:
              if build.poll() is None:
                  stop(build)
              _, oom_after = sample()

          if oom_before is not None and oom_after is not None:
              print(f'Build-stage container oom_kill delta: {int(oom_after) - int(oom_before)}')
          print(f'Build process exit status: {build.returncode}')
          subprocess.run(['timeout', '60s', 'du', '-sx', '-B1', 'out/Bare'], check=False)
          if stop_code:
              raise SystemExit(stop_code)
          if build.returncode:
              raise SystemExit(build.returncode if build.returncode > 0 else 128 - build.returncode)

          apk = Path('out/Bare/apks/ChromePublic.apk')
          with ZipFile(apk) as archive:
              invalid = archive.testzip()
              if invalid is not None:
                  raise SystemExit(f'APK ZIP integrity check failed: {invalid}')
              for name in archive.namelist():
                  if name.startswith('lib/arm64-v8a/') and name.endswith('.so'):
                      with archive.open(name) as member:
                          header = member.read(20)
                      if header[:6] == b'\x7fELF\x02\x01' and header[18:20] == b'\xb7\x00':
                          print(f'APK contains AArch64 ELF: {name}')
                          break
              else:
                  raise SystemExit('APK contains no verified AArch64 ELF library.')
          print(f'APK built and verified: {apk} ({apk.stat().st_size} bytes)')
          subprocess.run(['sha256sum', str(apk)], check=True)
          PYTHON

      - name: Record final disk and memory diagnostics
        if: ${{ always() }}
        timeout-minutes: 3
        run: |
          awk '/^(MemTotal|MemAvailable|SwapTotal):/' /proc/meminfo
          df -B1 /
          if [[ -f $RUNNER_TEMP/bare-official/docker-compose.yml ]]; then
            cd "$RUNNER_TEMP/bare-official"
            docker inspect --format 'Container status={{.State.Status}} OOMKilled={{.State.OOMKilled}}' chromium-android-builder || true
            docker compose exec -T chromium-builder bash -c '
              df -B1 /work
              for file in memory.max memory.peak memory.swap.max memory.events; do
                path=/sys/fs/cgroup/$file
                if test -r "$path"; then
                  printf "%s:\n" "$file"
                  cat "$path"
                fi
              done
            ' || true
          fi
