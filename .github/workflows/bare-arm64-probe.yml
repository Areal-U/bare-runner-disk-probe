    - name: Run the real APK target within its time and output budgets
      id: trial
      if: ${{ startsWith(inputs.probe, 'checkpoint-') && !inputs.verify_frontier_only }}
      timeout-minutes: ${{ inputs.probe == 'checkpoint-production' && 316 || inputs.probe == 'checkpoint-large' && 95 || inputs.probe == 'checkpoint-scale' && 65 || 12
        }}
      env:
        APK_JOBS: ${{ inputs.apk_jobs }}
        COLLECTOR_LATEST_START: ${{ inputs.collector_latest_start }}
        SENDER_OUTCOME_DEADLINE: ${{ steps.peer_acquire.outputs.sender_outcome_deadline }}
      run: |
        cd "$RUNNER_TEMP/bare-official"
        # The clock starts before preparation and restore, not at compiler startup.
        elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/bare-probe-start") ))
        latest_start=55
        [[ $PROBE_MODE != checkpoint-large ]] || latest_start=60
        [[ $PROBE_MODE != checkpoint-production ]] || latest_start=65
        if [[ $PROBE_MODE != checkpoint-production ]] && (( elapsed > latest_start * 60 )); then
          echo 'Not enough time reserved for stop, hashing, packing, upload and diagnostics.' >&2
          exit 1
        fi
        phase=seed
        [[ $COEXIST_COLD == true ]] || phase=restore
        trial_timeout=9m
        kill_after=2m
        compile_seconds=0
        deadline_epoch=
        if [[ $PROBE_MODE == checkpoint-scale ]]; then
          trial_timeout=63m
          kill_after=1m
        elif [[ $PROBE_MODE == checkpoint-large ]]; then
          trial_timeout=93m
          kill_after=1m
        elif [[ $PROBE_MODE == checkpoint-production ]]; then
          # Reserve the existing 105-minute gzip/cache closure plus the bounded
          # full-graph check at the clean stop; this is independent of the Draft trial.
          reserve=130
          # Measured S2 private path, extrapolated to the separate byte and entry caps:
          # stop/settle 6m, APK frontier and retained files 9m, pack/verify 30m,
          # encrypt 2m, two 4m uploads plus receipt/overhead 13m. Draft publication
          # and full readback are charged only to the sender clock.
          [[ $CHECKPOINT_BACKEND != draft ]] || reserve=60
          deadline_epoch=$(( $(cat "$RUNNER_TEMP/bare-probe-start") + (350 - reserve) * 60 ))
          if [[ $CHECKPOINT_BACKEND == draft ]]; then
            [[ $SENDER_OUTCOME_DEADLINE =~ ^[1-9][0-9]{8,10}$ ]]
            sender_stop=$((10#$SENDER_OUTCOME_DEADLINE - reserve * 60))
            (( deadline_epoch <= sender_stop )) || deadline_epoch=$sender_stop
            printf 'Sender outcome cutoff epoch=%s; effective compile stop epoch=%s\n' "$SENDER_OUTCOME_DEADLINE" "$deadline_epoch"
          fi
          compile_seconds=$(( deadline_epoch - $(date +%s) ))
          (( compile_seconds > 0 ))
          requested_seconds=$((COMPILE_MINUTES * 60))
          if (( requested_seconds > 0 && compile_seconds > requested_seconds )); then
            compile_seconds=$requested_seconds
          fi
          printf 'APK compilation budget: %s seconds\n' "$compile_seconds"
          trial_timeout="$((compile_seconds + 300))s"
          kill_after=1m
          df -B1 "$RUNNER_TEMP" "${TMPDIR:-/tmp}"
          df -Pi "$RUNNER_TEMP" "${TMPDIR:-/tmp}"
          for path in "$RUNNER_TEMP" "${TMPDIR:-/tmp}"; do
            free=$(df -B1 --output=avail "$path" | awk 'NR == 2 { print $1 }')
            (( free >= 20 * 1024**3 ))
          done
        fi
        echo "phase=$phase" >> "$GITHUB_OUTPUT"
        if [[ $PROBE_MODE == checkpoint-production ]]; then
          [[ $COLLECTOR_LATEST_START =~ ^[1-9][0-9]{8,10}$ ]] && (( $(date +%s) <= 10#$COLLECTOR_LATEST_START )) || {
            echo 'The independently registered collector lease cannot cover a new compile start.' >&2
            exit 1
          }
        fi
        docker compose exec -T -e DEPOT_TOOLS_UPDATE=0 -e DEPOT_TOOLS_METRICS=0 \
          -e "TRIAL_PHASE=$phase" -e "PROBE_MODE=$PROBE_MODE" -e "COMPILE_SECONDS=$compile_seconds" -e "COMPILE_STOP_EPOCH=$deadline_epoch" \
          -e "APK_OUTPUT_GIB=$APK_OUTPUT_GIB" -e "APK_JOBS=$APK_JOBS" chromium-builder \
          timeout --kill-after="$kill_after" "$trial_timeout" bash -seu <<'CONTAINER'
        set -o pipefail
        cd /work/chromium/src
        if [[ $TRIAL_PHASE == restore ]]; then
          test -f /exchange/checkpoint/reuse-verified
        fi
        if [[ $TRIAL_PHASE == seed ]]; then
          autoninja -C out/Bare -j 2 -v base/third_party/cityhash:cityhash
          object=out/Bare/obj/base/third_party/cityhash/cityhash/city.o
          test -s "$object"
          python3 /exchange/checkpoint.py object-info "$object" out/Bare/checkpoint-object.json
        fi
        args=(--seconds 180 --max-output-bytes 1879048192 --min-free-bytes 10000000000)
        if [[ $PROBE_MODE == checkpoint-scale ]]; then
          args=(--scale --seconds 3600 --max-output-bytes 2684354560 --max-output-entries 140000 --min-free-bytes 21474836480)
        elif [[ $PROBE_MODE == checkpoint-large ]]; then
          args=(--large --seconds 5400 --max-output-bytes 6442450944 --max-output-entries 300000 --min-free-bytes 21474836480)
        elif [[ $PROBE_MODE == checkpoint-production ]]; then
          args=(--production --seconds "$COMPILE_SECONDS" --jobs "$APK_JOBS" --max-output-bytes "$((APK_OUTPUT_GIB * 1024**3))" --max-output-entries 525000 --min-free-bytes 21474836480)
        elif [[ $TRIAL_PHASE == restore ]]; then
          args+=(--previous-result out/Bare/checkpoint-trial-seed.json)
        fi
        python3 /exchange/build_trial.py --phase "$TRIAL_PHASE" \
          --result "/exchange/checkpoint/trial-$TRIAL_PHASE.json" \
          --log "/exchange/checkpoint/trial-$TRIAL_PHASE.log" \
          "${args[@]}"
        CONTAINER
    - name: Stop every build writer before making the archive
      id: quiesce
      if: ${{ always() && startsWith(inputs.probe, 'checkpoint-') && steps.trial.outputs.phase != '' }}
      timeout-minutes: 3
      run: |
        cd "$RUNNER_TEMP/bare-official"
        container=chromium-android-builder
        volume=$(docker inspect "$container" --format '{{range .Mounts}}{{if eq .Destination "/work"}}{{.Name}}{{end}}{{end}}')
        [[ -n $volume ]]
        mapfile -t users < <(docker ps --filter "volume=$volume" --format '{{.Names}}')
        [[ ${#users[@]} == 1 && ${users[0]} == "$container" ]]
        if [[ $PROBE_MODE == checkpoint-scale || $PROBE_MODE == checkpoint-large || $PROBE_MODE == checkpoint-production ]]; then
          timeout --kill-after=2s 10s docker compose exec -T chromium-builder bash -c '
            df -B1 /work /exchange
            df -Pi /work /exchange
            for name in memory.max memory.peak memory.swap.max memory.events; do
              path=/sys/fs/cgroup/$name
              if test -r "$path"; then
                printf "%s:\n" "$name"
                cat "$path"
              fi
            done
          ' || echo '::warning::Could not collect pre-stop resource counters.'
        fi
        docker stop --time 20 "$container"
        [[ $(docker inspect "$container" --format '{{.State.Running}}') == false ]]
        # This pinned container starts an idle bash, never the build command.
        docker start "$container"
        docker compose exec -T chromium-builder true
        echo 'quiescent=true' >> "$GITHUB_OUTPUT"
    - name: Verify the completed APK and encrypt it for private recovery
      id: apk_seal
      if: ${{ always() && inputs.probe == 'checkpoint-production' && steps.quiesce.outputs.quiescent == 'true' }}
      timeout-minutes: ${{ inputs.backend == 'draft' && 17 || 37 }}
      env:
        APK_RECIPIENT: ${{ inputs.apk_recipient }}
        TRIAL_PHASE: ${{ steps.trial.outputs.phase }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/bare-official"
        terminal=$(docker compose exec -T -e "TRIAL_PHASE=$TRIAL_PHASE" chromium-builder python3 - <<'PYTHON'
        import json
        import os
        from pathlib import Path
        phase = os.environ['TRIAL_PHASE']
        assert phase in ('seed', 'restore')
        report = Path(f'/exchange/checkpoint/trial-{phase}.json')
        data = json.loads(report.read_text(encoding='utf-8')) if report.is_file() else {}
        print('true' if data.get('reason') == 'completed' else 'false')
        PYTHON
        )
        if [[ $terminal != true ]]; then
          exit 0
        fi
        echo 'terminal=true' >> "$GITHUB_OUTPUT"
        umask 077
        delivery=$(mktemp -d "$RUNNER_TEMP/bare-apk-seal.XXXXXXXX")
        trap 'rm -rf -- "$delivery"' EXIT
        final_dir="$RUNNER_TEMP/bare-apk-delivery"
        [[ ! -e $final_dir && ! -L $final_dir ]]
        mkdir -m 700 "$final_dir"
        [[ $APK_RECIPIENT =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]
        if docker compose exec -T chromium-builder python3 -I /exchange/guard.py size apk /work/chromium/src/out/Bare/apks/ChromePublic.apk; then
          :
        else
          status=$?
          if (( status == 65 )); then
            printf 'status=apk-size-exceeded\nready=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
        fi
        docker compose exec -T -e TRIAL_PHASE -e DEPOT_TOOLS_UPDATE=0 -e DEPOT_TOOLS_METRICS=0 chromium-builder bash -euc '
          cd /work/chromium/src
          set -o pipefail
          python3 /exchange/segment_graph.py after --terminal --host-quiesced --baseline /exchange/checkpoint/segment-before.json \
            --trial "/exchange/checkpoint/trial-$TRIAL_PHASE.json" | tee /exchange/checkpoint/terminal-frontier.log
        '
        docker compose exec -T -e "BARE_REV=$BARE_REV" -e "CHROMIUM_REV=$CHROMIUM_REV" \
          -e "CI_REVISION=$GITHUB_SHA" -e "TRIAL_PHASE=$TRIAL_PHASE" chromium-builder bash -seu <<'CONTAINER' \
          | age -r "$APK_RECIPIENT" -o "$delivery/Bare-Personal-2.0.4-arm64-v8a.tar.age"
        set -o pipefail
        cd /work/chromium/src
        temp=$(mktemp -d)
        apk=out/Bare/apks/ChromePublic.apk
        # Diagnose the immutable candidate only if QC fails. Keep stdout exclusively for the accepted tar.
        finish_qc() {
          local status=$?
          if (( status != 0 )); then
            python3 -I /exchange/apk_qc_evidence.py "$apk" "$temp" >&2 || echo 'APK QC diagnostics unavailable.' >&2
          fi
          rm -rf -- "$temp"
          exit "$status"
        }
        trap finish_qc EXIT
        sdk=third_party/android_sdk/public/build-tools/37.0.0
        [[ -x $sdk/aapt2 && -x $sdk/apksigner && -x third_party/jdk/current/bin/java ]]
        export JAVA_HOME="$PWD/third_party/jdk/current"
        export PATH="$JAVA_HOME/bin:$PATH"
        "$sdk/aapt2" dump badging "$apk" > "$temp/badging.txt" 2>&1 || {
          echo 'Android manifest inspection failed.' >&2
          exit 1
        }
        "$sdk/apksigner" verify --verbose --print-certs "$apk" > "$temp/signing.txt" 2>&1 || {
          echo 'Android APK signature verification failed.' >&2
          exit 1
        }
        python3 -I /exchange/launcher_labels.py "$sdk/aapt2" "$apk" --badging "$temp/badging.txt"
        python3 - "$apk" "$temp" <<'PYTHON'
        import hashlib
        import json
        import os
        import re
        import stat
        import sys
        import zipfile
        from pathlib import Path

        apk, temp = map(Path, sys.argv[1:])
        phase = os.environ['TRIAL_PHASE']
        if phase not in ('seed', 'restore'):
            raise SystemExit('Unexpected production trial phase.')
        with Path(f'/exchange/checkpoint/trial-{phase}.json').open(encoding='utf-8') as stream:
            report = json.load(stream)
        observed = report.get('apk')
        if not (report.get('reason') == 'completed' and report.get('returncode') == 0 and report.get('artifact_ready') is True
                and report.get('forced_kill') is False and report.get('failed_step_count') == 0
                and isinstance(observed, dict) and observed.get('path') == apk.as_posix()):
            raise SystemExit('The exact APK target has no clean successful result.')
        info = apk.lstat()
        if not stat.S_ISREG(info.st_mode) or not 0 < info.st_size <= 450 * 1024**2:
            raise SystemExit('Unexpected APK file type or size.')
        hasher = hashlib.sha256()
        with apk.open('rb') as stream:
            for chunk in iter(lambda: stream.read(4 * 1024 * 1024), b''):
                hasher.update(chunk)
        digest = hasher.hexdigest()
        if info.st_size != observed.get('size') or digest != observed.get('sha256'):
            raise SystemExit('APK changed after the build completed.')

        expected_package = 'org.barebrowser.personal'
        expected_version = '2.0.4'
        expected_code = '802000415'
        expected_crx = 'd688ed3f0262ec4f8bdcd4c8f65987c5444c560aeb387a9e02aca1facdfa7046'
        expected_cert = '32a2fc74d731105859e5a85df16d95f102d85b22099b8064c5d8915c61dad1e0'
        badging = (temp / 'badging.txt').read_text(encoding='utf-8')
        package_line = next((line for line in badging.splitlines() if line.startswith('package: ')), '')
        fields = dict(re.findall(r"\b([A-Za-z][A-Za-z0-9]*)='([^']*)'", package_line))
        if (fields.get('name'), fields.get('versionName'), fields.get('versionCode')) != (
            expected_package, expected_version, expected_code,
        ):
            raise SystemExit('Unexpected Android package name or version.')
        if "application-label:'Bare Personal'" not in badging.splitlines():
            raise SystemExit('Unexpected personal launcher label.')
        architectures = [line.strip() for line in badging.splitlines() if line.startswith('native-code:')]
        if architectures != ["native-code: 'arm64-v8a'"]:
            raise SystemExit('APK does not report exactly the ARM64 ABI.')

        signing = (temp / 'signing.txt').read_text(encoding='utf-8')
        signer_pattern = r'^(?:Signer #\d+ certificate|V\d+(?:\.\d+)? Signer(?: #\d+)?: certificate) SHA-256 digest: ([0-9a-f]{64})\s*$'
        signers = re.findall(signer_pattern, signing, flags=re.IGNORECASE | re.MULTILINE)
        if ({signer.lower() for signer in signers} != {expected_cert}
                or not re.search(r'^Number of signers: 1\s*$', signing, re.MULTILINE)):
            raise SystemExit('APK signing certificate does not match pinned Chromium build key.')

        crx = 'assets/bare/ublock_origin.crx'
        with zipfile.ZipFile(apk) as archive:
            members = archive.namelist()
            if len(members) != len(set(members)):
                raise SystemExit('APK ZIP contains a duplicate member.')
            if archive.testzip() is not None:
                raise SystemExit('APK ZIP integrity verification failed.')
            if crx not in members or hashlib.sha256(archive.read(crx)).hexdigest() != expected_crx:
                raise SystemExit('Pinned embedded uBlock Origin did not match.')
            core = 'lib/arm64-v8a/libchrome.so'
            if core not in members:
                raise SystemExit('Missing expected ARM64 Chromium library.')
            with archive.open(core) as library:
                header = library.read(20)
            if header[:6] != b'\x7fELF\x02\x01' or header[18:20] != b'\xb7\x00':
                raise SystemExit('Chromium library is not AArch64 ELF.')

        metadata = {
            'apk': 'ChromePublic.apk',
            'package': expected_package,
            'version_name': expected_version,
            'version_code': expected_code,
            'abi': 'arm64-v8a',
            'bytes': info.st_size,
            'sha256': digest,
            'signer_sha256': expected_cert,
            'embedded_ublock_origin_sha256': expected_crx,
            'bare_revision': os.environ['BARE_REV'],
            'chromium_revision': os.environ['CHROMIUM_REV'],
            'ci_revision': os.environ['CI_REVISION'],
        }
        (temp / 'apk-metadata.json').write_text(json.dumps(metadata, sort_keys=True, indent=2) + '\n')
        PYTHON
        # The only stream leaving the build container feeds directly into age.
        tar -cf - -C "$PWD/out/Bare/apks" ChromePublic.apk -C "$temp" apk-metadata.json
        CONTAINER
        name=Bare-Personal-2.0.4-arm64-v8a.tar.age
        [[ $(head -n 1 -- "$delivery/$name") == age-encryption.org/v1 ]]
        encrypted_bytes=$(stat -c %s -- "$delivery/$name")
        if python3 -I "$RUNNER_TEMP/bare-ci/guard.py" size cipher "$delivery/$name"; then
          echo 'status=sealed' >> "$GITHUB_OUTPUT"
        else
          status=$?
          if (( status == 65 )); then
            printf 'status=cipher-size-exceeded\nready=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
        fi
        sha=$(sha256sum -- "$delivery/$name" | cut -d ' ' -f 1)
        mv -T -- "$delivery/$name" "$final_dir/$name"
        if [[ $SEGMENT_ORDINAL =~ ^([1-9]|1[0-2])$ ]]; then
          seal_name=$(SEALED_SHA="$sha" SEALED_BYTES="$encrypted_bytes" python3 -I \
            "$RUNNER_TEMP/r28-apk-receipt/apk_seal.py" "$final_dir/seal.json")
          echo "seal_name=$seal_name" >> "$GITHUB_OUTPUT"
          printf 'R28_SEALED_CIPHER {"run":%s,"attempt":%s,"ordinal":%s,"sha":"%s","bytes":%s}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SEGMENT_ORDINAL" "$sha" "$encrypted_bytes"
        fi
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "bytes=$encrypted_bytes" >> "$GITHUB_OUTPUT"
        echo 'ready=true' >> "$GITHUB_OUTPUT"
    - name: Check retention and free storage before the terminal APK leaves the runner
      id: apk_storage
      if: ${{ steps.apk_seal.outputs.ready == 'true' && inputs.backend == 'draft' }}
      timeout-minutes: 3
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        ENCRYPTED_BYTES: ${{ steps.apk_seal.outputs.bytes }}
      run: |
        python3 preflight28/bridge/storage_admission.py control
        python3 preflight28/bridge/storage_admission.py terminal --terminal-bytes "$ENCRYPTED_BYTES"
        echo 'accepted=true' >> "$GITHUB_OUTPUT"
    - name: Persist the original sealed APK receipt
      if: ${{ steps.apk_seal.outputs.ready == 'true' && steps.apk_seal.outputs.seal_name != '' && (inputs.backend != 'draft' || steps.apk_storage.outputs.accepted == 'true') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      continue-on-error: true
      timeout-minutes: 2
      with:
        name: ${{ steps.apk_seal.outputs.seal_name }}
        path: ${{ runner.temp }}/bare-apk-delivery/seal.json
        if-no-files-found: error
        overwrite: false
        retention-days: 30
        compression-level: 0
    - name: Upload the encrypted APK bundle
      id: apk_upload
      if: ${{ steps.apk_seal.outputs.ready == 'true' && (inputs.backend != 'draft' || steps.apk_storage.outputs.accepted == 'true') }}
      timeout-minutes: ${{ inputs.backend == 'draft' && 5 || 15 }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: bare-personal-204-encrypted-${{ github.run_id }}-${{ github.run_attempt }}${{ env.SEGMENT_SUFFIX }}
        path: ${{ runner.temp }}/bare-apk-delivery
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
    - name: Resolve the exact encrypted artifact after the upload attempt
      id: seal_receipt
      if: ${{ !cancelled() && steps.apk_seal.outputs.ready == 'true' }}
      timeout-minutes: 2
      env:
        GH_TOKEN: ${{ github.token }}
        RETURNED_ID: ${{ steps.apk_upload.outputs.artifact-id }}
        RETURNED_DIGEST: ${{ steps.apk_upload.outputs.artifact-digest }}
        ENCRYPTED_SHA: ${{ steps.apk_seal.outputs.sha }}
        ENCRYPTED_BYTES: ${{ steps.apk_seal.outputs.bytes }}
      run: python3 "$RUNNER_TEMP/r28-apk-receipt/apk_artifact.py"
    - name: Check temporary recovery capacity for the encrypted APK
      id: apk_fallback_budget
      if: ${{ always() && steps.apk_seal.outputs.ready == 'true' && steps.seal_receipt.outcome == 'success' && steps.seal_receipt.outputs.id == '' }}
      timeout-minutes: 3
      env:
        CACHE_READ_TOKEN: ${{ github.token }}
        ENCRYPTED_BYTES: ${{ steps.apk_seal.outputs.bytes }}
      run: |
        if [[ $CHECKPOINT_BACKEND == draft ]]; then
          GH_TOKEN="$CACHE_READ_TOKEN" python3 preflight28/bridge/storage_admission.py cache --terminal-bytes "$ENCRYPTED_BYTES"
        else
        /usr/bin/python3 -I - <<'PYTHON'
        import os
        import runpy

        cache_get = runpy.run_path(os.path.join(os.environ['RUNNER_TEMP'], 'bare-cache-reader/cache_api.py'))['cache_get']
        usage = cache_get('cache/usage', timeout=20)['active_caches_size_in_bytes']
        entries = cache_get('caches', {'per_page': 100}, timeout=20)
        if entries['total_count'] != len(entries['actions_caches']):
            raise SystemExit('Encrypted APK fallback cannot confirm full cache inventory.')
        listed = sum(entry['size_in_bytes'] for entry in entries['actions_caches'])
        encrypted = int(os.environ['ENCRYPTED_BYTES'])
        if max(usage, listed) + encrypted + 1024**2 + 1024**3 > 10 * 1024**3:
            raise SystemExit('Encrypted APK fallback exceeds the configured free cache budget.')
        PYTHON
        fi
        echo "key=bare-coexist-204-apk-v1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT${SEGMENT_SUFFIX}" >> "$GITHUB_OUTPUT"
    - name: Save only the encrypted APK for retrieval retry
      id: apk_fallback_save
      if: ${{ always() && steps.apk_fallback_budget.outcome == 'success' }}
      timeout-minutes: ${{ inputs.backend == 'draft' && 6 || 12 }}
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ steps.apk_seal.outputs.seal_name != '' && format('{0}/bare-apk-delivery', runner.temp) || format('{0}/bare-apk-delivery/Bare-Personal-2.0.4-arm64-v8a.tar.age', runner.temp) }}
        key: ${{ steps.apk_fallback_budget.outputs.key }}
    - name: Record the encrypted APK fallback receipt
      id: apk_fallback_receipt
      if: ${{ always() && steps.apk_fallback_save.outcome == 'success' }}
      timeout-minutes: 4
      env:
        CACHE_READ_TOKEN: ${{ github.token }}
        ENCRYPTED_KEY: ${{ steps.apk_fallback_budget.outputs.key }}
        ENCRYPTED_SHA: ${{ steps.apk_seal.outputs.sha }}
        ENCRYPTED_BYTES: ${{ steps.apk_seal.outputs.bytes }}
      run: |
        [[ $ENCRYPTED_KEY == "bare-coexist-204-apk-v1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT${SEGMENT_SUFFIX}" ]]
        cache_id=$(/usr/bin/python3 -I - <<'PYTHON'
        import os
        import runpy
        import time

        cache_get = runpy.run_path(os.path.join(os.environ['RUNNER_TEMP'], 'bare-cache-reader/cache_api.py'))['cache_get']
        key = os.environ['ENCRYPTED_KEY']
        size = int(os.environ['ENCRYPTED_BYTES'])
        query = {'key': key, 'ref': os.environ['GITHUB_REF']}
        for attempt in range(5):
            try:
                caches = cache_get('caches', query, timeout=20)['actions_caches']
                matches = [entry for entry in caches if entry['key'] == key and entry['ref'] == os.environ['GITHUB_REF']]
                if len(matches) == 1 and 0 < matches[0]['size_in_bytes'] <= size + 1024**2:
                    print(matches[0]['id'])
                    break
            except (OSError, ValueError, KeyError):
                pass
            if attempt < 4:
                time.sleep(4)
        else:
            raise SystemExit('No exact encrypted APK cache receipt; handoff remains unverified.')
        PYTHON
        )
        unset CACHE_READ_TOKEN
        [[ $cache_id =~ ^[1-9][0-9]*$ && $ENCRYPTED_SHA =~ ^[0-9a-f]{64}$ && $ENCRYPTED_BYTES =~ ^[1-9][0-9]*$ ]]
        echo "key=$ENCRYPTED_KEY" >> "$GITHUB_OUTPUT"
        printf 'APK artifact upload failed; temporary ciphertext cache ID %s, key %s, SHA-256 %s, %s bytes\n' \
          "$cache_id" "$ENCRYPTED_KEY" "$ENCRYPTED_SHA" "$ENCRYPTED_BYTES" | tee -a "$GITHUB_STEP_SUMMARY"
    - name: Classify progress on the fixed APK graph after all writers stop
      id: frontier_finish
      if: ${{ !cancelled() && inputs.probe == 'checkpoint-production' && steps.quiesce.outputs.quiescent == 'true' && steps.apk_seal.outcome == 'success' && steps.apk_seal.outputs.terminal
        != 'true' }}
