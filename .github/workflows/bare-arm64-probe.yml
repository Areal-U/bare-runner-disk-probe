      run: |
        mkdir "$RUNNER_TEMP/bare-cache-reader"
        cat > "$RUNNER_TEMP/bare-cache-reader/cache_api.py" <<'PYTHON'
        import http.client
        import json
        import os
        import urllib.parse

        def cache_get(resource, query=None, timeout=15):
            if resource not in ('cache/usage', 'caches'):
                raise ValueError('Unknown cache metadata endpoint.')
            token = os.environ.get('CACHE_READ_TOKEN')
            if not token:
                raise SystemExit('Missing GitHub Actions cache read token.')
            path = '/repos/Areal-U/bare-runner-disk-probe/actions/' + resource
            if query:
                path += '?' + urllib.parse.urlencode(query)
            headers = {
                'Accept': 'application/vnd.github+json',
                'Authorization': 'Bearer ' + token,
                'User-Agent': 'bare-bounded-checkpoint',
                'X-GitHub-Api-Version': '2022-11-28',
            }
            # HTTPSConnection sends one request to this host and never follows redirects.
            connection = http.client.HTTPSConnection('api.github.com', timeout=timeout)
            try:
                connection.request('GET', path, headers=headers)
                response = connection.getresponse()
                if response.status in (401, 403, 429):
                    details = []
                    for header in ('x-ratelimit-remaining', 'x-ratelimit-reset', 'retry-after'):
                        value = response.getheader(header, '')
                        if value.isascii() and value.isdecimal() and len(value) <= 12:
                            details.append(f'{header}={value}')
                    detail = ' (' + ', '.join(details) + ')' if details else ''
                    raise SystemExit(f'GitHub cache metadata returned HTTP {response.status}{detail}.')
                if response.status != 200:
                    raise OSError(f'GitHub cache metadata returned HTTP {response.status}.')
                return json.load(response)
            except http.client.HTTPException as error:
                raise OSError('Could not read GitHub cache metadata.') from error
            finally:
                connection.close()
        PYTHON
        cat > "$RUNNER_TEMP/bare-cache-reader/check-cache-budget.py" <<'PYTHON'
        import json, os, runpy, time
        cache_get = runpy.run_path(os.path.join(os.environ['RUNNER_TEMP'], 'bare-cache-reader/cache_api.py'))['cache_get']
        def get(resource, query=None):
            for attempt in range(3):
                try:
                    return cache_get(resource, query)
                except (OSError, ValueError):
                    if attempt == 2:
                        raise
                    time.sleep(2)
        usage = get('cache/usage')
        caches = []
        for page in range(1, 11):
            batch = get('caches', {'per_page': 100, 'page': page})['actions_caches']
            caches.extend(batch)
            if len(batch) < 100:
                break
        else:
            raise SystemExit('Cannot bound cache inventory; stopping before compilation.')
        gib = 1024**3
        limit_bytes = 10 * gib
        cap = int(os.environ['PRODUCTION_CAP_BYTES'])
        candidate_bytes = int(os.environ.get('CANDIDATE_BYTES', str(cap - 1024**2)))
        if not 0 < candidate_bytes <= cap - 1024**2:
            raise SystemExit('Candidate size is outside the production envelope.')
        if os.environ['COEXIST_COLD'] != 'true':
            parents = [item for item in caches
                       if item['key'] == os.environ['EXPECTED_KEY'] and item['ref'] == os.environ['GITHUB_REF']]
            if len(parents) != 1 or not 0 < parents[0]['size_in_bytes'] <= cap:
                raise SystemExit('The exact selected checkpoint is absent or outside the production envelope.')
        if os.environ['RETAIN_EXISTING_CACHES'] == 'true':
            protected = (
                (os.environ['SNAPSHOT_PRODUCTION_KEY'], 'refs/heads/main'),
                (os.environ['FINAL_LINK_PRODUCTION_KEY'], 'refs/heads/main'),
                (os.environ['COEXIST_22_KEY'], os.environ['GITHUB_REF']),
            )
            for key, ref in protected:
                if sum(item['key'] == key and item['ref'] == ref for item in caches) != 1:
                    raise SystemExit(f'Expected one protected checkpoint for {ref}: {key}')
        reserve = candidate_bytes + 128 * 1024**2
        used = max(usage['active_caches_size_in_bytes'], sum(item['size_in_bytes'] for item in caches))
        if used + reserve > limit_bytes:
            raise SystemExit('Insufficient cache headroom; retain existing checkpoints and choose storage first.')
        print(json.dumps({'cache_bytes_observed': used, 'reserved_bytes': reserve, 'limit_bytes': limit_bytes}))
        PYTHON
