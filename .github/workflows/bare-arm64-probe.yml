name: Bare Personal ARM64 checkpoint build
'on':
  workflow_call:
    inputs:
      checkpoint_compression:
        type: string
        default: auto
      probe:
        type: string
        default: smoke
      verify_frontier_only:
        type: boolean
        default: false
      segment_ordinal:
        type: number
        default: 0
      expected_parent_producer:
        type: string
        default: ''
      checkpoint_segment:
        type: string
        default: initial
      expected_checkpoint_key:
        type: string
        default: ''
      expected_checkpoint_sha:
        type: string
        default: ''
      expected_checkpoint_identity:
        type: string
        default: ''
      expected_base_image:
        type: string
        default: ''
      coexist_cold:
        type: boolean
        default: false
      repair_legacy_input_paths:
        type: boolean
        default: false
      apk_recipient:
        type: string
        default: ''
      apk_output_gib:
        type: number
        default: 11
      apk_jobs:
        type: number
        default: 2
      compile_minutes:
        type: number
        default: 180
      retain_existing_caches:
        type: boolean
        default: false
      backend:
        type: string
        default: cache
      parent_run:
        type: string
        default: ''
      parent_manifest_id:
        type: string
        default: ''
      parent_manifest_sha:
        type: string
        default: ''
      owner_claim_id:
        type: string
        default: ''
      storage_ceiling:
        type: string
        default: ''
      storage_until:
        type: string
        default: ''
      collector_latest_start:
        type: string
        default: ''
    outputs:
      relay_stop:
        value: ${{ jobs.compile-probe.outputs.relay_stop }}
      relay_no_receipt:
        value: ${{ jobs.draft-publisher.outputs.relay_no_receipt }}
      frontier_status:
        value: ${{ jobs.compile-probe.outputs.frontier_status }}
      parent_frontier_verified:
        value: ${{ jobs.compile-probe.outputs.parent_frontier_verified }}
      checkpoint_ordinal:
        value: ${{ jobs.compile-probe.outputs.checkpoint_ordinal }}
      producer_sha:
        value: ${{ jobs.compile-probe.outputs.producer_sha }}
      checkpoint_key:
        value: ${{ (inputs.backend == 'draft' && jobs.draft-publisher.outputs.checkpoint_key) || (inputs.backend != 'draft' && jobs.compile-probe.outputs.checkpoint_key)
          || '' }}
      checkpoint_sha:
        value: ${{ (inputs.backend == 'draft' && jobs.draft-publisher.outputs.checkpoint_sha) || (inputs.backend != 'draft' && jobs.compile-probe.outputs.checkpoint_sha)
          || '' }}
      checkpoint_identity:
        value: ${{ (inputs.backend == 'draft' && jobs.draft-publisher.outputs.checkpoint_identity) || (inputs.backend != 'draft' && jobs.compile-probe.outputs.checkpoint_identity)
          || '' }}
      base_image:
        value: ${{ jobs.compile-probe.outputs.base_image }}
      checkpoint_saved:
        value: ${{ (inputs.backend == 'draft' && jobs.draft-publisher.outputs.private_readback_verified) || (inputs.backend != 'draft' && jobs.compile-probe.outputs.checkpoint_saved)
          || '' }}
      checkpoint_advanced:
        value: ${{ (inputs.backend == 'draft' && jobs.draft-publisher.outputs.checkpoint_advanced) || (inputs.backend != 'draft' && jobs.compile-probe.outputs.checkpoint_advanced) || 'false' }}
      private_status:
        value: ${{ jobs.draft-publisher.outputs.private_status }}
      apk_artifact_id:
        value: ${{ jobs.compile-probe.outputs.apk_artifact_id }}
      apk_cache_key:
        value: ${{ jobs.compile-probe.outputs.apk_cache_key }}
      apk_delivery_status:
        value: ${{ jobs.compile-probe.outputs.apk_delivery_status }}
      apk_encrypted_sha:
        value: ${{ jobs.compile-probe.outputs.apk_encrypted_sha }}
      apk_encrypted_bytes:
        value: ${{ jobs.compile-probe.outputs.apk_encrypted_bytes }}
      checkpoint_manifest_id:
        value: ${{ jobs.draft-publisher.outputs.checkpoint_manifest_id }}
      checkpoint_manifest_sha:
        value: ${{ jobs.draft-publisher.outputs.checkpoint_manifest_sha }}
      checkpoint_bytes:
        value: ${{ jobs.draft-publisher.outputs.checkpoint_bytes }}
      private_readback_verified:
        value: ${{ jobs.draft-publisher.outputs.private_readback_verified }}
  workflow_dispatch:
    inputs:
      probe:
        description: Only the short ARM64 smoke target; use the transfer workflow for APK interruption
        type: choice
        default: smoke
        options:
        - smoke
permissions: {}
env:
  R28_STORAGE_CEILING: ${{ inputs.storage_ceiling }}
  R28_STORAGE_UNTIL: ${{ inputs.storage_until }}
  R28_RELAY_BYTE_CEILING: ${{ vars.R28_RELAY_BYTE_CEILING }}
jobs:
  compile-probe:
    permissions:
      actions: read
    if: ${{ toJSON(github.event.repository.private) == 'false' && toJSON(github.event.repository.fork) == 'false' && (github.ref == 'refs/heads/bare-coexist-v2.0.4' || (github.ref == 'refs/heads/bare-r30-s1-restore-20261126' && github.event_name == 'workflow_dispatch' &&
      fromJSON(toJSON(github.event.inputs)).mode == 'verify-r30-s1' && github.actor == 'Areal-U' && github.run_attempt == '1' &&
      inputs.verify_frontier_only && inputs.segment_ordinal == 2 && inputs.parent_run == '45771045621' && inputs.backend == 'draft')) &&
      inputs.probe == 'checkpoint-production' && (github.run_attempt == '1' || inputs.verify_frontier_only) }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.probe == 'checkpoint-production' && 350 || inputs.probe == 'checkpoint-large' && 250 || inputs.probe == 'checkpoint-scale' && 190 || 120
      }}
    concurrency:
      group: bare-coexist-204-compile
      cancel-in-progress: false
    outputs:
      relay_stop: ${{ steps.relay_final.outputs.stop }}
      frontier_status: ${{ steps.frontier_finish.outputs.status }}
      parent_frontier_verified: ${{ steps.frontier.outputs.verified }}
      checkpoint_key: ${{ steps.identity.outputs.key }}
      checkpoint_ordinal: ${{ steps.identity.outputs.ordinal }}
      producer_sha: ${{ github.sha }}
      checkpoint_sha: ${{ steps.pack-checkpoint.outputs.sha }}
      checkpoint_identity: ${{ steps.pack-checkpoint.outputs.identity }}
      base_image: ${{ steps.prepare.outputs.base_image }}
      checkpoint_saved: ${{ inputs.probe == 'checkpoint-production' && steps.checkpoint-proof.outputs.verified || inputs.probe != 'checkpoint-production' && steps.saved-receipt.outputs.saved
        || '' }}
      checkpoint_advanced: ${{ steps.pack-checkpoint.outputs.checkpoint_advanced }}
      apk_artifact_id: ${{ steps.seal_receipt.outputs.id }}
      apk_cache_key: ${{ steps.apk_fallback_receipt.outputs.key }}
      apk_delivery_status: ${{ steps.apk_seal.outputs.status }}
      apk_encrypted_sha: ${{ steps.apk_seal.outputs.sha }}
      apk_encrypted_bytes: ${{ steps.apk_seal.outputs.bytes }}
    env:
      BARE_REV: 21cb542601950cbd5ee2eddcad6a9163bdf5ea99
      CHROMIUM_REV: 800628ad1ca1fd0c51e3b43b5b2bca081e81c3f6
      DEPOT_REV: 96a7c1418eedaa6bea333a8941e8a0078681b4d0
      GIT_TERMINAL_PROMPT: '0'
      PROBE_MODE: ${{ inputs.probe }}
      VERIFY_FRONTIER_ONLY: ${{ inputs.verify_frontier_only && 'true' || 'false' }}
      PERSONAL_LABEL_RUN: ${{ github.event.inputs.mode == 'build-apk' && github.ref == 'refs/heads/bare-coexist-v2.0.4' && inputs.probe == 'checkpoint-production' && inputs.backend == 'draft' && inputs.segment_ordinal >= 2 && inputs.segment_ordinal <= 13 && 'true' || 'false' }}
      COEXIST_COLD: ${{ inputs.coexist_cold && 'true' || 'false' }}
      REPAIR_LEGACY_INPUT_PATHS: ${{ inputs.repair_legacy_input_paths && 'true' || 'false' }}
      LEGACY_PRODUCTION_KEY: bare-transfer-v2-42973841138-1-checkpoint-large
      LEGACY_PRODUCTION_REV: ee7b3e891fa6bd76d9c0c2d3c02a9bb3622d92b0
      EXPANDED_PRODUCTION_KEY: bare-transfer-v2-42997174308-1-checkpoint-production
      EXPANDED_PRODUCTION_REV: 9ebb823d437f7e4928b54411d3e515849ff8d519
      PRE_SNAPSHOT_KEY: bare-transfer-v2-43191406312-1-checkpoint-production
      PRE_SNAPSHOT_BACKUP_KEY: bare-transfer-v2-43143109423-2-checkpoint-production
      PRE_SNAPSHOT_REV: dd90eaab51159a716d7e0b6b2234b5f3e6995f56
      SNAPSHOT_PRODUCTION_KEY: bare-transfer-v2-43360178829-1-checkpoint-production
      SNAPSHOT_PRODUCTION_BACKUP_KEY: bare-transfer-v2-43323220017-1-checkpoint-production
      SNAPSHOT_PRODUCTION_REV: 2601b4b4eb11f53204450c4c9909c868a2df04fb
      FINAL_LINK_PRODUCTION_KEY: bare-transfer-v2-43768891019-1-checkpoint-production
      FINAL_LINK_PRODUCTION_REV: f0695d66e60385f869d101d3b535ee241373f28c
      COEXIST_27_S2_KEY: bare-coexist-204-45285202990-1-checkpoint-production-s2
      COEXIST_22_KEY: bare-coexist-204-43987539656-1-checkpoint-production
      COEXIST_22_REV: 17a2bed5a26071215258627dc76f56e357b21a6b
      COEXIST_23_KEY: bare-coexist-204-44281142681-1-checkpoint-production
      COEXIST_23_REV: 66474f5823f5b773c70507009d0e1b694517cb22
      UBUNTU_SNAPSHOT_URL: https://snapshot.ubuntu.com/ubuntu/20261112T093000Z
      UBUNTU_GLIBC_VERSION: 2.35-0ubuntu3.15
      RETAIN_EXISTING_CACHES: ${{ inputs.retain_existing_caches && 'true' || 'false' }}
      PRODUCTION_CAP_BYTES: ${{ inputs.retain_existing_caches && '2952790016' || '3758096384' }}
      EXPECTED_KEY: ${{ inputs.expected_checkpoint_key }}
      APK_OUTPUT_GIB: ${{ inputs.retain_existing_caches && 4 || inputs.apk_output_gib }}
      COMPILE_MINUTES: ${{ inputs.compile_minutes }}
      CHECKPOINT_BACKEND: ${{ inputs.backend }}
      R28_SLOT: ${{ inputs.segment_ordinal }}
      R28_PARENT_SHA: ${{ inputs.expected_checkpoint_sha }}
      R28_PARENT_IDENTITY: ${{ inputs.expected_checkpoint_identity }}
      R28_PARENT_RUN: ${{ inputs.parent_run }}
      R28_EXPECTED_PARENT_KEY: ${{ inputs.expected_checkpoint_key }}
      R28_PARENT_BACKEND: ${{ inputs.backend }}
      R28_PARENT_READBACK_ONLY: ${{ inputs.verify_frontier_only && 'true' || 'false' }}
      R28_PARENT_MANIFEST: ${{ inputs.parent_manifest_id }}
      R28_PARENT_MANIFEST_SHA: ${{ inputs.parent_manifest_sha }}
      R28_HEAD_SHA: ${{ github.sha }}
      R28_OWNER_RECIPIENT: ${{ inputs.apk_recipient }}
      R28_COLLECTION_CLAIM: ${{ inputs.owner_claim_id }}
      SEGMENT_ORDINAL: ${{ inputs.segment_ordinal }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Validate the bounded mode and producer checkpoint identity
      id: identity
      env:
        CHECKPOINT_SEGMENT: ${{ inputs.checkpoint_segment }}
        SEGMENT_ORDINAL: ${{ inputs.segment_ordinal }}
        PARENT_PRODUCER: ${{ inputs.expected_parent_producer }}
        EXPECTED_KEY: ${{ inputs.expected_checkpoint_key }}
        EXPECTED_SHA: ${{ inputs.expected_checkpoint_sha }}
        EXPECTED_IDENTITY: ${{ inputs.expected_checkpoint_identity }}
        EXPECTED_BASE: ${{ inputs.expected_base_image }}
        APK_RECIPIENT: ${{ inputs.apk_recipient }}
        APK_JOBS: ${{ inputs.apk_jobs }}
      run: |
        [[ $CHECKPOINT_BACKEND == cache || $CHECKPOINT_BACKEND == draft ]]
        if [[ $PERSONAL_LABEL_RUN == true ]]; then
          if (( SEGMENT_ORDINAL == 2 )); then
            [[ $R28_PARENT_RUN == 45771045621 && $R28_PARENT_MANIFEST == 795559195 ]]
            [[ $EXPECTED_SHA == fa44728d39b61c25d4116579e6da2c63ca7898cec24ada0e7ae453548bbd73bf ]]
          else
            # Empty parent_run selects this physical run in the existing Draft bridge;
            # a nonempty value requests a different run and must fail here.
            [[ -z $R28_PARENT_RUN && $PARENT_PRODUCER == "$GITHUB_SHA" ]]
          fi
        fi
        if [[ -n $R28_PARENT_RUN ]]; then
          [[ $CHECKPOINT_BACKEND == draft && $R28_PARENT_RUN =~ ^[1-9][0-9]{0,18}$ && $R28_PARENT_RUN != "$GITHUB_RUN_ID" ]]
          if [[ $R28_PARENT_RUN == 45771045621 && $SEGMENT_ORDINAL == 2 ]]; then
            [[ $EXPECTED_SHA == fa44728d39b61c25d4116579e6da2c63ca7898cec24ada0e7ae453548bbd73bf ]]
            [[ $EXPECTED_IDENTITY == 8f6e0fc60ac76d6558ff3f7f593a8db5a3a5c2da523b251b3847fb594fa2e3be ]]
            [[ $R28_PARENT_MANIFEST == 795559195 && $R28_PARENT_MANIFEST_SHA == f48700364b590b28188715d565d564b1afba5d5d90df1e4b98efa5cef04971c8 ]]
            mode=$(jq -er '.inputs.mode' "$GITHUB_EVENT_PATH")
            case "$GITHUB_REF,$mode,$VERIFY_FRONTIER_ONLY" in
              refs/heads/bare-r30-s1-restore-20261126,verify-r30-s1,true|refs/heads/bare-coexist-v2.0.4,build-apk,false) ;;
              *) exit 1 ;;
            esac
          else
            [[ $VERIFY_FRONTIER_ONLY == false ]]
            jq -e --arg run "$R28_PARENT_RUN" '.inputs.mode == "recover-lost-slot" and .inputs.loss_origin_run == $run' "$GITHUB_EVENT_PATH" >/dev/null
          fi
          [[ $SEGMENT_ORDINAL =~ ^([2-9]|1[0-2])$ ]]
        fi
        if [[ $CHECKPOINT_BACKEND == draft ]]; then
          [[ $GITHUB_RUN_ATTEMPT == 1 && $GITHUB_ACTOR == Areal-U ]]
          if [[ $GITHUB_REF != refs/heads/bare-coexist-v2.0.4 ]]; then
            [[ $GITHUB_REF == refs/heads/bare-r30-s1-restore-20261126 && $R28_PARENT_RUN == 45771045621 && $SEGMENT_ORDINAL == 2 && $VERIFY_FRONTIER_ONLY == true ]]
          fi
          [[ $SEGMENT_ORDINAL =~ ^([1-9]|1[0-3])$ ]]
          if (( SEGMENT_ORDINAL == 1 )); then [[ -z $R28_PARENT_MANIFEST || $R28_PARENT_MANIFEST == 0 ]]; [[ -z $R28_PARENT_MANIFEST_SHA ]];
          else [[ $R28_PARENT_MANIFEST =~ ^[1-9][0-9]*$ && $R28_PARENT_MANIFEST_SHA =~ ^[0-9a-f]{64}$ ]]; fi
        fi
        date +%s > "$RUNNER_TEMP/bare-probe-start"
        if [[ $GITHUB_EVENT_NAME != workflow_dispatch || $RUNNER_ENVIRONMENT != github-hosted || $RUNNER_ARCH != X64 ]]; then
          echo 'Expected a manually started GitHub-hosted x64 runner.' >&2
          exit 1
        fi
        [[ $PROBE_MODE == checkpoint-production && $GITHUB_REPOSITORY == Areal-U/bare-runner-disk-probe ]]
        [[ $EXPECTED_BASE == ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 ]]
        [[ $APK_RECIPIENT =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]
        key="bare-coexist-204-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-checkpoint-production"
        [[ $CHECKPOINT_SEGMENT == initial || $CHECKPOINT_SEGMENT == next ]]
        suffix=
        if [[ $SEGMENT_ORDINAL != 0 ]]; then
          [[ $SEGMENT_ORDINAL =~ ^([1-9]|1[0-3])$ ]]
          [[ $COEXIST_COLD == false && $RETAIN_EXISTING_CACHES == false ]]
          [[ $GITHUB_RUN_ATTEMPT == 1 || ${{ inputs.verify_frontier_only && 'true' || 'false' }} == true ]]
          if (( SEGMENT_ORDINAL == 1 )); then
            [[ $EXPECTED_KEY == bare-coexist-204-45285202990-1-checkpoint-production-s2 ]]
            [[ $PARENT_PRODUCER == bf70ddbf474f3390a62220a076b8c43347fecc64 ]]
          else
            if [[ $R28_PARENT_RUN == 45771045621 && $SEGMENT_ORDINAL == 2 ]]; then
              [[ $PARENT_PRODUCER == 9869f9af1ba14eeb943e6ef38af7dc77456f4ec3 ]]
            else
              [[ $PARENT_PRODUCER == "$GITHUB_SHA" ]]
            fi
            [[ $EXPECTED_KEY == "bare-coexist-204-${R28_PARENT_RUN:-$GITHUB_RUN_ID}-1-checkpoint-production-s$((SEGMENT_ORDINAL-1))" ]]
          fi
          [[ $SEGMENT_ORDINAL != 13 || ${{ inputs.verify_frontier_only && 'true' || 'false' }} == true ]]
          suffix="-s$SEGMENT_ORDINAL"
          key+="${suffix}"
        elif [[ $CHECKPOINT_SEGMENT == next ]]; then
          [[ $COEXIST_COLD == false && $RETAIN_EXISTING_CACHES == false ]]
          # Failed-job reruns can consume the first job's original successful attempt.
          [[ $EXPECTED_KEY =~ ^bare-coexist-204-([1-9][0-9]*)-([1-9][0-9]{0,8})-checkpoint-production$ ]]
          [[ ${BASH_REMATCH[1]} == "$GITHUB_RUN_ID" ]]
          (( BASH_REMATCH[2] <= GITHUB_RUN_ATTEMPT ))
          key+="-s2"
          suffix="-s2"
        fi
        echo "SEGMENT_SUFFIX=$suffix" >> "$GITHUB_ENV"
        echo "ordinal=$SEGMENT_ORDINAL" >> "$GITHUB_OUTPUT"
        if [[ $RETAIN_EXISTING_CACHES == true ]]; then
          [[ $COEXIST_COLD == false && $EXPECTED_KEY == "$COEXIST_22_KEY" ]]
          [[ $APK_OUTPUT_GIB == 4 && $APK_JOBS == 1 && $COMPILE_MINUTES == 25 ]]
        else
          [[ $APK_OUTPUT_GIB == 18 && ( $APK_JOBS == 1 || $APK_JOBS == 2 ) ]]
          [[ $COMPILE_MINUTES == 0 || $COMPILE_MINUTES == 180 || $COMPILE_MINUTES == 25 ]]
        fi
        [[ $REPAIR_LEGACY_INPUT_PATHS == false ]]
        predecessor_rev=''
        predecessor_arm_sha=''
        predecessor_transfer_sha=''
        if [[ $COEXIST_COLD == true ]]; then
          [[ -z $EXPECTED_KEY && -z $EXPECTED_SHA && -z $EXPECTED_IDENTITY ]]
        else
          [[ $COEXIST_COLD == false ]]
          [[ $EXPECTED_KEY =~ ^bare-coexist-204-[0-9]+-[0-9]+-checkpoint-production(-s([1-9]|1[0-2]))?$ ]]
          [[ $EXPECTED_SHA =~ ^[0-9a-f]{64}$ && $EXPECTED_IDENTITY =~ ^[0-9a-f]{64}$ ]]
          if [[ $EXPECTED_KEY == "$COEXIST_22_KEY" ]]; then
            [[ $EXPECTED_SHA == 0e734d8a64f55bd83f5c0143b4dd8e87ede15e08691f1113e10dcb5bfa045115 ]]
            [[ $EXPECTED_IDENTITY == f038ad5f2db76b68a91e54d3b9b9da69651dedd6d7cbf5fa7093ad2155191b09 ]]
            predecessor_rev=$COEXIST_22_REV
            predecessor_arm_sha=26f64ca7ab4d8b72a53608d57bd5c856e1b456a337ce9cc5e7f1ae14f425760a
            predecessor_transfer_sha=82c7036b25749a164041ec52ddb02fe373a600bcf643b9ad3920dee4a8368033
          elif [[ $R28_PARENT_RUN == 45771045621 && $SEGMENT_ORDINAL == 2 ]]; then
            predecessor_rev=$PARENT_PRODUCER
            predecessor_arm_sha=e1441995da92562c2a4c277bbbff2323ade6c8b00342d799f5a062c0de9fdb10
            predecessor_transfer_sha=7db22a070def67111c878b98bed2759921d4048dd8d0e1fc6b15acd890016122
          elif [[ $EXPECTED_KEY == "$COEXIST_27_S2_KEY" ]]; then
            [[ $EXPECTED_SHA == 4381b248b26a7d12443241192c27d00311abaeb5b7d1839c7a5a17d088f736cf ]]
            [[ $EXPECTED_IDENTITY == a11dd3df7bccafb011f90f562e997b4601fa8a200f85c39d09d6fc962de8a3dc ]]
            predecessor_rev=bf70ddbf474f3390a62220a076b8c43347fecc64
            predecessor_arm_sha=7f4ba3e8ff94e91777a4bf0b400bfc0e4250cafaa485ad43b050818ea565911b
            predecessor_transfer_sha=5cfc45c4033c052330ff00247ccde69f800828539df879f9eddd04800b039407
          elif [[ $EXPECTED_KEY == "$COEXIST_23_KEY" ]]; then
            [[ $EXPECTED_SHA == d05b4867fdbc8fecdcf3805f560cbbb078eb8a9b63192fb20a75c1581d5e0e3b ]]
            [[ $EXPECTED_IDENTITY == c14e976472c1ba626fc1d39cfdd624dfe6ea8112c19aabd771152eb4cb105b1b ]]
            predecessor_rev=$COEXIST_23_REV
            predecessor_arm_sha=0454973adb8179fbf7d0876408ec64e2ace66b75afd7bd54938c5aed0e0e58de
            predecessor_transfer_sha=fe0d87368877bb6c575f90e12a7102c03ec283db63361a50a159438a4e15eaaf
          fi
        fi
        [[ $CHECKPOINT_SEGMENT == initial || -z $predecessor_rev || ($R28_PARENT_RUN == 45771045621 && $SEGMENT_ORDINAL == 2) ]]
        {
          echo "COEXIST_PREDECESSOR_REV=$predecessor_rev"
          echo "COEXIST_PREDECESSOR_ARM_SHA=$predecessor_arm_sha"
          echo "COEXIST_PREDECESSOR_TRANSFER_SHA=$predecessor_transfer_sha"
        } >> "$GITHUB_ENV"
        echo "key=$key" >> "$GITHUB_OUTPUT"
    - name: Load the exact CI code before costly preparation
      if: ${{ startsWith(inputs.probe, 'checkpoint-') }}
      timeout-minutes: 5
      run: |
        mkdir -p "$RUNNER_TEMP/bare-ci"
        for file in checkpoint.py build_trial.py coexist_inputs.py launcher_labels.py apk_qc_evidence.py guard.py check_archive.py graph.py retained.py metrics_evidence.py migration_graph.py segment_graph.py angle_restore.py android_outputs.py contract_gate.py bare-arm64-probe.yml bare-checkpoint-transfer.yml; do
          source=$file
          [[ $file != guard.py ]] || source=preflight28/limits/guard.py
          [[ $file != launcher_labels.py && $file != apk_qc_evidence.py ]] || source=preflight28/signing/$file
          [[ $file != check_archive.py ]] || source=preflight28/bridge/check_archive.py
          [[ $file != graph.py && $file != retained.py && $file != metrics_evidence.py && $file != migration_graph.py && $file != segment_graph.py && $file != angle_restore.py && $file != android_outputs.py && $file != contract_gate.py ]] || source=preflight28/graph/$file
          [[ $file != *.yml ]] || source=".github/workflows/$file"
          curl --fail --location --retry 2 --max-time 60 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$source" \
            --output "$RUNNER_TEMP/bare-ci/$file"
        done
        if [[ $PERSONAL_LABEL_RUN == true ]]; then
          for file in label_resource_trial.py label_baseline.py personal_label.py label_trial_certificate.json; do
            curl --fail --location --retry 2 --max-time 60 \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/preflight28/graph/$file" \
              --output "$RUNNER_TEMP/bare-ci/$file"
          done
          python3 "$RUNNER_TEMP/bare-ci/label_baseline.py" gate
        fi
        if [[ $PROBE_MODE == checkpoint-production ]]; then
          mkdir -m 700 "$RUNNER_TEMP/r28-apk-receipt"
          for file in bridge.py artifact_poll.py apk_artifact.py; do
            curl --fail --location --retry 2 --max-time 40 \
              "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/preflight28/bridge/$file" \
              --output "$RUNNER_TEMP/r28-apk-receipt/$file"
          done
        fi
        if [[ $PROBE_MODE == checkpoint-production && $SEGMENT_ORDINAL =~ ^([1-9]|1[0-2])$ ]]; then
          curl --fail --location --retry 2 --max-time 40 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/preflight28/control/apk_seal.py" \
            --output "$RUNNER_TEMP/r28-apk-receipt/apk_seal.py"
