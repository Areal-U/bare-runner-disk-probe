          -e "PROBE_MODE=$PROBE_MODE" -e "EXPECTED_KEY=$EXPECTED_KEY" -e "LEGACY_PRODUCTION_KEY=$LEGACY_PRODUCTION_KEY" \
          -e "EXPANDED_PRODUCTION_KEY=$EXPANDED_PRODUCTION_KEY" \
