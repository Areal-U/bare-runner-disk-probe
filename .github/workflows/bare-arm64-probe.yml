name: Bare ARM64 compile and checkpoint probe
'on':
  workflow_call:
    inputs:
      probe:
        type: string
        default: smoke
      expected_checkpoint_key:
        type: string
        default: ''
      expected_checkpoint_sha:
        type: string
        default: ''
      expected_checkpoint_identity:
        type: string
        default: ''
      expected_base_image:
        type: string
        default: ''
      repair_legacy_input_paths:
        type: boolean
        default: false
      apk_recipient:
        type: string
        default: ''
      apk_output_gib:
        type: number
        default: 11
      apk_jobs:
        type: number
        default: 2
    outputs:
      checkpoint_key:
        value: ${{ jobs.compile-probe.outputs.checkpoint_key }}
      checkpoint_sha:
        value: ${{ jobs.compile-probe.outputs.checkpoint_sha }}
      checkpoint_identity:
        value: ${{ jobs.compile-probe.outputs.checkpoint_identity }}
      base_image:
        value: ${{ jobs.compile-probe.outputs.base_image }}
      checkpoint_saved:
        value: ${{ jobs.compile-probe.outputs.checkpoint_saved }}
      apk_artifact_id:
        value: ${{ jobs.compile-probe.outputs.apk_artifact_id }}
      apk_cache_key:
        value: ${{ jobs.compile-probe.outputs.apk_cache_key }}
      apk_encrypted_sha:
        value: ${{ jobs.compile-probe.outputs.apk_encrypted_sha }}
      apk_encrypted_bytes:
        value: ${{ jobs.compile-probe.outputs.apk_encrypted_bytes }}
  workflow_dispatch:
    inputs:
      probe:
        description: Only the short ARM64 smoke target; use the transfer workflow for APK interruption
        type: choice
        default: smoke
        options:
        - smoke
permissions: {}
jobs:
  compile-probe:
    if: ${{ toJSON(github.event.repository.private) == 'false' && toJSON(github.event.repository.fork) == 'false' && github.ref == 'refs/heads/main'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.probe == 'checkpoint-production' && 350 || inputs.probe == 'checkpoint-large' && 250 || inputs.probe == 'checkpoint-scale' && 190 || 120 }}
    concurrency:
      group: bare-arm64-compile-probe
      cancel-in-progress: false
    outputs:
      checkpoint_key: ${{ steps.identity.outputs.key }}
      checkpoint_sha: ${{ steps.pack-checkpoint.outputs.sha }}
      checkpoint_identity: ${{ steps.pack-checkpoint.outputs.identity }}
      base_image: ${{ steps.prepare.outputs.base_image }}
      checkpoint_saved: ${{ inputs.probe == 'checkpoint-production' && steps.checkpoint-proof.outputs.verified || inputs.probe != 'checkpoint-production' && steps.saved-receipt.outputs.saved || '' }}
      apk_artifact_id: ${{ steps.apk_upload.outcome == 'success' && steps.apk_upload.outputs.artifact-id || '' }}
      apk_cache_key: ${{ steps.apk_fallback_receipt.outputs.key }}
      apk_encrypted_sha: ${{ steps.apk_seal.outputs.sha }}
      apk_encrypted_bytes: ${{ steps.apk_seal.outputs.bytes }}
    env:
      BARE_REV: e776f77629bb915e0f3df63449f1f993cc1b0648
      CHROMIUM_REV: 2f9a11097447f226133bc1a31c787291a5eeab98
      DEPOT_REV: 96a7c1418eedaa6bea333a8941e8a0078681b4d0
      GIT_TERMINAL_PROMPT: '0'
      PROBE_MODE: ${{ inputs.probe }}
      REPAIR_LEGACY_INPUT_PATHS: ${{ inputs.repair_legacy_input_paths && 'true' || 'false' }}
      LEGACY_PRODUCTION_KEY: bare-transfer-v2-42973841138-1-checkpoint-large
      LEGACY_PRODUCTION_REV: ee7b3e891fa6bd76d9c0c2d3c02a9bb3622d92b0
      EXPANDED_PRODUCTION_KEY: bare-transfer-v2-42997174308-1-checkpoint-production
      EXPANDED_PRODUCTION_REV: 9ebb823d437f7e4928b54411d3e515849ff8d519
      PRODUCTION_CAP_BYTES: '3489660928'
      EXPECTED_KEY: ${{ inputs.expected_checkpoint_key }}
    defaults:
      run:
        shell: bash
    steps:
    - name: Validate the bounded mode and producer checkpoint identity
      id: identity
      env:
        EXPECTED_KEY: ${{ inputs.expected_checkpoint_key }}
        EXPECTED_SHA: ${{ inputs.expected_checkpoint_sha }}
        EXPECTED_IDENTITY: ${{ inputs.expected_checkpoint_identity }}
        EXPECTED_BASE: ${{ inputs.expected_base_image }}
        APK_RECIPIENT: ${{ inputs.apk_recipient }}
        APK_OUTPUT_GIB: ${{ inputs.apk_output_gib }}
        APK_JOBS: ${{ inputs.apk_jobs }}
      run: |
        date +%s > "$RUNNER_TEMP/bare-probe-start"
        if [[ $GITHUB_EVENT_NAME != workflow_dispatch || $RUNNER_ENVIRONMENT != github-hosted || $RUNNER_ARCH != X64 ]]; then
          echo 'Expected a manually started GitHub-hosted x64 runner.' >&2
          exit 1
        fi
        case "$PROBE_MODE" in
          smoke|checkpoint-seed) ;;
          checkpoint-restore)
            [[ $EXPECTED_KEY =~ ^bare-transfer-v2-[0-9]+-[0-9]+-checkpoint-seed$ ]]
            [[ $EXPECTED_SHA =~ ^[0-9a-f]{64}$ && $EXPECTED_IDENTITY =~ ^[0-9a-f]{64}$ ]]
            [[ $EXPECTED_BASE =~ ^ubuntu@sha256:[0-9a-f]{64}$ ]]
            ;;
          checkpoint-scale)
            [[ $GITHUB_REPOSITORY == Areal-U/bare-runner-disk-probe ]]
            [[ $EXPECTED_KEY == bare-transfer-v2-42950651335-1-checkpoint-restore ]]
            [[ $EXPECTED_SHA == 0fec6f756b98561191ef3199f86d965b5fe5b58146bcdb64b51f348f0aeab9a3 ]]
            [[ $EXPECTED_IDENTITY == 87c8946d20f1f0f97d494c21291b1bb1865772084f0e1a09577414007c3ae170 ]]
            [[ $EXPECTED_BASE == ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 ]]
            ;;
          checkpoint-large)
            [[ $GITHUB_REPOSITORY == Areal-U/bare-runner-disk-probe ]]
            [[ $EXPECTED_KEY == bare-transfer-v2-42963667278-1-checkpoint-scale ]]
            [[ $EXPECTED_SHA == 62a4793fcbe6e25509d202ac6f180b2ab85c6f52b06f3acaedb4f0aaaf159b72 ]]
            [[ $EXPECTED_IDENTITY == 5a1826fb351f149a8a4132fb21d80acba90d937131ce211c8c0b13d79970a966 ]]
            [[ $EXPECTED_BASE == ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 ]]
            ;;
          checkpoint-production)
            [[ $GITHUB_REPOSITORY == Areal-U/bare-runner-disk-probe ]]
            [[ $EXPECTED_BASE == ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 ]]
            [[ $APK_RECIPIENT =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]
            [[ $APK_OUTPUT_GIB =~ ^(8|9|10|11|12)$ ]]
            [[ $APK_JOBS == 1 || $APK_JOBS == 2 ]]
            if [[ $EXPECTED_KEY == "$LEGACY_PRODUCTION_KEY" ]]; then
              [[ $EXPECTED_SHA == df07eee0870a0d5edc92de47a0a112d56ebb498d3c2bd0cf7229269a048e895b ]]
              [[ $EXPECTED_IDENTITY == c4c736ec4c7f02a1c409f4fbe5919731bc5022d70edf512e17928eb81f2436f9 ]]
            elif [[ $EXPECTED_KEY == "$EXPANDED_PRODUCTION_KEY" ]]; then
              [[ $EXPECTED_SHA == 86d7b940ddde7d343e2924c38f2f52624e1c336f6d7dbef2c0f95961de1b1781 ]]
              [[ $EXPECTED_IDENTITY == 3301cb0743cded0e318d57adf22af8956fc3d8e58630c447d68cd912019b4bcc ]]
            else
              [[ $EXPECTED_KEY =~ ^bare-transfer-v2-[0-9]+-[0-9]+-checkpoint-production$ ]]
              [[ $EXPECTED_SHA =~ ^[0-9a-f]{64}$ && $EXPECTED_IDENTITY =~ ^[0-9a-f]{64}$ ]]
            fi
            ;;
          *) echo 'Only smoke and the bounded two-job checkpoint probe are enabled. The old logs-only APK mode is disabled.' >&2; exit 1 ;;
        esac
        if [[ $REPAIR_LEGACY_INPUT_PATHS == true ]]; then
          [[ $PROBE_MODE == checkpoint-restore ]]
          [[ $EXPECTED_KEY == bare-transfer-v2-42928862523-1-checkpoint-seed ]]
          [[ $EXPECTED_SHA == d03e5ce8221691eec57a5610050931af5d117fe8bb61785f0c93ac89a2676d37 ]]
          [[ $EXPECTED_IDENTITY == fc3b4584696b8239bfc3b04db9490e3c0b722b62b81c54c772b96f27543a8896 ]]
          [[ $EXPECTED_BASE == ubuntu@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11 ]]
        else
          [[ $REPAIR_LEGACY_INPUT_PATHS == false ]]
        fi
        if [[ $PROBE_MODE == smoke || $PROBE_MODE == checkpoint-seed ]]; then
          [[ -z $EXPECTED_KEY && -z $EXPECTED_SHA && -z $EXPECTED_IDENTITY && -z $EXPECTED_BASE ]]
        fi
        if [[ $PROBE_MODE == checkpoint-* ]]; then
          echo "key=bare-transfer-v2-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PROBE_MODE" >> "$GITHUB_OUTPUT"
        fi
    - name: Load the exact CI code before costly preparation
      if: ${{ startsWith(inputs.probe, 'checkpoint-') }}
      timeout-minutes: 5
      run: |
        mkdir -p "$RUNNER_TEMP/bare-ci"
        for file in checkpoint.py build_trial.py bare-arm64-probe.yml bare-checkpoint-transfer.yml; do
          source=$file
          [[ $file != *.yml ]] || source=".github/workflows/$file"
          curl --fail --location --retry 2 --max-time 60 \
            "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/$source" \
            --output "$RUNNER_TEMP/bare-ci/$file"
        done
        python3 -m py_compile "$RUNNER_TEMP/bare-ci/checkpoint.py" "$RUNNER_TEMP/bare-ci/build_trial.py"
    - name: Prepare encrypted APK recovery
      if: ${{ inputs.probe == 'checkpoint-production' }}
      timeout-minutes: 5
      env:
        APK_RECIPIENT: ${{ inputs.apk_recipient }}
      run: |
        set -euo pipefail
        [[ $APK_RECIPIENT =~ ^age1[023456789acdefghjklmnpqrstuvwxyz]{58}$ ]]
        if ! command -v age >/dev/null; then
          sudo -n apt-get update -qq
          sudo -n apt-get install -y -qq age
        fi
        # Check the recipient checksum with age itself. The ciphertext is discarded.
        printf 'Bare recovery preflight\n' | age -r "$APK_RECIPIENT" > /dev/null
    - name: Check repository cache headroom without deleting older checkpoints
      if: ${{ startsWith(inputs.probe, 'checkpoint-') }}
      timeout-minutes: 5
      run: |
        cat > "$RUNNER_TEMP/bare-ci/check-cache-budget.py" <<'PYTHON'
        import json, os, time, urllib.request
        base = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions'
        def get(suffix):
            for attempt in range(3):
                try:
                    request = urllib.request.Request(base + suffix, headers={'Accept': 'application/vnd.github+json', 'User-Agent': 'bare-bounded-checkpoint'})
                    with urllib.request.urlopen(request, timeout=15) as response:
                        return json.load(response)
                except (OSError, ValueError):
                    if attempt == 2:
                        raise
                    time.sleep(2)
        usage = get('/cache/usage')
        caches = []
        for page in range(1, 11):
            batch = get(f'/caches?per_page=100&page={page}')['actions_caches']
            caches.extend(batch)
            if len(batch) < 100:
                break
        else:
            raise SystemExit('Cannot bound cache inventory; stopping before compilation.')
        checkpoints = [item for item in caches if item['key'].startswith('bare-transfer-v2-')]
        gib = 1024**3
        limit_bytes = 10 * gib
        mode = os.environ['PROBE_MODE']
        if mode == 'checkpoint-production':
            parent_key = os.environ['EXPECTED_KEY']
            parents = [item for item in checkpoints
                       if item['key'] == parent_key and item['ref'] == 'refs/heads/main']
            cap = int(os.environ['PRODUCTION_CAP_BYTES'])
            if len(parents) != 1 or not 0 < parents[0]['size_in_bytes'] <= cap:
                raise SystemExit('The exact selected checkpoint is absent or outside the production envelope.')
            if parent_key == os.environ['LEGACY_PRODUCTION_KEY']:
                if (parents[0]['id'], parents[0]['size_in_bytes']) != (10344233799, 1231546287):
                    raise SystemExit('The initial checkpoint receipt differs.')
            if parent_key == os.environ['EXPANDED_PRODUCTION_KEY']:
                if (parents[0]['id'], parents[0]['size_in_bytes']) != (10356203698, 2008166401):
                    raise SystemExit('The expanded production predecessor receipt differs.')
            candidate_bytes = int(os.environ.get('CANDIDATE_BYTES', str(cap)))
            if not 0 < candidate_bytes <= cap:
                raise SystemExit('Candidate size is outside the production envelope.')
            reserve = candidate_bytes + gib
        elif mode in {'checkpoint-scale', 'checkpoint-large'}:
            expected = {
                (10328651052, 'bare-transfer-v2-42928862523-1-checkpoint-seed', 'refs/heads/main', 293033682),
                (10334906371, 'bare-transfer-v2-42950651335-1-checkpoint-restore', 'refs/heads/main', 353327569),
            }
            if mode == 'checkpoint-large':
                expected.add((10338246659, 'bare-transfer-v2-42963667278-1-checkpoint-scale', 'refs/heads/main', 570920535))
            observed = {(item['id'], item['key'], item['ref'], item['size_in_bytes']) for item in checkpoints}
            if len(checkpoints) != len(expected) or observed != expected:
                raise SystemExit('The one-continuation trial requires its exact retained generations.')
            candidate_bytes = int(os.environ.get('CANDIDATE_BYTES', '2952790016'))
            if not 0 < candidate_bytes <= 2952790016:
                raise SystemExit('Scale candidate size is outside the measured trial envelope.')
            reserve = candidate_bytes + gib
        else:
            limit = 0 if os.environ['PROBE_MODE'] == 'checkpoint-seed' else 1
            if len(checkpoints) > limit:
                raise SystemExit('The two-generation experiment limit is reached; keep existing checkpoints.')
            reserve = 3 * gib
        used = max(usage['active_caches_size_in_bytes'], sum(item['size_in_bytes'] for item in caches))
        if used + reserve > limit_bytes:
            raise SystemExit('Insufficient cache headroom; retain existing checkpoints and choose storage first.')
        print(json.dumps({'cache_bytes_observed': used, 'reserved_bytes': reserve, 'limit_bytes': limit_bytes}))
        PYTHON
        python3 "$RUNNER_TEMP/bare-ci/check-cache-budget.py"
    - name: Restore the producer key exactly, including on a consumer-only rerun
      id: restore-checkpoint
      if: ${{ startsWith(inputs.probe, 'checkpoint-') && inputs.probe != 'checkpoint-seed' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ runner.temp }}/bare-official/exchange/checkpoint/checkpoint.tar.gz
        key: ${{ inputs.expected_checkpoint_key }}
        fail-on-cache-miss: true
    - name: Validate the received archive before checkout
      if: ${{ startsWith(inputs.probe, 'checkpoint-') && inputs.probe != 'checkpoint-seed' }}
      timeout-minutes: ${{ inputs.probe == 'checkpoint-production' && 15 || inputs.probe == 'checkpoint-large' && 10 || inputs.probe == 'checkpoint-scale' && 7 || 4 }}
      env:
        CACHE_HIT: ${{ steps.restore-checkpoint.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.restore-checkpoint.outputs.cache-matched-key }}
        EXPECTED_KEY: ${{ inputs.expected_checkpoint_key }}
        EXPECTED_SHA: ${{ inputs.expected_checkpoint_sha }}
        EXPECTED_IDENTITY: ${{ inputs.expected_checkpoint_identity }}
      run: |
        [[ $CACHE_HIT == true && $MATCHED_KEY == "$EXPECTED_KEY" ]]
        archive="$RUNNER_TEMP/bare-official/exchange/checkpoint/checkpoint.tar.gz"
        incoming="${archive%.tar.gz}-input.tar.gz"
        [[ -f $archive && ! -L $archive && ! -e $incoming && ! -L $incoming ]]
        printf '%s  %s\n' "$EXPECTED_SHA" "$archive" | sha256sum --check --strict
        incoming_limits=()
        [[ $PROBE_MODE != checkpoint-large ]] || incoming_limits+=(--scale)
        producer_revision=$GITHUB_SHA
        if [[ $PROBE_MODE == checkpoint-production ]]; then
          if [[ $EXPECTED_KEY == "$LEGACY_PRODUCTION_KEY" ]]; then
            incoming_limits+=(--large)
            producer_revision=$LEGACY_PRODUCTION_REV
          else
            incoming_limits+=(--production)
            if [[ $EXPECTED_KEY == "$EXPANDED_PRODUCTION_KEY" ]]; then
              producer_revision=$EXPANDED_PRODUCTION_REV
            fi
          fi
        fi
        python3 "$RUNNER_TEMP/bare-ci/checkpoint.py" validate-archive "$archive" "${incoming_limits[@]}"
        if [[ $PROBE_MODE == checkpoint-scale ]]; then
          python3 "$RUNNER_TEMP/bare-ci/checkpoint.py" verify-continuation "$archive" \
            --expected-identity 87c8946d20f1f0f97d494c21291b1bb1865772084f0e1a09577414007c3ae170 --ci-revision 40b60fcac3b34d96a3e450848d2374d3b921bf5f
        elif [[ $PROBE_MODE == checkpoint-large ]]; then
          python3 "$RUNNER_TEMP/bare-ci/checkpoint.py" verify-continuation "$archive" --scale \
            --expected-identity 5a1826fb351f149a8a4132fb21d80acba90d937131ce211c8c0b13d79970a966 --ci-revision 5d3f7993c975630d4abf3efe2925aee79e51dc39
        elif [[ $PROBE_MODE == checkpoint-production ]]; then
          python3 "$RUNNER_TEMP/bare-ci/checkpoint.py" verify-continuation "$archive" "${incoming_limits[@]}" \
            --expected-identity "$EXPECTED_IDENTITY" --ci-revision "$producer_revision"
        fi
        python3 "$RUNNER_TEMP/bare-ci/checkpoint.py" inspect-input-paths "$archive" "${incoming_limits[@]}"
        mv -T -- "$archive" "$incoming"
    - name: Reclaim runner space and start the pinned Bare container
      timeout-minutes: 25
      run: |
        if [[ $GITHUB_EVENT_NAME != workflow_dispatch || $RUNNER_ENVIRONMENT != github-hosted || $RUNNER_ARCH != X64 ]]; then
          echo 'Expected a manually started GitHub-hosted x64 runner.' >&2
          exit 1
        fi
        . /etc/os-release
        [[ $ID == ubuntu && $VERSION_ID == 24.04 ]]
        docker_root=$(sudo -n docker info --format '{{.DockerRootDir}}')
        [[ $docker_root == /* ]]
        echo "Runner image: ${ImageVersion:-unknown}"
        sudo -n df -B1 -- "$docker_root"
        awk '/^(MemTotal|MemAvailable|SwapTotal):/' /proc/meminfo

        tool_dirs=(
          /usr/local/lib/android
          /usr/local/share/boost
          /usr/share/dotnet
          /usr/share/swift
          /usr/local/.ghcup
          /opt/ghc
          /usr/lib/google-cloud-sdk
        )
        for path in "${tool_dirs[@]}"; do
          if [[ -d $path && $(realpath -- "$path") == "$path" ]] && ! mountpoint -q -- "$path"; then
            sudo -n rm -rf --one-file-system -- "$path"
          fi
        done
        sudo -n df -B1 -- "$docker_root"

        mkdir -p "$RUNNER_TEMP/bare-official"
        cd "$RUNNER_TEMP/bare-official"
        git init -q
        git fetch --no-tags --depth=1 https://github.com/BareBrowser/bare-browser.git "$BARE_REV"
        git checkout --detach FETCH_HEAD
        [[ $(git rev-parse HEAD) == "$BARE_REV" ]]
        shopt -s nullglob
        patches=(patches/*.patch)
        [[ ${#patches[@]} == 296 ]]
        cp -R patches exchange/
        crx=third_party/ublock_origin/uBlockOrigin-1.75.0.crx
        printf '%s  %s\n' d688ed3f0262ec4f8bdcd4c8f65987c5444c560aeb387a9e02aca1facdfa7046 "$crx" | sha256sum --check --strict
        cp "$crx" exchange/ublock_origin.crx
        awk '/^```gn$/ { gn = 1; next } gn && /^```$/ { exit } gn { print }' docs/build-from-source.md > exchange/args.gn
        printf '%s  %s\n' 6fb681205a50bf9b20d6c1f18a4dd5708bcd99cfc258e577069442a8be2114ab exchange/args.gn | sha256sum --check --strict
        [[ $(python3 tools/version.py gn arm64) == "$(grep '^android_override_version_' exchange/args.gn)" ]]

        if [[ $PROBE_MODE == checkpoint-* ]]; then
          cp "$RUNNER_TEMP/bare-ci/"*.py "$RUNNER_TEMP/bare-ci/"*.yml exchange/
          mkdir -p exchange/checkpoint
          chmod 777 exchange/checkpoint
        fi
        base_image="$REQUESTED_BASE"
        if [[ -z $base_image ]]; then
          docker pull --platform linux/amd64 ubuntu:22.04
          base_image=$(docker image inspect ubuntu:22.04 --format '{{json .RepoDigests}}' | python3 -c 'import json,sys; print(next(value for value in json.load(sys.stdin) if value.startswith("ubuntu@sha256:")))')
        else
          [[ $base_image =~ ^ubuntu@sha256:[0-9a-f]{64}$ ]]
          docker pull --platform linux/amd64 "$base_image"
        fi
        [[ $base_image =~ ^ubuntu@sha256:[0-9a-f]{64}$ ]]
        export BARE_BASE_IMAGE="$base_image"
        python3 - <<'PYTHON'
        import os
        from pathlib import Path
        path = Path('docker/Dockerfile')
        text = path.read_text()
        expected = 'FROM --platform=linux/amd64 ubuntu:22.04'
        if text.splitlines()[0] != expected or text.count(expected) != 1:
            raise SystemExit('Unexpected pinned Bare base image instruction.')
        path.write_text(text.replace(expected, 'FROM --platform=linux/amd64 ' + os.environ['BARE_BASE_IMAGE'], 1))
        PYTHON
        echo "BARE_BASE_IMAGE=$base_image" >> "$GITHUB_ENV"
        echo "base_image=$base_image" >> "$GITHUB_OUTPUT"
        bash builder.sh build
        bash builder.sh start
        docker compose exec -T chromium-builder bash -seu <<'CONTAINER'
        id
        test -w /work
        df -B1 /work
        free_bytes=$(df -B1 --output=avail /work | awk 'NR == 2 { print $1 }')
        if (( free_bytes < 100000000000 )); then
          echo 'Stopping before checkout: the build volume has less than 100 GB free.' >&2
          exit 1
        fi
        CONTAINER
      id: prepare
      env:
        REQUESTED_BASE: ${{ inputs.expected_base_image }}
    - name: Test runner and builder archive handoff before fetching Chromium
      if: ${{ startsWith(inputs.probe, 'checkpoint-') }}
      timeout-minutes: 3
      run: |
        cd "$RUNNER_TEMP/bare-official"
        root=exchange/checkpoint
        [[ ! -e $root/checkpoint.tar.gz && ! -L $root/checkpoint.tar.gz ]]
        fixture=$(mktemp -d "$root/permission-test.XXXXXX")
        trap 'rm -rf --one-file-system -- "$fixture"' EXIT
        chmod 0777 "$fixture"
        mkdir -p "$fixture/source/out/Bare"
        printf 'permission test\n' > "$fixture/source/out/Bare/probe"
        tar -czf "$fixture/input.tar.gz" -C "$fixture/source" out/Bare
        chmod 0644 "$fixture/input.tar.gz"
        digest=$(sha256sum "$fixture/input.tar.gz")
        docker compose exec -T -e "FIXTURE=/exchange/checkpoint/${fixture##*/}" \
          -e "RUNNER_UID=$(id -u)" -e "PROBE_MODE=$PROBE_MODE" chromium-builder bash -seu <<'CONTAINER'
        set -o pipefail
        [[ $(id -u) != "$RUNNER_UID" ]]
        [[ -r $FIXTURE/input.tar.gz && ! -w $FIXTURE/input.tar.gz ]]
        if [[ $PROBE_MODE != checkpoint-seed ]]; then
          [[ -f /exchange/checkpoint/checkpoint-input.tar.gz && -r /exchange/checkpoint/checkpoint-input.tar.gz ]]
        fi
        tar -tzf "$FIXTURE/input.tar.gz" > /dev/null
        candidate=$(mktemp "$FIXTURE/checkpoint-next.XXXXXX")
        tar --format=posix --pax-option=delete=atime,delete=ctime \
          -I 'gzip -1' -cf "$candidate" -C "$FIXTURE/source" out/Bare
        python3 /exchange/checkpoint.py validate-archive "$candidate"
        umask 077
        printf '{"readable":true}\n' > "$FIXTURE/export.json"
        chmod 0644 "$candidate" "$FIXTURE/export.json"
        mv -T -- "$candidate" "$FIXTURE/checkpoint-next.tar.gz"
        CONTAINER
        [[ $(sha256sum "$fixture/input.tar.gz") == "$digest" ]]
        python3 -c 'import json,sys; assert json.load(open(sys.argv[1])) == {"readable": True}' "$fixture/export.json"
        mv -T -- "$fixture/checkpoint-next.tar.gz" "$fixture/checkpoint.tar.gz"
