          third_party/llvm-build/Release+Asserts/bin/ld.lld -r --threads=1 -o "$relocatable" "$object"
          object=$relocatable
        fi
        header=$(LC_ALL=C readelf -h "$object")
        printf '%s\n' "$header"
        grep -Eq 'Machine:[[:space:]]+AArch64' <<< "$header"
        echo 'ARM64 compile probe passed.'
        CONTAINER
    - name: Record final disk and memory diagnostics
      if: ${{ always() }}
      timeout-minutes: 3
      run: |
        awk '/^(MemTotal|MemAvailable|SwapTotal):/' /proc/meminfo
        df -B1 /
        if [[ -f $RUNNER_TEMP/bare-official/docker-compose.yml ]]; then
          cd "$RUNNER_TEMP/bare-official"
          docker inspect --format 'Container status={{.State.Status}} OOMKilled={{.State.OOMKilled}}' chromium-android-builder || true
          docker compose exec -T chromium-builder bash -c '
            df -B1 /work
            for file in memory.max memory.peak memory.swap.max memory.events; do
              path=/sys/fs/cgroup/$file
              if test -r "$path"; then
                printf "%s:\n" "$file"
                cat "$path"
              fi
            done
          ' || true
        fi
    - name: Emit terminal peer outcome for this exact slot
      id: peer_stop
      if: ${{ always() && !cancelled() && inputs.backend == 'draft' && steps.peer_acquire.outcome == 'success' && steps.pack-checkpoint.outputs.checkpoint_advanced !=
        'true' }}
      env:
        FRONTIER: ${{ steps.frontier_finish.outputs.status }}
        TERMINAL: ${{ steps.apk_seal.outputs.terminal }}
        DELIVERY_STATUS: ${{ steps.apk_seal.outputs.status }}
        VERIFY_ONLY: ${{ inputs.verify_frontier_only && 'true' || 'false' }}
        JOB_STATUS: ${{ job.status }}
      run: |-
        set -euo pipefail
        reason=failed
        if [[ $JOB_STATUS == success ]]; then
          if [[ $VERIFY_ONLY == true ]]; then reason=verify-only;
          elif [[ $DELIVERY_STATUS == apk-size-exceeded || $DELIVERY_STATUS == cipher-size-exceeded ]]; then reason=size-exceeded;
          elif [[ $TERMINAL == true ]]; then reason=apk;
          elif [[ $FRONTIER == no-progress ]]; then reason=no-progress; fi
        fi
        python3 preflight28/bridge/normal.py stop --reason "$reason"
    - name: Certify an advanced checkpoint exists before transfer
      if: ${{ !cancelled() && inputs.backend == 'draft' && steps.pack-checkpoint.outputs.checkpoint_advanced == 'true' }}
      run: test -s "$RUNNER_TEMP/r28-normal/checkpoint.cms" && test -s "$RUNNER_TEMP/r28-normal/outcome.json"
    - name: Measure retained relay bytes before uploading the sealed checkpoint
      id: peer_capacity
      if: ${{ always() && !cancelled() && inputs.backend == 'draft' && (steps.peer_stop.outcome == 'success' || steps.pack-checkpoint.outputs.checkpoint_advanced == 'true') }}
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
        R28_RELAY_BYTE_CEILING: ${{ vars.R28_RELAY_BYTE_CEILING }}
      run: python3 preflight28/bridge/outcome_relay.py plan
    - name: Deposit outcome in this run
      id: peer_put_outcome
      uses: ./preflight28/bridge/normal_upload
      continue-on-error: true
      timeout-minutes: ${{ fromJSON(steps.peer_capacity.outputs.upload_minutes || '4') }}
      with:
        name: ${{ steps.peer_names.outputs.outcome_name }}
        path: ${{ steps.pack-checkpoint.outputs.checkpoint_advanced == 'true' && format('{0}/r28-normal/outcome.json{1}{0}/r28-normal/checkpoint.cms', runner.temp, fromJSON('"\n"'))
          || format('{0}/r28-normal/outcome.json', runner.temp) }}
        if-no-files-found: error
        overwrite: false
        retention-days: 1
        compression-level: 0
      if: ${{ !cancelled() && steps.peer_capacity.outputs.decision == 'upload' }}
    - name: Reconcile sealed outcome upload number 1
      id: resolve_relay_1
      if: ${{ !cancelled() && (steps.peer_put_outcome.outcome == 'success' || steps.peer_put_outcome.outcome == 'failure') }}
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_STATUS: ${{ steps.peer_put_outcome.outputs.upload-status }}
        RETURNED_ID: ${{ steps.peer_put_outcome.outputs.artifact-id }}
        RETURNED_DIGEST: ${{ steps.peer_put_outcome.outputs.artifact-digest }}
      run: python3 preflight28/bridge/outcome_relay.py resolve --round 1
    - name: Retry the same sealed files at the same immutable name once
      id: retry_relay
      uses: ./preflight28/bridge/normal_upload
      continue-on-error: true
      timeout-minutes: ${{ fromJSON(steps.peer_capacity.outputs.upload_minutes || '4') }}
      with:
        name: ${{ steps.peer_names.outputs.outcome_name }}
        path: ${{ steps.pack-checkpoint.outputs.checkpoint_advanced == 'true' && format('{0}/r28-normal/outcome.json{1}{0}/r28-normal/checkpoint.cms', runner.temp, fromJSON('"\n"'))
          || format('{0}/r28-normal/outcome.json', runner.temp) }}
        if-no-files-found: error
        overwrite: false
        retention-days: 1
        compression-level: 0
      if: ${{ !cancelled() && steps.resolve_relay_1.outputs.decision == 'retry' }}
    - name: Reconcile sealed outcome upload number 2
      id: resolve_relay_2
      if: ${{ !cancelled() && (steps.retry_relay.outcome == 'success' || steps.retry_relay.outcome == 'failure') }}
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
        SDK_STATUS: ${{ steps.retry_relay.outputs.upload-status }}
        RETURNED_ID: ${{ steps.retry_relay.outputs.artifact-id }}
        RETURNED_DIGEST: ${{ steps.retry_relay.outputs.artifact-digest }}
      run: python3 preflight28/bridge/outcome_relay.py resolve --round 2
    - name: Record the final transfer decision for this slot
      id: relay_final
      if: ${{ always() && !cancelled() && inputs.backend == 'draft' && steps.peer_capacity.outcome == 'success' }}
      env:
        RELAY_STATE: ${{ steps.resolve_relay_2.outputs.decision || steps.resolve_relay_1.outputs.decision || steps.peer_capacity.outputs.decision }}
        RELAY_ID: ${{ steps.resolve_relay_2.outputs.id || steps.resolve_relay_1.outputs.id || steps.peer_capacity.outputs.id }}
      run: python3 preflight28/bridge/outcome_relay.py finish
    - name: Record immutable owner-recoverable ciphertext and expiry
      if: ${{ !cancelled() && inputs.backend == 'draft' && steps.pack-checkpoint.outputs.checkpoint_advanced == 'true' && steps.relay_final.outputs.decision == 'present' }}
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
        RETURNED_ID: ${{ steps.relay_final.outputs.artifact_id }}
      run: |
        set -euo pipefail
        args=()
        [[ -z $RETURNED_ID ]] || args+=(--artifact-id "$RETURNED_ID")
        python3 preflight28/bridge/owner_recovery.py locate --run "$GITHUB_RUN_ID" --ordinal "$R28_SLOT" \
          --head "$R28_HEAD_SHA" --parent-sha "$R28_PARENT_SHA" --claim-id "$R28_COLLECTION_CLAIM" "${args[@]}"
    name: Compile or verify authenticated APK slot ${{ inputs.segment_ordinal }}
  draft-publisher:
    name: Private checkpoint receipt for slot ${{ inputs.segment_ordinal }}
    if: ${{ inputs.backend == 'draft' && github.event_name == 'workflow_dispatch' && github.repository == 'Areal-U/bare-runner-disk-probe' && (github.ref == 'refs/heads/bare-coexist-v2.0.4' || (github.ref == 'refs/heads/bare-r30-s1-restore-20261126' && github.event_name == 'workflow_dispatch' &&
      fromJSON(toJSON(github.event.inputs)).mode == 'verify-r30-s1' && github.actor == 'Areal-U' && github.run_attempt == '1' &&
      inputs.verify_frontier_only && inputs.segment_ordinal == 2 && inputs.parent_run == '45771045621' && inputs.backend == 'draft'))
      && github.actor == 'Areal-U' && github.run_attempt == '1' && inputs.probe == 'checkpoint-production' && inputs.segment_ordinal >= 1 && inputs.segment_ordinal <=
      13 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      actions: read
      contents: write
    env:
      R28_SLOT: ${{ inputs.segment_ordinal }}
      R28_PARENT_SHA: ${{ inputs.expected_checkpoint_sha }}
      R28_PARENT_IDENTITY: ${{ inputs.expected_checkpoint_identity }}
      R28_PARENT_RUN: ${{ inputs.parent_run }}
      R28_EXPECTED_PARENT_KEY: ${{ inputs.expected_checkpoint_key }}
      R28_PARENT_BACKEND: ${{ inputs.backend }}
      R28_PARENT_READBACK_ONLY: ${{ inputs.verify_frontier_only && 'true' || 'false' }}
      R28_PARENT_MANIFEST: ${{ inputs.parent_manifest_id }}
      R28_PARENT_MANIFEST_SHA: ${{ inputs.parent_manifest_sha }}
      R28_HEAD_SHA: ${{ github.sha }}
      R28_OWNER_RECIPIENT: ${{ inputs.apk_recipient }}
      R28_COLLECTION_CLAIM: ${{ inputs.owner_claim_id }}
    outputs:
      relay_no_receipt: ${{ steps.peer_wait_outcome.outputs.outcome_absent }}
      checkpoint_advanced: ${{ steps.publish.outputs.checkpoint_advanced }}
      private_status: ${{ steps.publish.outputs.recovery_status }}
      checkpoint_manifest_id: ${{ steps.publish.outputs.checkpoint_manifest_id }}
      checkpoint_manifest_sha: ${{ steps.publish.outputs.checkpoint_manifest_sha }}
      checkpoint_sha: ${{ steps.publish.outputs.checkpoint_sha }}
      checkpoint_key: ${{ steps.publish.outputs.checkpoint_key }}
      checkpoint_bytes: ${{ steps.publish.outputs.checkpoint_bytes }}
      checkpoint_identity: ${{ steps.publish.outputs.checkpoint_identity }}
      private_readback_verified: ${{ steps.publish.outputs.private_readback_verified }}
    steps:
    - name: Read trusted workflow helpers without retaining credentials
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
        sparse-checkout: |-
          preflight28
          /checkpoint.py
        sparse-checkout-cone-mode: false
    - name: Reserve the relay peak before acquiring a large peer artifact
      run: bash preflight28/bridge/host_space.sh
    - name: Bind peer artifacts to this run and logical slot
      id: peer_names
      run: python3 preflight28/bridge/normal.py names
    - name: Stage the fixed owner-Draft interface
      run: python3 preflight28/transport/prepare.py tools
    - name: Create an ephemeral limited transfer key
      id: peer_key
      timeout-minutes: 4
      env:
        GH_TOKEN: ${{ github.token }}
        CHECK_RUN: ${{ job.check_run_id }}
        CLOCK_SUFFIX: Private checkpoint receipt for slot ${{ inputs.segment_ordinal }}
      run: |-
        set -euo pipefail
        if [[ ! ${CHECK_RUN:-} =~ ^[1-9][0-9]*$ ]]; then
          CHECK_RUN=$(JOB_READ_TOKEN="$GH_TOKEN" python3 -I preflight28/limits/guard.py job-check --job-suffix "$CLOCK_SUFFIX")
        fi
        sender_start=$(JOB_READ_TOKEN="$GH_TOKEN" python3 -I preflight28/limits/guard.py job-clock --check-run "$CHECK_RUN")
        python3 preflight28/bridge/normal.py keygen limited --check-run "$CHECK_RUN" --job-start "$sender_start"
    - name: Discover exact peer key
      id: peer_wait_key
      timeout-minutes: 12
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 preflight28/bridge/normal.py wait key
    - name: Fetch authenticated key by immutable artifact ID
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 4
      with:
        artifact-ids: ${{ steps.peer_wait_key.outputs.id }}
        path: ${{ runner.temp }}/r28-normal/incoming
        merge-multiple: true
    - name: Issue time-limited parent read descriptors bound to the peer
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if ! command -v age >/dev/null; then
          sudo -n apt-get -qq -o Acquire::Retries=2 update
          sudo -n apt-get -qq --no-install-recommends install -y age
        fi
        python3 preflight28/bridge/normal.py issue
        python3 preflight28/bridge/storage_admission.py peer --file "$RUNNER_TEMP/r28-normal/input.cms"
    - name: Deposit descriptor in this run
      id: peer_put_descriptor
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      timeout-minutes: 4
      with:
        name: ${{ steps.peer_names.outputs.descriptor_name }}
        path: ${{ runner.temp }}/r28-normal/input.cms
        if-no-files-found: error
        overwrite: false
        retention-days: 1
        compression-level: 0
    - name: Discover exact peer outcome
      id: peer_wait_outcome
      timeout-minutes: 315
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 preflight28/bridge/normal.py wait outcome
    - name: Fetch authenticated outcome by immutable artifact ID
      if: ${{ steps.peer_wait_outcome.outputs.id != '' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 10
      with:
        artifact-ids: ${{ steps.peer_wait_outcome.outputs.id }}
        path: ${{ runner.temp }}/r28-normal/incoming
        merge-multiple: true
    - name: Receive bounded ciphertext and independently verify fixed private publication
      if: ${{ steps.peer_wait_outcome.outputs.id != '' }}
      id: publish
      timeout-minutes: 21
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 preflight28/bridge/normal.py publish
