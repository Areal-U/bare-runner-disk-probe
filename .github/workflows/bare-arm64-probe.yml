        grep -F 'ninja: no work to do.' /exchange/checkpoint/apk-objects-noop.log
        python3 /exchange/checkpoint.py verify-object "$object" out/Bare/checkpoint-object.json
        python3 /exchange/checkpoint.py verify-evidence out/Bare/checkpoint-evidence.json
        if [[ $PROBE_MODE == checkpoint-production ]]; then
