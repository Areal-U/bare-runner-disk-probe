name: Bare recovery pilot
run-name: Bare recovery pilot
'on':
  push:
    branches: [work-bare-recovery-pilot-20261113]
    paths: [.github/bare-recovery-pilot/start-20261113.txt]
permissions: {}
jobs:
  recovery-pilot:
    if: github.repository == 'Areal-U/bare-runner-disk-probe' && github.ref == 'refs/heads/work-bare-recovery-pilot-20261113'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      receipt_sha: ${{ steps.receipt.outputs.sha }}
    steps:
      - name: Fail once and write a test receipt on retry
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          if [[ $GITHUB_RUN_ATTEMPT == 1 ]]; then
            echo 'BARE_RECOVERY_PILOT_EXPECTED_FAILURE' >&2
            exit 42
          fi
          [[ $GITHUB_RUN_ATTEMPT == 2 ]]
          receipt="$RUNNER_TEMP/bare-recovery-pilot.txt"
          printf 'Bare recovery pilot\nrun=%s\nattempt=%s\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" > "$receipt"
          digest=$(sha256sum -- "$receipt")
          printf 'sha=%s\n' "${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Upload the test receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bare-recovery-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bare-recovery-pilot.txt
          if-no-files-found: error
          retention-days: 3
  readback:
    name: Verify test receipt on a separate runner
    needs: recovery-pilot
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Download the test receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: bare-recovery-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bare-recovery-readback
      - name: Verify the receipt checksum and run identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.recovery-pilot.outputs.receipt_sha }}
        run: |
          set -euo pipefail
          [[ $GITHUB_RUN_ATTEMPT == 2 && $EXPECTED_SHA =~ ^[0-9a-f]{64}$ ]]
          receipt="$RUNNER_TEMP/bare-recovery-readback/bare-recovery-pilot.txt"
          printf '%s  %s\n' "$EXPECTED_SHA" "$receipt" | sha256sum --check --strict
          printf 'Bare recovery pilot\nrun=%s\nattempt=%s\ncommit=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SHA" | cmp -- "$receipt" -
          printf 'BARE_RECOVERY_PILOT_READBACK_OK sha256=%s\n' "$EXPECTED_SHA"
