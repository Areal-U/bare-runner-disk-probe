name: Verify one public Chromium seed through the normal Bare Android checkout
on:
  workflow_call:
permissions: {}
jobs:
  full-android-checkout:
    if: ${{ github.repository == 'Areal-U/bare-runner-disk-probe' && !github.event.repository.private && !github.event.repository.fork && github.event_name == 'workflow_dispatch' && github.run_attempt == '1' && github.ref == 'refs/heads/bare-next-build-prep-20261125' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    permissions:
      contents: read
      actions: read
    env:
      GIT_TERMINAL_PROMPT: '0'
    steps:
    - name: Check out the fixed diagnostics revision
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        persist-credentials: false
    - name: Validate the existing immutable input and stage the normal builder
      id: fixture
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 next_build/trials/android_sync.py setup
    - name: Start the same pinned Ubuntu Bare builder
      timeout-minutes: 25
      env:
        PROBE_MODE: checkpoint-production
        CHECKPOINT_BACKEND: draft
      run: |
        cd "$ANDROID_TRIAL/bare"
        bash "$ANDROID_TRIAL/builder.sh"
        echo "SEED_DOWNLOAD_START=$(date +%s%N)" >> "$GITHUB_ENV"
    - name: Fetch the existing public source by exact producer and Artifact ID
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      timeout-minutes: 9
      with:
        github-token: ${{ github.token }}
        repository: ${{ github.repository }}
        run-id: ${{ steps.fixture.outputs.run }}
        artifact-ids: ${{ steps.fixture.outputs.id }}
        merge-multiple: true
        path: ${{ steps.fixture.outputs.root }}/bare/exchange/seed
    - name: Restore and run the full pinned Linux and Android gclient solution
      timeout-minutes: 45
      run: |
        python3 -c 'import os,time; print("BARE_ANDROID_ARTIFACT_FETCH_S", round((time.time_ns()-int(os.environ["SEED_DOWNLOAD_START"]))/1e9, 3))'
        cd "$ANDROID_TRIAL/bare"
        python3 "$GITHUB_WORKSPACE/next_build/trials/android_sync.py" watch \
          docker compose exec -T -e DEPOT_REV -e CHROMIUM_REV -e GIT_TERMINAL_PROMPT chromium-builder \
          timeout --kill-after=2m 40m bash -eu /exchange/next_build/checkout.sh
