name: Bare next build - grouped Android shard comparison
on:
  workflow_call:
    inputs:
      storage_ceiling:
        type: string
        required: true
      storage_until:
        type: string
        required: true
permissions:
  contents: read
  actions: read
env:
  NEXT_SPLIT_GROUP: field
  BARE_NEXT_FRESH_RUN_GATE: '1'
  R28_STORAGE_CEILING: ${{ inputs.storage_ceiling }}
  R28_STORAGE_UNTIL: ${{ inputs.storage_until }}
  R28_RELAY_BYTE_CEILING: ${{ vars.R28_RELAY_BYTE_CEILING }}
jobs:
  central:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      TRIAL: ${{ github.workspace }}/preflight28/next_split
    steps:
      - name: Record VM availability
        run: date +%s.%N > "$RUNNER_TEMP/first"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Issue one-run certificate
        run: |
          python3 "$TRIAL/field.py" stamp first
          python3 "$TRIAL/field.py" stamp ready_for_key
          python3 "$TRIAL/field.py" cert
      - name: Admit this ticket immediately before storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$TRIAL/field.py" admit ticket
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: split-ticket-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/next-split/cert.pem
          if-no-files-found: error
          retention-days: 1
      - name: Build the first half on the receiving VM
        run: |
          python3 "$TRIAL/field.py" stamp prep_start
          bash "$TRIAL/prepare.sh"
          python3 "$TRIAL/field.py" stamp prep_done
          cd "$RUNNER_TEMP/next-split"
          python3 "$TRIAL/cohort.py" central
          python3 "$TRIAL/field.py" stamp half_done
      - name: Import, archive and check subsequent no-op
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/next-split"
          python3 "$TRIAL/field.py" open
          python3 "$TRIAL/cohort.py" join
          python3 "$TRIAL/field.py" stamp merged
      - name: Compare against the same 147 units on one VM
        run: |
          cd "$RUNNER_TEMP/next-split"
          python3 "$TRIAL/cohort.py" solo
          python3 "$TRIAL/field.py" report
  peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      TRIAL: ${{ github.workspace }}/preflight28/next_split
    steps:
      - name: Record VM availability
        run: date +%s.%N > "$RUNNER_TEMP/first"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the other half from independent public inputs
        run: |
          python3 "$TRIAL/field.py" stamp first
          python3 "$TRIAL/field.py" stamp prep_start
          bash "$TRIAL/prepare.sh"
          python3 "$TRIAL/field.py" stamp prep_done
          cd "$RUNNER_TEMP/next-split"
          python3 "$TRIAL/cohort.py" peer
          python3 "$TRIAL/field.py" stamp half_done
      - name: Seal test outputs for the receiving VM
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$TRIAL/field.py" seal
      - name: Admit this parcel immediately before storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$TRIAL/field.py" admit parcel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: split-parcel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/next-split/exchange.der
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
